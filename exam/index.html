christopher_88d98873518c2aa6.mp3", "eric": "audio/eric_c1c61e1f35866bc1.mp3", "ava": "audio/ava_2a9f8438e791d691.mp3"}}, {"t": "Having more atoms in the upper level than in the lower one is called population inversion.", "a": {"steffan": "audio/steffan_2bde2a925d38d87e.mp3", "guy": "audio/guy_22ec980e62cbf951.mp3", "christopher": "audio/christopher_37924235200312cf.mp3", "eric": "audio/eric_8095dc57d0eac56c.mp3", "ava": "audio/ava_c5642d4740d42077.mp3"}}, {"t": "This is far from thermal equilibrium, where the lower level is always more populated.", "a": {"steffan": "audio/steffan_68770c90d4ca83b9.mp3", "guy": "audio/guy_0ce54323153db982.mp3", "christopher": "audio/christopher_73f86b686a420817.mp3", "eric": "audio/eric_d99ec10c05b9d0b2.mp3", "ava": "audio/ava_e9236a108ffeea5f.mp3"}}, {"t": "The susceptibility comes out the same as before, but with the opposite sign.", "a": {"steffan": "audio/steffan_91f3955b746c4427.mp3", "guy": "audio/guy_0eb386ec27a019d7.mp3", "christopher": "audio/christopher_67ff3f9febe04a65.mp3", "eric": "audio/eric_af508f6276fc5c0b.mp3", "ava": "audio/ava_80f1d4132e7eeadb.mp3"}}, {"t": "So now chi double prime is negative.", "a": {"steffan": "audio/steffan_c9c7bc2feee9ae9b.mp3", "guy": "audio/guy_235b65ac468da821.mp3", "christopher": "audio/christopher_327148d55a338368.mp3", "eric": "audio/eric_c67374926aa9f949.mp3", "ava": "audio/ava_766ff18393cd85a0.mp3"}}, {"t": "That makes k double prime negative, so the amplitude grows as the wave travels. The light is amplified.", "a": {"steffan": "audio/steffan_2f0728b97db6c5f2.mp3", "guy": "audio/guy_825a6d109fa4cfca.mp3", "christopher": "audio/christopher_334c681308c2469c.mp3", "eric": "audio/eric_630cf1171a4203a9.mp3", "ava": "audio/ava_cf50a100c676edb6.mp3"}}, {"t": "The process behind this is stimulated emission, which now dominates over absorption.", "a": {"steffan": "audio/steffan_740756abde990e7f.mp3", "guy": "audio/guy_dc31de943b5ef150.mp3", "christopher": "audio/christopher_098dc9408a606127.mp3", "eric": "audio/eric_c14af896c8bf3afb.mp3", "ava": "audio/ava_a5791f0c4f927e8b.mp3"}}, {"t": "This is where the name laser comes from: light amplification by stimulated emission of radiation.", "a": {"steffan": "audio/steffan_61ef282b388a0a5b.mp3", "guy": "audio/guy_68bbe46da2fd2dc9.mp3", "christopher": "audio/christopher_c7972b9d20e77079.mp3", "eric": "audio/eric_e73435574543d9e7.mp3", "ava": "audio/ava_07cc70b8908a698e.mp3"}}, {"t": "We describe this with the gain per unit length, g. The change of the intensity along z is g times the intensity.", "a": {"steffan": "audio/steffan_8f196041767599d8.mp3", "guy": "audio/guy_eb29b6c04b0bdad8.mp3", "christopher": "audio/christopher_a6313c0e1c16397c.mp3", "eric": "audio/eric_a34ed1eddd2364e9.mp3", "ava": "audio/ava_7d8d4328298d2651.mp3"}}, {"t": "So with a positive gain, the intensity grows exponentially along the medium.", "a": {"steffan": "audio/steffan_821f984a073528b5.mp3", "guy": "audio/guy_14551ef8a01ba8a3.mp3", "christopher": "audio/christopher_dcf0980d19b101cc.mp3", "eric": "audio/eric_fcd4cefa472952ea.mp3", "ava": "audio/ava_47986179c0959943.mp3"}}]}, {"title": "Feeding both levels", "items": [{"t": "In general, both levels are fed, level a at rate lambda a, and level b at rate lambda b.", "a": {"steffan": "audio/steffan_018d35e40499312e.mp3", "guy": "audio/guy_6d6658dac162a55e.mp3", "christopher": "audio/christopher_6126b8c0306b8910.mp3", "eric": "audio/eric_50e6abba5affb2f6.mp3", "ava": "audio/ava_c65d2dfb26330fb0.mp3"}}, {"t": "Without light, the populations are simply lambda a over gamma D and lambda b over gamma D. Call them the unsaturated populations.", "a": {"steffan": "audio/steffan_d51c0e8ef11dd212.mp3", "guy": "audio/guy_5eced62f0605bc56.mp3", "christopher": "audio/christopher_350e76a0c8ed5f0c.mp3", "eric": "audio/eric_25f535dcb524adaf.mp3", "ava": "audio/ava_4de75e7ad73b4872.mp3"}}, {"t": "With light, each population moves toward the other one, by an amount set by s over one plus s.", "a": {"steffan": "audio/steffan_af63c5b16461186a.mp3", "guy": "audio/guy_84c69a1b8690a409.mp3", "christopher": "audio/christopher_775291f00cd2d40d.mp3", "eric": "audio/eric_c76d442fbc08e725.mp3", "ava": "audio/ava_5e01c8cfeb7dba2c.mp3"}}, {"t": "The most important result is the population difference.", "a": {"steffan": "audio/steffan_e624e1b5c5fb2ebf.mp3", "guy": "audio/guy_2d5c4591d16b2f85.mp3", "christopher": "audio/christopher_b8518fcd62423cdc.mp3", "eric": "audio/eric_3a51155adc7ac348.mp3", "ava": "audio/ava_124e7099cfbc6a5b.mp3"}}, {"t": "N b minus N a equals the unsaturated difference, divided by one plus s.", "a": {"steffan": "audio/steffan_5d8638a91f209369.mp3", "guy": "audio/guy_75737deb092fbfee.mp3", "christopher": "audio/christopher_527f1ef79ad6d12d.mp3", "eric": "audio/eric_04424e8ec3ccc44a.mp3", "ava": "audio/ava_57910e5394b796c3.mp3"}}, {"t": "So the light always reduces the difference, and at very high intensity the difference goes to zero.", "a": {"steffan": "audio/steffan_ea905823312caa00.mp3", "guy": "audio/guy_2852006c7b51e0c3.mp3", "christopher": "audio/christopher_4b10fe05dbfdfcdc.mp3", "eric": "audio/eric_390fac7ed8cc233f.mp3", "ava": "audio/ava_6cf2aae5e288e419.mp3"}}, {"t": "The susceptibility is chi one times N a minus N b, divided by N.", "a": {"steffan": "audio/steffan_7fd697d030b83ac9.mp3", "guy": "audio/guy_a02bd3642fd56b40.mp3", "christopher": "audio/christopher_80752ba65b44d7c7.mp3", "eric": "audio/eric_95eba14235d5f8c1.mp3", "ava": "audio/ava_e38b54f845d93aa6.mp3"}}, {"t": "So what matters for absorption or gain is only the population difference.", "a": {"steffan": "audio/steffan_560c911820dea279.mp3", "guy": "audio/guy_e8ad4da250147cc5.mp3", "christopher": "audio/christopher_566a2522cb232af9.mp3", "eric": "audio/eric_4d832a84f7c6b9fd.mp3", "ava": "audio/ava_2f75d169e50909fd.mp3"}}, {"t": "If more atoms are in a, the medium absorbs. If more atoms are in b, the medium amplifies.", "a": {"steffan": "audio/steffan_463c51e31d737027.mp3", "guy": "audio/guy_209a36e777f01f91.mp3", "christopher": "audio/christopher_5e8d06b7d93bc147.mp3", "eric": "audio/eric_f3e22701bb0a425b.mp3", "ava": "audio/ava_949d025b99f07bb6.mp3"}}, {"t": "The gain follows the same rule: g equals the unsaturated gain, divided by one plus s.", "a": {"steffan": "audio/steffan_df970ffa5a1980aa.mp3", "guy": "audio/guy_7e4c30c7240e8b8b.mp3", "christopher": "audio/christopher_bf0cf2cd332911a0.mp3", "eric": "audio/eric_ddeb34faa19bce6a.mp3", "ava": "audio/ava_18e6220387627c85.mp3"}}, {"t": "The unsaturated gain is proportional to the unsaturated population difference.", "a": {"steffan": "audio/steffan_01227e100b6ba5b8.mp3", "guy": "audio/guy_70571abcc20f111a.mp3", "christopher": "audio/christopher_48e6e979b72c4135.mp3", "eric": "audio/eric_84c7c9e09e79d22f.mp3", "ava": "audio/ava_ccceb64d5a7c860a.mp3"}}, {"t": "So when the light gets strong, the gain drops. This is gain saturation.", "a": {"steffan": "audio/steffan_c5b547179ccfd1ed.mp3", "guy": "audio/guy_7f0bbddf6f7d2b38.mp3", "christopher": "audio/christopher_cba4da938cf20729.mp3", "eric": "audio/eric_59a7e83b16bce4f5.mp3", "ava": "audio/ava_0f50d0939fa65632.mp3"}}, {"t": "It comes from the competition between stimulated emission, which amplifies, and absorption, which attenuates.", "a": {"steffan": "audio/steffan_0fbc776b35a325a8.mp3", "guy": "audio/guy_9a5dcc34e996f163.mp3", "christopher": "audio/christopher_9603f0fb5f409193.mp3", "eric": "audio/eric_ff131fa986bc733c.mp3", "ava": "audio/ava_ddbbca8e0fd71b27.mp3"}}]}, {"title": "Rate equations", "items": [{"t": "All of this can be written in a very simple form: the rate equations.", "a": {"steffan": "audio/steffan_be85973ec07a4116.mp3", "guy": "audio/guy_a3889cd69a562feb.mp3", "christopher": "audio/christopher_b0fe203af78fb638.mp3", "eric": "audio/eric_80dfffbc7c8a86f5.mp3", "ava": "audio/ava_f8611833bc545b4b.mp3"}}, {"t": "For each level, we just add up every process that brings atoms in or takes them out.", "a": {"steffan": "audio/steffan_7ef71ebc0c2664b6.mp3", "guy": "audio/guy_b0ece931c199bd47.mp3", "christopher": "audio/christopher_d975cdf0c908f95b.mp3", "eric": "audio/eric_51a37212a1d5bbe7.mp3", "ava": "audio/ava_a65b008638599b77.mp3"}}, {"t": "For level b: atoms come in by feeding and by absorption from a. They leave by decay and by stimulated emission down to a.", "a": {"steffan": "audio/steffan_0c371fbcf05bf10c.mp3", "guy": "audio/guy_e253e901e8e5b17a.mp3", "christopher": "audio/christopher_e30bba3cdae34c0f.mp3", "eric": "audio/eric_720ff2f2372df236.mp3", "ava": "audio/ava_6efc4d3296c01dde.mp3"}}, {"t": "For level a, it is the mirror image.", "a": {"steffan": "audio/steffan_845f2e1f671cb211.mp3", "guy": "audio/guy_22e3d8d4ebf7f3cb.mp3", "christopher": "audio/christopher_8b9fdfd009904860.mp3", "eric": "audio/eric_ff1cafd7121862e4.mp3", "ava": "audio/ava_c9b4ef841eda7174.mp3"}}, {"t": "The absorption rate is gamma D times s over two, times N a.", "a": {"steffan": "audio/steffan_aa73aa71cef04b79.mp3", "guy": "audio/guy_4328e638e80d75c5.mp3", "christopher": "audio/christopher_37a778fb065d6aca.mp3", "eric": "audio/eric_b6cbfbd9587d1ffe.mp3", "ava": "audio/ava_083b90f6721ad3bd.mp3"}}, {"t": "The stimulated emission rate is gamma D times s over two, times N b.", "a": {"steffan": "audio/steffan_4dee63bcd239f2d7.mp3", "guy": "audio/guy_28cb9bc93713c295.mp3", "christopher": "audio/christopher_dcc08bc627e0fc87.mp3", "eric": "audio/eric_f68e929bcbd17f5b.mp3", "ava": "audio/ava_f8e5a3d687b988cc.mp3"}}, {"t": "The two rates have the same coefficient. Einstein showed in 1917 that this must be so.", "a": {"steffan": "audio/steffan_67bf3175d574ae6f.mp3", "guy": "audio/guy_489a20c3e4380bc1.mp3", "christopher": "audio/christopher_def23687ac81d272.mp3", "eric": "audio/eric_56b2c79101e0f543.mp3", "ava": "audio/ava_90f560bb2b733e4c.mp3"}}, {"t": "Setting everything to steady state gives back exactly the populations we found before.", "a": {"steffan": "audio/steffan_94b9528b69928dce.mp3", "guy": "audio/guy_79547a91697edce0.mp3", "christopher": "audio/christopher_17a8ebbcf2d66b2c.mp3", "eric": "audio/eric_8fcb0eed6317b9b4.mp3", "ava": "audio/ava_2954d7261159d45a.mp3"}}, {"t": "Rate equations are simple and easy to extend, for example to levels with different lifetimes.", "a": {"steffan": "audio/steffan_1991f08b487a541b.mp3", "guy": "audio/guy_646a2704d9385df0.mp3", "christopher": "audio/christopher_025b6faba52a7c50.mp3", "eric": "audio/eric_118606b14327579b.mp3", "ava": "audio/ava_34c660b9bdbd18df.mp3"}}, {"t": "But they have a limit: they only track populations, not phases.", "a": {"steffan": "audio/steffan_af765c5f7d370bfb.mp3", "guy": "audio/guy_fe66114099fbafbd.mp3", "christopher": "audio/christopher_9990ca7023a3391f.mp3", "eric": "audio/eric_214e89379be08ceb.mp3", "ava": "audio/ava_d97d7e2d19947fe4.mp3"}}, {"t": "So they cannot give the atomic dipole, and they cannot give the full susceptibility. They only give the population difference that multiplies it.", "a": {"steffan": "audio/steffan_8487d13f29303bcc.mp3", "guy": "audio/guy_130e6ae56f68fc9c.mp3", "christopher": "audio/christopher_70abbb3cd516575d.mp3", "eric": "audio/eric_723b6a5ac50f4203.mp3", "ava": "audio/ava_133d8e664fd2cc9c.mp3"}}]}, {"title": "Cross section and laser gain", "items": [{"t": "There is a simple photon picture behind the rate equations.", "a": {"steffan": "audio/steffan_4fce93226beef15a.mp3", "guy": "audio/guy_f5fdd64ceb7dc101.mp3", "christopher": "audio/christopher_fd148a3838062af8.mp3", "eric": "audio/eric_cf456ddb702ad6f1.mp3", "ava": "audio/ava_bcb99b4c43b9d24f.mp3"}}, {"t": "A light beam carries a photon flux: the number of photons per unit area per second.", "a": {"steffan": "audio/steffan_a5e0fdd02cfae111.mp3", "guy": "audio/guy_b000ba1a9ab9ebc8.mp3", "christopher": "audio/christopher_18183495947bdc42.mp3", "eric": "audio/eric_fb061cf7bf3912b3.mp3", "ava": "audio/ava_18e498b1b28c82df.mp3"}}, {"t": "The rate at which one atom absorbs is the photon flux times a constant with units of area, called the cross section, sigma.", "a": {"steffan": "audio/steffan_e6d1a299c1b5b8f4.mp3", "guy": "audio/guy_6da96be08d973092.mp3", "christopher": "audio/christopher_711cc46b7319612c.mp3", "eric": "audio/eric_8ce9272235fab784.mp3", "ava": "audio/ava_5b31968bfab0019e.mp3"}}, {"t": "Stimulated emission has the same cross section.", "a": {"steffan": "audio/steffan_550cfcb0ec6488b7.mp3", "guy": "audio/guy_e5cb62391cac2b3a.mp3", "christopher": "audio/christopher_d7e6bef3f350b5b7.mp3", "eric": "audio/eric_c179a779645221e2.mp3", "ava": "audio/ava_52004d521ff21c8d.mp3"}}, {"t": "Going through a thin slice of the medium, absorption removes photons from the beam, and stimulated emission adds photons to it.", "a": {"steffan": "audio/steffan_3e7802ee5c667e24.mp3", "guy": "audio/guy_83396c94ce09df49.mp3", "christopher": "audio/christopher_7cb1609f8ec11e82.mp3", "eric": "audio/eric_76d9ed1bb36b6816.mp3", "ava": "audio/ava_df028e22e6355391.mp3"}}, {"t": "So the photon flux changes along z at a rate of n b minus n a, times sigma, times the flux, where n a and n b are the densities of atoms in each level.", "a": {"steffan": "audio/steffan_373bd780fa255306.mp3", "guy": "audio/guy_45c3f3f70a47526a.mp3", "christopher": "audio/christopher_28ec236231259bf0.mp3", "eric": "audio/eric_d126681c76e48688.mp3", "ava": "audio/ava_f371200e0bdd008c.mp3"}}, {"t": "The gain per unit length is therefore n b minus n a, times sigma.", "a": {"steffan": "audio/steffan_5aac84764387f4e2.mp3", "guy": "audio/guy_0514bedd99af64aa.mp3", "christopher": "audio/christopher_ac7b27c00e3357d9.mp3", "eric": "audio/eric_a84ae3b3ae4b9d4b.mp3", "ava": "audio/ava_3d8e3c918482da9c.mp3"}}, {"t": "This is a basic equation for describing lasers.", "a": {"steffan": "audio/steffan_b1b327fc78371b85.mp3", "guy": "audio/guy_d7aa9ccbed001c44.mp3", "christopher": "audio/christopher_6d7762e0d62346c7.mp3", "eric": "audio/eric_ef66a5f123c1301b.mp3", "ava": "audio/ava_be012aefe71415af.mp3"}}, {"t": "If all atoms are in the lower level, the beam decays exponentially, with a decay length of one over n a times sigma. This is the Beer-Lambert law.", "a": {"steffan": "audio/steffan_a273e126ad87c23a.mp3", "guy": "audio/guy_958d5243cfc3a94a.mp3", "christopher": "audio/christopher_8fafe6b98ff56e5e.mp3", "eric": "audio/eric_a0697babd64d7e00.mp3", "ava": "audio/ava_1067d52e20d19db7.mp3"}}, {"t": "On resonance, the cross section is of the order of the wavelength squared.", "a": {"steffan": "audio/steffan_f066d336b8ffabc7.mp3", "guy": "audio/guy_8400f40feeab5f14.mp3", "christopher": "audio/christopher_d33e4811f8e574c6.mp3", "eric": "audio/eric_f6b4cd236f033871.mp3", "ava": "audio/ava_775a08b34f45725c.mp3"}}]}]}, {"num": "5", "name": "Lasers", "sections": [{"title": "What a laser needs", "items": [{"t": "A laser needs two things.", "a": {"steffan": "audio/steffan_4d2284adb41d2b97.mp3", "guy": "audio/guy_c41bd5db3b6e22e9.mp3", "christopher": "audio/christopher_43475a94a59d3f7a.mp3", "eric": "audio/eric_4bb751379f4322c8.mp3", "ava": "audio/ava_d936ff451b4d8d51.mp3"}}, {"t": "First, a gain medium with population inversion, so that light passing through it is amplified.", "a": {"steffan": "audio/steffan_2df324d71536e367.mp3", "guy": "audio/guy_977126d807cf7b89.mp3", "christopher": "audio/christopher_17fe66599e7adac3.mp3", "eric": "audio/eric_cb7c472eb7252398.mp3", "ava": "audio/ava_84a8800da5e6feb8.mp3"}}, {"t": "Second, an optical cavity: mirrors that send the light back through the gain medium again and again.", "a": {"steffan": "audio/steffan_b7874e73100d2343.mp3", "guy": "audio/guy_4d6c6f7206ee99cf.mp3", "christopher": "audio/christopher_b3d87417e98e5229.mp3", "eric": "audio/eric_ae5aa1009aa77bc1.mp3", "ava": "audio/ava_23ae0e4500d27d30.mp3"}}, {"t": "The cavity provides feedback, and feedback turns an amplifier into an oscillator.", "a": {"steffan": "audio/steffan_4dd065a2a312697a.mp3", "guy": "audio/guy_61a56ce8621337fb.mp3", "christopher": "audio/christopher_c8d4ce793948febc.mp3", "eric": "audio/eric_ca6e26639070902d.mp3", "ava": "audio/ava_a59010b233759cbf.mp3"}}]}, {"title": "The lasing threshold", "items": [{"t": "Light that goes once through the gain medium is amplified by the single-pass gain, G.", "a": {"steffan": "audio/steffan_502d26bda5795f98.mp3", "guy": "audio/guy_b36e9c2a816c57ed.mp3", "christopher": "audio/christopher_6a51760b30cbd250.mp3", "eric": "audio/eric_028ce0e0ce0207e2.mp3", "ava": "audio/ava_d716f04e99ab29ba.mp3"}}, {"t": "G is e to the power of the gain per unit length times the length of the medium.", "a": {"steffan": "audio/steffan_1201dd17795db041.mp3", "guy": "audio/guy_338b4967f460a0d5.mp3", "christopher": "audio/christopher_bf83a3d37a5f7b85.mp3", "eric": "audio/eric_252a5a8c71b1fa2a.mp3", "ava": "audio/ava_077e804393a30a0b.mp3"}}, {"t": "At the output mirror, a fraction T of the light leaves the cavity, and a fraction R, equal to one minus T, is reflected back.", "a": {"steffan": "audio/steffan_f52b5db0d1405a85.mp3", "guy": "audio/guy_4a8dccf1169d2cb0.mp3", "christopher": "audio/christopher_e4d901eb6383ece1.mp3", "eric": "audio/eric_833d2f9c6c061ba4.mp3", "ava": "audio/ava_be1abcbc98c34095.mp3"}}, {"t": "There are also other losses, like absorption and scattering at the mirrors. We collect them in one loss factor, A.", "a": {"steffan": "audio/steffan_83c24f92376ed3a9.mp3", "guy": "audio/guy_4445673dafb4eb89.mp3", "christopher": "audio/christopher_6d6d85e74b400edb.mp3", "eric": "audio/eric_e8420e5fbbe98c2a.mp3", "ava": "audio/ava_95ada21d700a8409.mp3"}}, {"t": "For the laser to start, the light must come back stronger after one round trip than it started.", "a": {"steffan": "audio/steffan_967210ffb6352a83.mp3", "guy": "audio/guy_c83393936e417e51.mp3", "christopher": "audio/christopher_5d02355e4b7c7141.mp3", "eric": "audio/eric_a2549a3674fcd903.mp3", "ava": "audio/ava_4e516e966ccd743e.mp3"}}, {"t": "So the unsaturated gain times one minus T times one minus A must be larger than one.", "a": {"steffan": "audio/steffan_914ba9e5603a4202.mp3", "guy": "audio/guy_f0fbc89f037b8176.mp3", "christopher": "audio/christopher_8fb1c2277b91a775.mp3", "eric": "audio/eric_12e1af94a726946c.mp3", "ava": "audio/ava_ca04cc5435f318af.mp3"}}, {"t": "When gain and losses are small, this simply says: the gain must be larger than the total losses.", "a": {"steffan": "audio/steffan_f83e4b254fbddc46.mp3", "guy": "audio/guy_7bcc2e95c988de83.mp3", "christopher": "audio/christopher_f1fb2d85f35caf5f.mp3", "eric": "audio/eric_1d0bc0b8d45ef3ae.mp3", "ava": "audio/ava_0eaf857404889015.mp3"}}, {"t": "Notice that no input light is needed. The oscillation starts from noise, from photons that are spontaneously emitted into the cavity.", "a": {"steffan": "audio/steffan_cf8a706696c99d4a.mp3", "guy": "audio/guy_7bc6f6448cccaf89.mp3", "christopher": "audio/christopher_bf25c333c5fe763c.mp3", "eric": "audio/eric_3399f1eec1386317.mp3", "ava": "audio/ava_8a484dc9f8467495.mp3"}}]}, {"title": "The steady state", "items": [{"t": "Above threshold, the light in the cavity grows. But it cannot grow forever.", "a": {"steffan": "audio/steffan_519f3a2a1458beab.mp3", "guy": "audio/guy_6338ca61ee382964.mp3", "christopher": "audio/christopher_08e89a4a7dfcce45.mp3", "eric": "audio/eric_4b0d0ec8541a130f.mp3", "ava": "audio/ava_4ff0d4cf93fa299c.mp3"}}, {"t": "As the intensity grows, the gain saturates and becomes smaller.", "a": {"steffan": "audio/steffan_b7855271c0662081.mp3", "guy": "audio/guy_f310cfc5524faf8f.mp3", "christopher": "audio/christopher_0542a25cc4b11c56.mp3", "eric": "audio/eric_4786ab2718535fe7.mp3", "ava": "audio/ava_fc8f68462965e5bc.mp3"}}, {"t": "The intensity keeps growing until the saturated gain exactly balances the losses.", "a": {"steffan": "audio/steffan_03cc74434ca83b56.mp3", "guy": "audio/guy_685ed4a0cf84c829.mp3", "christopher": "audio/christopher_20224924e1b6ba81.mp3", "eric": "audio/eric_1f2eb1299251a8e6.mp3", "ava": "audio/ava_91f645a5b7a56b21.mp3"}}, {"t": "So in steady state, the gain after one round trip is exactly one, and this condition sets the intensity inside the laser.", "a": {"steffan": "audio/steffan_f313916869e964f4.mp3", "guy": "audio/guy_7fbaef6cfae8dcd5.mp3", "christopher": "audio/christopher_6aa3ae87ca252d01.mp3", "eric": "audio/eric_7855d53b2943ff65.mp3", "ava": "audio/ava_1c16d031b3274ec8.mp3"}}, {"t": "The field must also come back with the same phase after one round trip.", "a": {"steffan": "audio/steffan_33cf48e93f921c1e.mp3", "guy": "audio/guy_a4a2c0ad8094043e.mp3", "christopher": "audio/christopher_8a5bff220a234314.mp3", "eric": "audio/eric_cb2fbc2ce82e4e36.mp3", "ava": "audio/ava_4f24ae10e29786b2.mp3"}}, {"t": "So the round-trip phase must be a whole multiple of two pi.", "a": {"steffan": "audio/steffan_57750cfef095bcb8.mp3", "guy": "audio/guy_c48af0267ce5aa94.mp3", "christopher": "audio/christopher_1de0ee96ea1c6da5.mp3", "eric": "audio/eric_d9b5e8766c1c5fb8.mp3", "ava": "audio/ava_60cd6624270d9121.mp3"}}, {"t": "That means the round-trip length of the cavity must be a whole number of wavelengths.", "a": {"steffan": "audio/steffan_77e0f0507038b0d7.mp3", "guy": "audio/guy_3719e2666246e2c8.mp3", "christopher": "audio/christopher_f8207a15986a7d62.mp3", "eric": "audio/eric_d104e425f38a84e5.mp3", "ava": "audio/ava_53e72b4bfd55396e.mp3"}}, {"t": "So only certain frequencies are allowed. These are the longitudinal modes of the cavity.", "a": {"steffan": "audio/steffan_1667035e92e42388.mp3", "guy": "audio/guy_2a89eab4e185b664.mp3", "christopher": "audio/christopher_0a6417fd04c6da3e.mp3", "eric": "audio/eric_13f9aec1c088347e.mp3", "ava": "audio/ava_c2cf1e2141dabbbd.mp3"}}, {"t": "The spacing between neighboring modes, in hertz, is the speed of light divided by the round-trip length.", "a": {"steffan": "audio/steffan_a56a6a9e853ca99f.mp3", "guy": "audio/guy_9425a8c6323cd2ba.mp3", "christopher": "audio/christopher_c30bd479622202a0.mp3", "eric": "audio/eric_e75354190ea4ed83.mp3", "ava": "audio/ava_63cbaad7cf6e9f4a.mp3"}}, {"t": "In other words, the mode spacing is one over the round-trip time of the light.", "a": {"steffan": "audio/steffan_f2cb51ab8a555bc3.mp3", "guy": "audio/guy_ae9cdf04dfe85a73.mp3", "christopher": "audio/christopher_c1b33bc62d014e51.mp3", "eric": "audio/eric_42b98f0bb9b6e5ac.mp3", "ava": "audio/ava_4db5995d19db1d46.mp3"}}, {"t": "For a linear cavity, the round-trip length is twice the mirror distance.", "a": {"steffan": "audio/steffan_e556620f000c69ee.mp3", "guy": "audio/guy_c845e0adb013878b.mp3", "christopher": "audio/christopher_2bf12ab32a1f166f.mp3", "eric": "audio/eric_3bc24f4acfc1f3b7.mp3", "ava": "audio/ava_e75c9ee0f83ad0dc.mp3"}}, {"t": "The number of wavelengths in the cavity is huge, around a million, because the cavity is much longer than the wavelength.", "a": {"steffan": "audio/steffan_868b1c57f221d5f5.mp3", "guy": "audio/guy_b48f44e68629b432.mp3", "christopher": "audio/christopher_ef51d23d47962082.mp3", "eric": "audio/eric_89bc0605b63bacd6.mp3", "ava": "audio/ava_a55a54879d5d411d.mp3"}}, {"t": "For a round-trip length of sixty centimeters, the mode spacing is about five hundred megahertz, much smaller than the optical frequency.", "a": {"steffan": "audio/steffan_c67d1372656e6bba.mp3", "guy": "audio/guy_e7d8637715ca223d.mp3", "christopher": "audio/christopher_a3563a34a0a4390d.mp3", "eric": "audio/eric_2759cbcbbb571afc.mp3", "ava": "audio/ava_7fef1284dbb0e510.mp3"}}, {"t": "The gain is only larger than the losses inside a certain frequency band.", "a": {"steffan": "audio/steffan_4e61275abcd6356a.mp3", "guy": "audio/guy_886757e81d4b1c0d.mp3", "christopher": "audio/christopher_c6789ec235790ad7.mp3", "eric": "audio/eric_62a58634f1cda8a7.mp3", "ava": "audio/ava_3ffb78472125ebd9.mp3"}}, {"t": "So the laser can oscillate on the cavity modes that fall inside this band. Depending on the medium, that can be one mode, or up to about a hundred thousand.", "a": {"steffan": "audio/steffan_300777f75dbf25dd.mp3", "guy": "audio/guy_07254ec0a1172797.mp3", "christopher": "audio/christopher_1a4c7f86c412af68.mp3", "eric": "audio/eric_fd29f1abec391345.mp3", "ava": "audio/ava_d03471206fb2ee67.mp3"}}, {"t": "One more point: the round-trip condition fixes the frequency, but not the absolute phase of the laser light. That phase is free, and this becomes important for the linewidth.", "a": {"steffan": "audio/steffan_859fa2b67bc97fa4.mp3", "guy": "audio/guy_05f8c6e2a3d79d62.mp3", "christopher": "audio/christopher_0f309884d7c48f3f.mp3", "eric": "audio/eric_8bf04d76e83ad1ba.mp3", "ava": "audio/ava_26a654ec534a8ba7.mp3"}}]}, {"title": "The Fabry-Perot cavity", "items": [{"t": "The simplest cavity is the Fabry-Perot cavity: two parallel, partially transmitting mirrors facing each other.", "a": {"steffan": "audio/steffan_81a96b9146b279f2.mp3", "guy": "audio/guy_320d72288706e715.mp3", "christopher": "audio/christopher_85823b63e255f84b.mp3", "eric": "audio/eric_1bea6b10ed640749.mp3", "ava": "audio/ava_d350fde82ae2518b.mp3"}}, {"t": "Light enters through the first mirror, bounces back and forth, and part of it leaves through the second mirror.", "a": {"steffan": "audio/steffan_947a55e0f81501a1.mp3", "guy": "audio/guy_57dbdb646cd8e709.mp3", "christopher": "audio/christopher_3b0d3f0b5c7bce2e.mp3", "eric": "audio/eric_7a09b1f7a5d25cca.mp3", "ava": "audio/ava_36fe93f353ac762b.mp3"}}, {"t": "The waves circulating inside add up. When they are in phase after each round trip, they add constructively.", "a": {"steffan": "audio/steffan_d5d84c99c1b45022.mp3", "guy": "audio/guy_ca8618afcdde9ec9.mp3", "christopher": "audio/christopher_188973907643b54c.mp3", "eric": "audio/eric_d8aeb6cbcdc87e4f.mp3", "ava": "audio/ava_eb6576ac60c292a7.mp3"}}, {"t": "So the transmission is maximal when the round-trip phase is a whole multiple of two pi. These are the resonance frequencies of the cavity.", "a": {"steffan": "audio/steffan_1e3a7bda6ff53841.mp3", "guy": "audio/guy_be0bad0a4cf0ba72.mp3", "christopher": "audio/christopher_7cf8d8e03ebac6a6.mp3", "eric": "audio/eric_59989184cec8a9b6.mp3", "ava": "audio/ava_9b6de6f89c73278f.mp3"}}, {"t": "The resonances are equally spaced. This spacing is called the free spectral range.", "a": {"steffan": "audio/steffan_cf4560eaa620a313.mp3", "guy": "audio/guy_32058b01741d60f2.mp3", "christopher": "audio/christopher_84e6b9b218d787c9.mp3", "eric": "audio/eric_4b912583fe02c155.mp3", "ava": "audio/ava_28ac74f10e56ed78.mp3"}}, {"t": "Here is a surprising result: with two identical mirrors, the transmission on resonance is one, even if the mirrors reflect almost all the light.", "a": {"steffan": "audio/steffan_5f0f029e93cff4a5.mp3", "guy": "audio/guy_02baed2fa4346cb1.mp3", "christopher": "audio/christopher_cca159a42e9032b9.mp3", "eric": "audio/eric_5c79da9f216b664e.mp3", "ava": "audio/ava_656dbb0b1772b646.mp3"}}, {"t": "The reason is that on resonance, the power inside the cavity builds up to a very high value, larger than the input by a factor of one over the mirror transmission.", "a": {"steffan": "audio/steffan_ff580d44e06e9406.mp3", "guy": "audio/guy_9da0d8de5d6366df.mp3", "christopher": "audio/christopher_64f3fea15b371144.mp3", "eric": "audio/eric_f1e905639f1e8e6d.mp3", "ava": "audio/ava_2d34d9cff259409e.mp3"}}, {"t": "The second mirror only lets a small fraction through, but of a very large power, and the two effects exactly cancel.", "a": {"steffan": "audio/steffan_0dd36ad4d12849a5.mp3", "guy": "audio/guy_7f82a53b16b931b8.mp3", "christopher": "audio/christopher_13dbc35f5e8b8d91.mp3", "eric": "audio/eric_b5d815cf1179d599.mp3", "ava": "audio/ava_ec54eb19be0328f8.mp3"}}, {"t": "At the same time, the reflected light on resonance goes to zero.", "a": {"steffan": "audio/steffan_9025b922430eb7cf.mp3", "guy": "audio/guy_44a22f76c84349c5.mp3", "christopher": "audio/christopher_9b8d160204cafefe.mp3", "eric": "audio/eric_32c14c60eb9b0133.mp3", "ava": "audio/ava_463250fc7fe30dad.mp3"}}, {"t": "Between the resonances, the cavity transmits almost nothing.", "a": {"steffan": "audio/steffan_267e3243ce55935b.mp3", "guy": "audio/guy_2318500585f58f44.mp3", "christopher": "audio/christopher_44041f3bfd557b21.mp3", "eric": "audio/eric_f9c4c9484ea7b963.mp3", "ava": "audio/ava_c77355db32c576fd.mp3"}}]}, {"title": "Cavity finesse", "items": [{"t": "How sharp are the resonances?", "a": {"steffan": "audio/steffan_593939a157507442.mp3", "guy": "audio/guy_5c5e8941a2fd881f.mp3", "christopher": "audio/christopher_620c9e000959fd4e.mp3", "eric": "audio/eric_f68421c5ff4736d9.mp3", "ava": "audio/ava_d30b432e40837fdc.mp3"}}, {"t": "This is described by the finesse, F. The finesse is the spacing between resonances divided by the width of one resonance.", "a": {"steffan": "audio/steffan_2f54315f03038f0c.mp3", "guy": "audio/guy_ba6f84977d16cd9e.mp3", "christopher": "audio/christopher_1f26b8f82985b4ae.mp3", "eric": "audio/eric_16096aa0585b81b6.mp3", "ava": "audio/ava_5dcf9cfed7e58161.mp3"}}, {"t": "So the width of a resonance is the free spectral range divided by the finesse.", "a": {"steffan": "audio/steffan_4c2326ab7d604827.mp3", "guy": "audio/guy_561dbd79b84f7640.mp3", "christopher": "audio/christopher_55ec74c7c31418da.mp3", "eric": "audio/eric_33cf7e4835a4bfdd.mp3", "ava": "audio/ava_81f5d87f95c9e42b.mp3"}}, {"t": "The more reflective the mirrors, the higher the finesse, and the narrower the resonances.", "a": {"steffan": "audio/steffan_6d53f478646808eb.mp3", "guy": "audio/guy_84db5e58ddf5e6f8.mp3", "christopher": "audio/christopher_b85037a630c63272.mp3", "eric": "audio/eric_948fba6e28b68ce0.mp3", "ava": "audio/ava_0140e083fa6e18c7.mp3"}}, {"t": "For mirrors with small transmissions, the finesse is about two pi divided by the sum of the two mirror transmissions.", "a": {"steffan": "audio/steffan_633ce84a9cfaf72f.mp3", "guy": "audio/guy_cedc2a24c72b538e.mp3", "christopher": "audio/christopher_8855e93dd425c3ba.mp3", "eric": "audio/eric_c515d1fb08c55de4.mp3", "ava": "audio/ava_0ae1a929d16d43f5.mp3"}}, {"t": "With mirror transmissions of one percent, the finesse is already around three hundred.", "a": {"steffan": "audio/steffan_6ad8633d8297a0f3.mp3", "guy": "audio/guy_49c04a0dd1e5ac58.mp3", "christopher": "audio/christopher_187508c5d4a088db.mp3", "eric": "audio/eric_1226dba0bc16b533.mp3", "ava": "audio/ava_81a4851e24748a73.mp3"}}, {"t": "With the best dielectric mirrors, the finesse can exceed a hundred thousand.", "a": {"steffan": "audio/steffan_77e2fdd2688edc95.mp3", "guy": "audio/guy_181e54e80512e22d.mp3", "christopher": "audio/christopher_e6da2577cc3ce9cd.mp3", "eric": "audio/eric_0c6171c520d1af17.mp3", "ava": "audio/ava_4ba6a9c160dbd179.mp3"}}]}, {"title": "Cavity quality factor", "items": [{"t": "Another way to describe the cavity is to switch off the input and watch the stored energy decay.", "a": {"steffan": "audio/steffan_a3b3816a1557ece3.mp3", "guy": "audio/guy_3134cdec89685178.mp3", "christopher": "audio/christopher_38eaf0ed58051487.mp3", "eric": "audio/eric_caf8d82ccf4d5498.mp3", "ava": "audio/ava_66fcd6cd4439f573.mp3"}}, {"t": "The quality factor, Q, compares how fast the energy leaks out with how fast the field oscillates.", "a": {"steffan": "audio/steffan_d116df507abb3899.mp3", "guy": "audio/guy_682da312c6b55515.mp3", "christopher": "audio/christopher_a1ce545951cc1f17.mp3", "eric": "audio/eric_a5b03e175c75488d.mp3", "ava": "audio/ava_0df91d8ddfa7ddfb.mp3"}}, {"t": "The rate of energy loss is omega over Q, times the stored energy.", "a": {"steffan": "audio/steffan_b7dfb5a6d7e640c2.mp3", "guy": "audio/guy_ae11a23d11c05e52.mp3", "christopher": "audio/christopher_7c91150bac65c011.mp3", "eric": "audio/eric_d7aca0b6faf0e58d.mp3", "ava": "audio/ava_d6f3c2c3fd5f9799.mp3"}}, {"t": "So a high Q means the light makes very many oscillations before it leaks out.", "a": {"steffan": "audio/steffan_c7b0f3b90b1381e8.mp3", "guy": "audio/guy_6b7a2483a10badbd.mp3", "christopher": "audio/christopher_3f2126c203e68ed4.mp3", "eric": "audio/eric_be42e39fd7be6826.mp3", "ava": "audio/ava_6b7d3c05d99284c9.mp3"}}, {"t": "For a high-finesse cavity, Q is about the finesse times the round-trip length divided by the wavelength.", "a": {"steffan": "audio/steffan_ccd4a0590edf538b.mp3", "guy": "audio/guy_9815754a58ecf0d5.mp3", "christopher": "audio/christopher_88e9518861c38127.mp3", "eric": "audio/eric_f07c30bb4b67b20e.mp3", "ava": "audio/ava_3dc154e287a44fd7.mp3"}}, {"t": "Since the cavity is much longer than the wavelength, Q can be very large, far above a hundred thousand.", "a": {"steffan": "audio/steffan_c83ace906fdaaee7.mp3", "guy": "audio/guy_dc69a00261716bcc.mp3", "christopher": "audio/christopher_92bfa7f40bbf123c.mp3", "eric": "audio/eric_eed6b7633108e2d6.mp3", "ava": "audio/ava_e7e7eed2bfc4402d.mp3"}}, {"t": "Let's put in numbers. Take mirrors five centimeters apart, each with one percent transmission.", "a": {"steffan": "audio/steffan_4492c688287d5b7a.mp3", "guy": "audio/guy_55a844133031caef.mp3", "christopher": "audio/christopher_d76c08c44e5dd718.mp3", "eric": "audio/eric_f563210a536618b8.mp3", "ava": "audio/ava_f01becd49a2e1888.mp3"}}, {"t": "The finesse is about three hundred, the free spectral range is three gigahertz, and each resonance is about ten megahertz wide.", "a": {"steffan": "audio/steffan_902efdd4f4783046.mp3", "guy": "audio/guy_bdf482fbfddb3350.mp3", "christopher": "audio/christopher_1802c8bce74cdb3e.mp3", "eric": "audio/eric_49c14137f7e78fde.mp3", "ava": "audio/ava_81ef91e0ad71bfb8.mp3"}}, {"t": "At a wavelength of five hundred nanometers, the quality factor is about six times ten to the seven.", "a": {"steffan": "audio/steffan_053a08f2995295ba.mp3", "guy": "audio/guy_2e5974899b0c3422.mp3", "christopher": "audio/christopher_75ac45fab640dc7a.mp3", "eric": "audio/eric_035b4fd8b385d7d7.mp3", "ava": "audio/ava_771ab58120bbff06.mp3"}}, {"t": "Such a cavity can resolve very fine spectral structure, for example the separate modes of a helium neon laser.", "a": {"steffan": "audio/steffan_2e43ae01c726f59a.mp3", "guy": "audio/guy_7cf0883f1f534791.mp3", "christopher": "audio/christopher_7f76b0666cf08efe.mp3", "eric": "audio/eric_12b50d558c767eff.mp3", "ava": "audio/ava_8a72417386374ff6.mp3"}}]}, {"title": "Why a two-level system cannot lase", "items": [{"t": "To get gain, we need population inversion. But in thermal equilibrium, the upper level always has fewer atoms than the lower one.", "a": {"steffan": "audio/steffan_7e982f61ace1de42.mp3", "guy": "audio/guy_52fba8ebcde6cb13.mp3", "christopher": "audio/christopher_5d2919d840295fcc.mp3", "eric": "audio/eric_e44e80b17d97ed7d.mp3", "ava": "audio/ava_53600cf0dcd18ed0.mp3"}}, {"t": "The ratio is given by the Boltzmann factor, e to the minus the energy difference over k T, which is always smaller than one.", "a": {"steffan": "audio/steffan_caadfc72cb87df15.mp3", "guy": "audio/guy_61431867ad0651be.mp3", "christopher": "audio/christopher_6ccca7f49795d69e.mp3", "eric": "audio/eric_fb19751bc12e31e4.mp3", "ava": "audio/ava_f9d3949baa5b6d2a.mp3"}}, {"t": "So we have to pump the system away from equilibrium.", "a": {"steffan": "audio/steffan_ac68ac1dfd6ee897.mp3", "guy": "audio/guy_58081fa0bbd67058.mp3", "christopher": "audio/christopher_b1e956e89820e8a0.mp3", "eric": "audio/eric_81f20a42a750b6ef.mp3", "ava": "audio/ava_71c47e0d728039e3.mp3"}}, {"t": "Try it with just two levels, pumping atoms from a to b at a rate w, while b decays with lifetime tau b.", "a": {"steffan": "audio/steffan_ecb2c3c8eea7b261.mp3", "guy": "audio/guy_f69078e23c6d3c04.mp3", "christopher": "audio/christopher_1f6e13b4d836321f.mp3", "eric": "audio/eric_c19c7ee482e6e003.mp3", "ava": "audio/ava_fc29b3c3cc79a252.mp3"}}, {"t": "The pump also drives atoms back down, just as strongly, by stimulated emission.", "a": {"steffan": "audio/steffan_1d1fab9c0b2e75f0.mp3", "guy": "audio/guy_cb7a50bee795e747.mp3", "christopher": "audio/christopher_940962b76e3324a7.mp3", "eric": "audio/eric_db168d006daa0370.mp3", "ava": "audio/ava_b098cba18b5c9aa2.mp3"}}, {"t": "In steady state, the ratio of N b to N a is w tau b over one plus w tau b.", "a": {"steffan": "audio/steffan_1c0fc519b6b48d78.mp3", "guy": "audio/guy_72d0c29fcd468c0c.mp3", "christopher": "audio/christopher_ad342efbb5b581a4.mp3", "eric": "audio/eric_59e51e686bfe8475.mp3", "ava": "audio/ava_190e6900d64a32bb.mp3"}}, {"t": "This is always smaller than one, no matter how strong the pump.", "a": {"steffan": "audio/steffan_897b59a8bac1ebe0.mp3", "guy": "audio/guy_13895859ac6c6e46.mp3", "christopher": "audio/christopher_7cb35b56cf645acc.mp3", "eric": "audio/eric_901043746f31bc19.mp3", "ava": "audio/ava_a73790d5e0b7272e.mp3"}}, {"t": "So with only two levels and a pump of this kind, we can never get a steady population inversion.", "a": {"steffan": "audio/steffan_1996bfed02a563dd.mp3", "guy": "audio/guy_ca7f04817588324a.mp3", "christopher": "audio/christopher_ba9af6c6984aea23.mp3", "eric": "audio/eric_3431b68275ec6ae6.mp3", "ava": "audio/ava_72b0cc858a3eecc0.mp3"}}, {"t": "A pi pulse can invert the atoms for a moment, but that needs a coherent wave like laser light to begin with.", "a": {"steffan": "audio/steffan_002aa16ecf3e5c6c.mp3", "guy": "audio/guy_d5d62f282f701576.mp3", "christopher": "audio/christopher_d776a65f0522a8ab.mp3", "eric": "audio/eric_e284e32dfc749ed5.mp3", "ava": "audio/ava_6d704a8f90ac5d3a.mp3"}}, {"t": "So a laser needs at least three levels.", "a": {"steffan": "audio/steffan_283503b2a43339b0.mp3", "guy": "audio/guy_e3cbb90ca6096dc4.mp3", "christopher": "audio/christopher_dd473f633949aead.mp3", "eric": "audio/eric_aadca98a9f2b9e95.mp3", "ava": "audio/ava_29a2a5183e0f6250.mp3"}}]}, {"title": "Three-level lasers", "items": [{"t": "In a three-level laser, the lasing transition ends on the ground state, a.", "a": {"steffan": "audio/steffan_aa302e19ab27cfb6.mp3", "guy": "audio/guy_35720ff42ac4b73a.mp3", "christopher": "audio/christopher_2ea47e24209f224f.mp3", "eric": "audio/eric_fdb1747590059ce9.mp3", "ava": "audio/ava_61c9274c5c792d0b.mp3"}}, {"t": "The pump moves atoms from a up to a high level, e.", "a": {"steffan": "audio/steffan_d84f2ab53be62ab2.mp3", "guy": "audio/guy_086db5a66071a0d4.mp3", "christopher": "audio/christopher_0c0bf84eec6bdff1.mp3", "eric": "audio/eric_a4d8af0189045a31.mp3", "ava": "audio/ava_21723214793a689f.mp3"}}, {"t": "From e, the atoms decay very quickly to level b.", "a": {"steffan": "audio/steffan_0a6350371c38f752.mp3", "guy": "audio/guy_c4a377e6c13c9a02.mp3", "christopher": "audio/christopher_97819702ee2dd4bb.mp3", "eric": "audio/eric_8037f488ad96e34e.mp3", "ava": "audio/ava_08d4350bffeec77f.mp3"}}, {"t": "Level b lives much longer, and the laser works on the transition from b down to a.", "a": {"steffan": "audio/steffan_96262aaf79b9427f.mp3", "guy": "audio/guy_42a4b1d731c8191d.mp3", "christopher": "audio/christopher_5354f9c6e602bf5f.mp3", "eric": "audio/eric_d969fc430530602a.mp3", "ava": "audio/ava_c15028f621225d8a.mp3"}}, {"t": "The population inversion is w tau b minus one, divided by w tau b plus one.", "a": {"steffan": "audio/steffan_a6aeec97da254203.mp3", "guy": "audio/guy_e26081f1463e9b54.mp3", "christopher": "audio/christopher_f4db3ee5698d0d7e.mp3", "eric": "audio/eric_efb8377e457166db.mp3", "ava": "audio/ava_dd197e8e3850b261.mp3"}}, {"t": "So we only get inversion when w times tau b is larger than one, which means strong pumping.", "a": {"steffan": "audio/steffan_33fb0465490274a7.mp3", "guy": "audio/guy_224abb15517e0e9e.mp3", "christopher": "audio/christopher_029cb6838c9cc5b2.mp3", "eric": "audio/eric_f67a1958a2fb90cb.mp3", "ava": "audio/ava_72b23daaed99def6.mp3"}}, {"t": "The difficulty is clear: the lower laser level is the ground state, where all atoms start. More than half of them must be moved up before there is any gain.", "a": {"steffan": "audio/steffan_aa095c70f5517e72.mp3", "guy": "audio/guy_186b31ecc323826f.mp3", "christopher": "audio/christopher_7cc063353d5d766a.mp3", "eric": "audio/eric_045ac3517b57da29.mp3", "ava": "audio/ava_26e714c726adef3f.mp3"}}, {"t": "Three-level lasers also tend to emit in bursts. Once lasing starts, it empties level b, the gain drops, lasing stops, and the pump has to build up the inversion again.", "a": {"steffan": "audio/steffan_a118a20da4480392.mp3", "guy": "audio/guy_249854c45a0d4d6a.mp3", "christopher": "audio/christopher_3a66baba73fa4401.mp3", "eric": "audio/eric_9a7a5e3b6b4b3792.mp3", "ava": "audio/ava_117b883e357c2518.mp3"}}, {"t": "The first laser, built by Maiman in 1960, was a three-level laser: ruby, pumped by a flash lamp, emitting red light at six hundred ninety four nanometers.", "a": {"steffan": "audio/steffan_e728e9edd0f90b00.mp3", "guy": "audio/guy_916e12f2e3049cfc.mp3", "christopher": "audio/christopher_ddebc0ccc91959c5.mp3", "eric": "audio/eric_b023476ed9cbcca5.mp3", "ava": "audio/ava_d5e06b6fa975c55e.mp3"}}, {"t": "Another important example is erbium in glass fibers. It amplifies light around one point five five micrometers, where optical fibers have their lowest loss, so it is used everywhere in telecommunications.", "a": {"steffan": "audio/steffan_cde5d3769738c92c.mp3", "guy": "audio/guy_0540d635eed4b59d.mp3", "christopher": "audio/christopher_d47ff05eb2018c73.mp3", "eric": "audio/eric_428d1c2f967e34e8.mp3", "ava": "audio/ava_b2880f933b93bfb0.mp3"}}]}, {"title": "Four-level lasers", "items": [{"t": "In a four-level laser, the lasing transition does not end on the ground state.", "a": {"steffan": "audio/steffan_52014adcaf658525.mp3", "guy": "audio/guy_0bfacc8908bc0fff.mp3", "christopher": "audio/christopher_d920a34774559a43.mp3", "eric": "audio/eric_bd598fcf2d8ae62a.mp3", "ava": "audio/ava_fdfbd4dfa13a51d6.mp3"}}, {"t": "The pump moves atoms from the ground state, g, up to level e.", "a": {"steffan": "audio/steffan_6cf441b1c10a735e.mp3", "guy": "audio/guy_08fc954d0c032ec7.mp3", "christopher": "audio/christopher_2c3ffe1f56bf5792.mp3", "eric": "audio/eric_38e9aafb12fef486.mp3", "ava": "audio/ava_ee2e3a1eb7f6aec2.mp3"}}, {"t": "From e, they decay quickly to the upper laser level, b.", "a": {"steffan": "audio/steffan_909c13cf6925b821.mp3", "guy": "audio/guy_514c8bf8dc539846.mp3", "christopher": "audio/christopher_ed6ffae0cc9ce16f.mp3", "eric": "audio/eric_4ea93a0491bc4ca8.mp3", "ava": "audio/ava_94e9e0df7130de60.mp3"}}, {"t": "The laser works on the transition from b to a.", "a": {"steffan": "audio/steffan_9fe8e7c7c4305b9d.mp3", "guy": "audio/guy_4bd34f9c83afe75c.mp3", "christopher": "audio/christopher_90f852145282e430.mp3", "eric": "audio/eric_822132f369bb1c90.mp3", "ava": "audio/ava_b0407d0763daba77.mp3"}}, {"t": "And level a decays quickly back down to the ground state.", "a": {"steffan": "audio/steffan_08e4e0d5d5659382.mp3", "guy": "audio/guy_48898a83072ef73f.mp3", "christopher": "audio/christopher_92944fe4e43b3d1c.mp3", "eric": "audio/eric_5f8dca1475c4cdac.mp3", "ava": "audio/ava_21dba9aa31f4fe75.mp3"}}, {"t": "Because level a empties so fast, it is almost always empty.", "a": {"steffan": "audio/steffan_154c452c41b5624e.mp3", "guy": "audio/guy_8d01a8f33f941a60.mp3", "christopher": "audio/christopher_0c7d8e0923e16178.mp3", "eric": "audio/eric_1407f9d7c8753a45.mp3", "ava": "audio/ava_df767ac3d9970d85.mp3"}}, {"t": "So any atom in b already gives inversion. The inversion is about w tau b over one plus w tau b, and it is positive for any pump rate.", "a": {"steffan": "audio/steffan_e3f72611e0f131b2.mp3", "guy": "audio/guy_67ccd19518dd7730.mp3", "christopher": "audio/christopher_3d66745cc2afa2df.mp3", "eric": "audio/eric_f50dd7673a6d97b1.mp3", "ava": "audio/ava_f8ee5dbe70abee1e.mp3"}}, {"t": "The only requirement is that level b lives long compared to the fast decays.", "a": {"steffan": "audio/steffan_45425b0c1b502a82.mp3", "guy": "audio/guy_d8b8b4d5b1f558a5.mp3", "christopher": "audio/christopher_f7817f8c8876c8ab.mp3", "eric": "audio/eric_b53a17cdd497a9ef.mp3", "ava": "audio/ava_c39e0406b9192b63.mp3"}}, {"t": "That is why most lasers are four-level systems.", "a": {"steffan": "audio/steffan_5a065df499a3a726.mp3", "guy": "audio/guy_645ae201f265557b.mp3", "christopher": "audio/christopher_c188d9f059e0b119.mp3", "eric": "audio/eric_9b67588bcc897d49.mp3", "ava": "audio/ava_074cfa636405082e.mp3"}}, {"t": "An example is the neodymium laser, with neodymium ions in a YAG crystal, emitting at one point zero six micrometers in the infrared.", "a": {"steffan": "audio/steffan_6e6d8540944b428b.mp3", "guy": "audio/guy_9eb203f9b7a6690a.mp3", "christopher": "audio/christopher_95d3202249e209dd.mp3", "eric": "audio/eric_b50f21dda16d394f.mp3", "ava": "audio/ava_eaaeb37dc1814567.mp3"}}, {"t": "Another example is the helium neon laser. An electric discharge excites long-lived levels of helium, and collisions pass this energy on to neon atoms, which then lase, for example on the red line at six hundred thirty three nanometers.", "a": {"steffan": "audio/steffan_d773dcc31c16377f.mp3", "guy": "audio/guy_7f98b3d63dbc5434.mp3", "christopher": "audio/christopher_835d5ecb91877acc.mp3", "eric": "audio/eric_a548c810ebc2f758.mp3", "ava": "audio/ava_9164427d5ffdc742.mp3"}}]}, {"title": "Semiconductor lasers", "items": [{"t": "The most common lasers today are semiconductor lasers, also called diode lasers.", "a": {"steffan": "audio/steffan_5161377c49ac5783.mp3", "guy": "audio/guy_093f3afb9b21b510.mp3", "christopher": "audio/christopher_43cfc26e2ae4e445.mp3", "eric": "audio/eric_2122059bf9412c69.mp3", "ava": "audio/ava_404b4d8837814b59.mp3"}}, {"t": "The active medium is a p n junction, the boundary between a p-doped and an n-doped semiconductor.", "a": {"steffan": "audio/steffan_4eae37602f0208c8.mp3", "guy": "audio/guy_f6f5ea9bec1181c1.mp3", "christopher": "audio/christopher_026a971f194f4769.mp3", "eric": "audio/eric_edc153e644d9bfbe.mp3", "ava": "audio/ava_f2b43a70ed1e7605.mp3"}}, {"t": "The region between them is called the depletion region.", "a": {"steffan": "audio/steffan_230b5400f34ec6b8.mp3", "guy": "audio/guy_e4486c2555f93431.mp3", "christopher": "audio/christopher_237280b0278bc871.mp3", "eric": "audio/eric_4c60bb8e3bd9eddf.mp3", "ava": "audio/ava_5b58ed0606ed7762.mp3"}}, {"t": "When a forward current flows, electrons from the n side and holes from the p side meet in the junction and recombine.", "a": {"steffan": "audio/steffan_58f94b2d2420b867.mp3", "guy": "audio/guy_2bb2865956a9f339.mp3", "christopher": "audio/christopher_117a274e25771e43.mp3", "eric": "audio/eric_5de9241b0df18056.mp3", "ava": "audio/ava_99eae68258f4a5e7.mp3"}}, {"t": "Each recombination releases a photon with an energy close to the band gap, the energy between the valence band and the conduction band.", "a": {"steffan": "audio/steffan_7b7c9d8f82b2a499.mp3", "guy": "audio/guy_72b41a57b91a500d.mp3", "christopher": "audio/christopher_5934921a2aafeaa3.mp3", "eric": "audio/eric_140c49cb92ac5fe6.mp3", "ava": "audio/ava_d66ed5931865bb73.mp3"}}, {"t": "A direct band gap is preferred, because then an electron and a hole can recombine without needing a phonon to conserve momentum.", "a": {"steffan": "audio/steffan_7f4c2f8cca29332c.mp3", "guy": "audio/guy_8e186de3a768cf48.mp3", "christopher": "audio/christopher_4766ab459b3ddefe.mp3", "eric": "audio/eric_3eb8744921965d61.mp3", "ava": "audio/ava_ae892f7dab2f05cc.mp3"}}, {"t": "In modern devices, the active layer is very thin, for example a quantum well about ten nanometers thick.", "a": {"steffan": "audio/steffan_6295d5ef3d15c4d9.mp3", "guy": "audio/guy_75569f03e594d13c.mp3", "christopher": "audio/christopher_272a8d5af680d43a.mp3", "eric": "audio/eric_d64deda809b959f9.mp3", "ava": "audio/ava_b74c70734efd831c.mp3"}}, {"t": "It is placed between layers with a lower refractive index, so the light stays guided in the active layer, just like in an optical fiber. This is refractive-index guiding.", "a": {"steffan": "audio/steffan_148d1f3c6551385a.mp3", "guy": "audio/guy_f9248f2ddac3245a.mp3", "christopher": "audio/christopher_4953c8de10a440dc.mp3", "eric": "audio/eric_996b3e8ae2beb9ae.mp3", "ava": "audio/ava_75a24c2143633110.mp3"}}, {"t": "The two cleaved end facets of the crystal act as the mirrors of the cavity.", "a": {"steffan": "audio/steffan_9f0505d5d879fec4.mp3", "guy": "audio/guy_16be9b9f912a04f7.mp3", "christopher": "audio/christopher_50ff3945ae659ab7.mp3", "eric": "audio/eric_2392252e5761bef1.mp3", "ava": "audio/ava_0cb7642a3650d768.mp3"}}, {"t": "Now look at the output power as a function of the current.", "a": {"steffan": "audio/steffan_c20a285b4c587790.mp3", "guy": "audio/guy_eb36cd86bd7f4a16.mp3", "christopher": "audio/christopher_0e50b3d602a468df.mp3", "eric": "audio/eric_8a40c739a7fba684.mp3", "ava": "audio/ava_e2f37b651fd0d66b.mp3"}}, {"t": "Below a threshold current, the device only produces spontaneous emission, and it works as a light-emitting diode.", "a": {"steffan": "audio/steffan_ed8565c8ecbad7aa.mp3", "guy": "audio/guy_a9d0d310e8fc38d0.mp3", "christopher": "audio/christopher_9da40873f671cab7.mp3", "eric": "audio/eric_0711e1126fbfbe23.mp3", "ava": "audio/ava_78f0596dc5bbe642.mp3"}}, {"t": "Above the threshold current, stimulated emission takes over, and the output power rises steeply and linearly with the current.", "a": {"steffan": "audio/steffan_86f41071af5c9ef2.mp3", "guy": "audio/guy_0ceb531f061ab855.mp3", "christopher": "audio/christopher_360dc3b8536bd725.mp3", "eric": "audio/eric_e8415c2f5a71bcae.mp3", "ava": "audio/ava_26831490fe75fd14.mp3"}}, {"t": "Diode lasers are cheap, small, and efficient, with efficiencies above fifty percent.", "a": {"steffan": "audio/steffan_af2a356ee5503bfd.mp3", "guy": "audio/guy_fdb201ec4b2a5d7d.mp3", "christopher": "audio/christopher_e4167dc259bec3f8.mp3", "eric": "audio/eric_9f3a1fa4e437b328.mp3", "ava": "audio/ava_98bfdc1c2c68cb3e.mp3"}}, {"t": "Because the emitting facet is so small, the beam spreads strongly by diffraction, and it has an elliptical shape.", "a": {"steffan": "audio/steffan_cf6ee50b96e69a84.mp3", "guy": "audio/guy_d1a75a3d85d0e17d.mp3", "christopher": "audio/christopher_4167427be73f4f2e.mp3", "eric": "audio/eric_fffd913bea7a1310.mp3", "ava": "audio/ava_011026e7eb1f9d9b.mp3"}}]}, {"title": "Longitudinal modes and line broadening", "items": [{"t": "Lasers can be sorted in two ways: continuous wave or pulsed, and single mode or multi-mode.", "a": {"steffan": "audio/steffan_0c6b1fe6a30c7b41.mp3", "guy": "audio/guy_14ebd7da6b1f7bad.mp3", "christopher": "audio/christopher_b8c0075fc52793c8.mp3", "eric": "audio/eric_55bb41778685468e.mp3", "ava": "audio/ava_27c9b8ecef6b2ead.mp3"}}, {"t": "Whether a laser runs on one mode or on many depends on how its gain curve is broadened.", "a": {"steffan": "audio/steffan_5df10ee09256d5b0.mp3", "guy": "audio/guy_2dfb009d5e5587fa.mp3", "christopher": "audio/christopher_bad902cd45390fed.mp3", "eric": "audio/eric_7e5738ce016c63d3.mp3", "ava": "audio/ava_d648f4644670db9b.mp3"}}, {"t": "The number of possible modes is roughly the width of the gain curve divided by the mode spacing.", "a": {"steffan": "audio/steffan_4db5b8e6bda0aacb.mp3", "guy": "audio/guy_34d325dde768376b.mp3", "christopher": "audio/christopher_8d6b6f5c067b0ba2.mp3", "eric": "audio/eric_c2a220086163864f.mp3", "ava": "audio/ava_ff070a360c01c289.mp3"}}, {"t": "For the red helium neon line, the gain curve is one point two gigahertz wide and the mode spacing is about half a gigahertz, so two or three modes can oscillate.", "a": {"steffan": "audio/steffan_3b3e74fc5b72c8ce.mp3", "guy": "audio/guy_8e630272d7d6ff5a.mp3", "christopher": "audio/christopher_39fce1d7e5c91535.mp3", "eric": "audio/eric_aefd17df4780979d.mp3", "ava": "audio/ava_6b4fe4f7de204ee1.mp3"}}, {"t": "There are two kinds of broadening.", "a": {"steffan": "audio/steffan_e6f8e2e46a537342.mp3", "guy": "audio/guy_36ce19398d20d3cb.mp3", "christopher": "audio/christopher_43e8a79c729ab075.mp3", "eric": "audio/eric_92b10b02bb08a3d8.mp3", "ava": "audio/ava_9b57d734006b71b8.mp3"}}, {"t": "In homogeneous broadening, every atom has the same line shape. Examples are the natural linewidth and broadening by collisions.", "a": {"steffan": "audio/steffan_d00188c05e3980f4.mp3", "guy": "audio/guy_7523fc5a994fd041.mp3", "christopher": "audio/christopher_40c2bcb13e327e54.mp3", "eric": "audio/eric_cfe0e425cbfa9423.mp3", "ava": "audio/ava_996fde41d28919c1.mp3"}}, {"t": "In inhomogeneous broadening, different atoms have different resonance frequencies. The typical example is Doppler broadening in a gas, where atoms with different velocities see different frequencies.", "a": {"steffan": "audio/steffan_57451cd782cebd26.mp3", "guy": "audio/guy_8525613e54ac43e9.mp3", "christopher": "audio/christopher_9b68136158c1c2d2.mp3", "eric": "audio/eric_d651b633087dcac0.mp3", "ava": "audio/ava_48c467902756b19b.mp3"}}, {"t": "Now remember that in steady state, gain saturation pulls the gain down until it equals the losses.", "a": {"steffan": "audio/steffan_745da85427c4f1c8.mp3", "guy": "audio/guy_f479814b5cea8c4b.mp3", "christopher": "audio/christopher_e9e044a1e887af84.mp3", "eric": "audio/eric_49bd35c938977ded.mp3", "ava": "audio/ava_c47850b42c2402fa.mp3"}}, {"t": "With homogeneous broadening, all modes take their gain from the same atoms.", "a": {"steffan": "audio/steffan_23c62671deca6892.mp3", "guy": "audio/guy_fa497cd2c69d8a5e.mp3", "christopher": "audio/christopher_afc969ca0f4cdfc3.mp3", "eric": "audio/eric_45ac4038986a72be.mp3", "ava": "audio/ava_c8a39e489d3cd923.mp3"}}, {"t": "So when the strongest mode saturates the gain, the whole gain curve goes down for all modes.", "a": {"steffan": "audio/steffan_7cd14f90e2e1b2ee.mp3", "guy": "audio/guy_56acb74da8ceff26.mp3", "christopher": "audio/christopher_3667eff76951b4ec.mp3", "eric": "audio/eric_117e09b70fb62e7b.mp3", "ava": "audio/ava_b5ea47ffe7f232b5.mp3"}}, {"t": "Only the mode closest to the gain maximum stays above threshold, and the others die out.", "a": {"steffan": "audio/steffan_5392bf628e09c182.mp3", "guy": "audio/guy_cbe68f58bd45ddd1.mp3", "christopher": "audio/christopher_a99790bdd89fde51.mp3", "eric": "audio/eric_f3c9867901e6a0e1.mp3", "ava": "audio/ava_fec66f52abbd73e0.mp3"}}, {"t": "This is called mode competition, and it pushes the laser toward single-mode operation.", "a": {"steffan": "audio/steffan_852891e3ff6b0bc2.mp3", "guy": "audio/guy_3a81995d40052902.mp3", "christopher": "audio/christopher_373008300829d37a.mp3", "eric": "audio/eric_15eac6c8259be12b.mp3", "ava": "audio/ava_25aa81a2ebfddc02.mp3"}}, {"t": "With inhomogeneous broadening, each mode only uses the atoms that are resonant with it.", "a": {"steffan": "audio/steffan_dc665d1b9aae4bfa.mp3", "guy": "audio/guy_0a0f3df99514f12c.mp3", "christopher": "audio/christopher_14fdaa3e6768d74f.mp3", "eric": "audio/eric_f03a4b1feb64d229.mp3", "ava": "audio/ava_eb5a492b6c07569d.mp3"}}, {"t": "So each mode burns its own hole into the gain curve, at its own frequency, without lowering the gain for the others.", "a": {"steffan": "audio/steffan_d705c62d8a14590f.mp3", "guy": "audio/guy_b6a35146e75c212a.mp3", "christopher": "audio/christopher_d270a731d3d4a383.mp3", "eric": "audio/eric_da0772e6a1086c59.mp3", "ava": "audio/ava_b87ef3c9cf1237b3.mp3"}}, {"t": "This is called spectral hole burning. The modes do not compete, and the laser runs on many modes.", "a": {"steffan": "audio/steffan_a86a2f3bf2575095.mp3", "guy": "audio/guy_fca300ff2ae9fb07.mp3", "christopher": "audio/christopher_ac49b25503b76226.mp3", "eric": "audio/eric_e3036c215167e161.mp3", "ava": "audio/ava_40453ea689301f87.mp3"}}, {"t": "The helium neon laser, which is Doppler broadened, is an example.", "a": {"steffan": "audio/steffan_76841e9aa2e69a5c.mp3", "guy": "audio/guy_2aaca966c7eae233.mp3", "christopher": "audio/christopher_09bf0a8b20749b98.mp3", "eric": "audio/eric_f752f2df8f6eeb81.mp3", "ava": "audio/ava_2a374dfe0f9ec700.mp3"}}, {"t": "To force single-mode operation, one can use a cavity so short that only one mode fits under the gain curve, or put a frequency-selective filter, like an extra Fabry-Perot etalon, into the cavity.", "a": {"steffan": "audio/steffan_085b3736d409b155.mp3", "guy": "audio/guy_04ccd72f0d31e656.mp3", "christopher": "audio/christopher_5ee4fb8f7c5c61d7.mp3", "eric": "audio/eric_3d6fe6792cd58a37.mp3", "ava": "audio/ava_d61f46159bb5d1d1.mp3"}}]}, {"title": "Transverse modes: the Gaussian beam", "items": [{"t": "So far we treated the light as a plane wave. A real beam has a finite width, and it spreads by diffraction.", "a": {"steffan": "audio/steffan_ba60a9d4c3f2a33e.mp3", "guy": "audio/guy_df628b553e407d8f.mp3", "christopher": "audio/christopher_155ea5a3d8ce78d4.mp3", "eric": "audio/eric_26c73722a9a1f703.mp3", "ava": "audio/ava_80e776f31b8fa528.mp3"}}, {"t": "The stable field patterns of the cavity across the beam are called transverse electromagnetic modes, or TEM modes.", "a": {"steffan": "audio/steffan_fab4ddbb9dd954af.mp3", "guy": "audio/guy_412a31fa54fb98f9.mp3", "christopher": "audio/christopher_c20a6d0e84a14a07.mp3", "eric": "audio/eric_aa1466a6f9cdb00f.mp3", "ava": "audio/ava_62f5bcf69629279c.mp3"}}, {"t": "The most important one is the fundamental Gaussian mode, TEM zero zero.", "a": {"steffan": "audio/steffan_ff6b878aba5a5543.mp3", "guy": "audio/guy_1e8e1ddf6d0fdc92.mp3", "christopher": "audio/christopher_a414f1889f0508d9.mp3", "eric": "audio/eric_85d7d8cb36abfb44.mp3", "ava": "audio/ava_dfd81c4829049bad.mp3"}}, {"t": "Its intensity across the beam has a Gaussian profile, highest on the axis and falling off smoothly.", "a": {"steffan": "audio/steffan_4304a2cdf373f279.mp3", "guy": "audio/guy_8ffef5650f3d8281.mp3", "christopher": "audio/christopher_c1ef7d78030e82eb.mp3", "eric": "audio/eric_1f06ef2d081f06bc.mp3", "ava": "audio/ava_144727b648a08b36.mp3"}}, {"t": "The beam radius, w of z, changes along the beam.", "a": {"steffan": "audio/steffan_8d17b1d4c5c179ff.mp3", "guy": "audio/guy_c1de134fd29618cb.mp3", "christopher": "audio/christopher_79f3a5792184d8b2.mp3", "eric": "audio/eric_2c2bd1d8db3b319b.mp3", "ava": "audio/ava_bf6cd737ef5821dd.mp3"}}, {"t": "At its narrowest point, called the waist, the radius is w zero.", "a": {"steffan": "audio/steffan_d211bf4e88bdedbc.mp3", "guy": "audio/guy_b57f3e940a880c18.mp3", "christopher": "audio/christopher_340ff7ef238e2db7.mp3", "eric": "audio/eric_5be7dcbc716fe451.mp3", "ava": "audio/ava_90ee4617b00f4768.mp3"}}, {"t": "Around the waist, the beam stays nearly parallel over a distance called the Rayleigh length, which is pi times w zero squared divided by the wavelength.", "a": {"steffan": "audio/steffan_8d1b4d6c5ff39266.mp3", "guy": "audio/guy_2c8df2531e70b483.mp3", "christopher": "audio/christopher_b62f1bbe72ca3876.mp3", "eric": "audio/eric_f932b064c397d3c5.mp3", "ava": "audio/ava_d8048e1870725038.mp3"}}, {"t": "Over one Rayleigh length, the beam radius grows by a factor of the square root of two.", "a": {"steffan": "audio/steffan_59322fbdf190355b.mp3", "guy": "audio/guy_d0715b4570938b50.mp3", "christopher": "audio/christopher_3401a64754a22ed1.mp3", "eric": "audio/eric_49de6c3a5b0e72a4.mp3", "ava": "audio/ava_eff759eddea24080.mp3"}}, {"t": "So a tightly focused beam stays narrow only over a very short distance.", "a": {"steffan": "audio/steffan_9496efb57416c803.mp3", "guy": "audio/guy_6118f5a9f4e09a61.mp3", "christopher": "audio/christopher_e91e77faad8d9c2c.mp3", "eric": "audio/eric_ea1387d74e06c042.mp3", "ava": "audio/ava_c01e9396ed0969f7.mp3"}}, {"t": "For red light and a waist of one millimeter, the Rayleigh length is about five meters. For a waist of ten micrometers, it is only half a millimeter.", "a": {"steffan": "audio/steffan_9f097f7be208cb61.mp3", "guy": "audio/guy_6a0ee5be1c83ce89.mp3", "christopher": "audio/christopher_b35f4ea16c378166.mp3", "eric": "audio/eric_a3503c9290f8ae67.mp3", "ava": "audio/ava_5485d4650bd55fe0.mp3"}}, {"t": "Far from the waist, the beam spreads in a cone with a half angle of the wavelength divided by pi times w zero.", "a": {"steffan": "audio/steffan_28ec9f86a329798e.mp3", "guy": "audio/guy_fe33163cd124e336.mp3", "christopher": "audio/christopher_3f515af34dfb9d61.mp3", "eric": "audio/eric_b5836c56a9d754bc.mp3", "ava": "audio/ava_e7ecfd56a13b541a.mp3"}}, {"t": "So the smaller the waist, the faster the beam diverges.", "a": {"steffan": "audio/steffan_6f07df1a28d17793.mp3", "guy": "audio/guy_15f278fc6e7fbeec.mp3", "christopher": "audio/christopher_248972f6feaf557d.mp3", "eric": "audio/eric_88a49eb2a0863f40.mp3", "ava": "audio/ava_de894fa5905bcb19.mp3"}}, {"t": "The wave fronts are curved, with a radius of curvature R of z.", "a": {"steffan": "audio/steffan_d37238ddc1465b66.mp3", "guy": "audio/guy_5bc4c450be4563fb.mp3", "christopher": "audio/christopher_9ed2fb28381b3d43.mp3", "eric": "audio/eric_415e500ba8052b1d.mp3", "ava": "audio/ava_133d6db80e960b6f.mp3"}}, {"t": "Passing through the waist, the beam also picks up an extra phase shift, called the Gouy phase.", "a": {"steffan": "audio/steffan_e381b8cc1ba77d13.mp3", "guy": "audio/guy_7a42b2da82f340ed.mp3", "christopher": "audio/christopher_d4f4d15ca08bda0f.mp3", "eric": "audio/eric_44e7a566e6d49f5d.mp3", "ava": "audio/ava_7cc6aa1d2111e137.mp3"}}, {"t": "A stable mode is one whose wave fronts match the curved surfaces of the cavity mirrors.", "a": {"steffan": "audio/steffan_0926eb678a89e8aa.mp3", "guy": "audio/guy_dac2a620297ceb54.mp3", "christopher": "audio/christopher_25b74e2026122658.mp3", "eric": "audio/eric_5156401cd364489c.mp3", "ava": "audio/ava_5b91351e73f096f1.mp3"}}, {"t": "Higher transverse modes, TEM m n, have the same Gaussian envelope multiplied by Hermite polynomials in x and y.", "a": {"steffan": "audio/steffan_3bbef588835e9f49.mp3", "guy": "audio/guy_b6c00564a0f07695.mp3", "christopher": "audio/christopher_5249003d504103f8.mp3", "eric": "audio/eric_428836aa842851b0.mp3", "ava": "audio/ava_0fd2e871fe8a5b8f.mp3"}}, {"t": "Their intensity patterns have dark nodal lines, and they spread further out from the axis.", "a": {"steffan": "audio/steffan_6a4ed9de3ecc9245.mp3", "guy": "audio/guy_c1a0d2421853acd5.mp3", "christopher": "audio/christopher_1a0c324c876a62d7.mp3", "eric": "audio/eric_1add23fbe483d076.mp3", "ava": "audio/ava_88216dcb4104803f.mp3"}}, {"t": "They also have a larger Gouy phase, so they oscillate at slightly different frequencies.", "a": {"steffan": "audio/steffan_4141111740f3a46f.mp3", "guy": "audio/guy_1c0915046bcd41c9.mp3", "christopher": "audio/christopher_52303ad5717d9b59.mp3", "eric": "audio/eric_160b29e1409dcba3.mp3", "ava": "audio/ava_d93a5c0ceec6982a.mp3"}}, {"t": "The fundamental mode is the most compact, so the apertures in the cavity cause the least loss for it.", "a": {"steffan": "audio/steffan_01b6dc04ed661877.mp3", "guy": "audio/guy_d8f6c9825f6c2e48.mp3", "christopher": "audio/christopher_caeb66dae22f87f3.mp3", "eric": "audio/eric_94c5a3b83e345c7e.mp3", "ava": "audio/ava_dcc269de1b26ed6a.mp3"}}, {"t": "That is why a well-aligned laser usually runs in TEM zero zero.", "a": {"steffan": "audio/steffan_0a00a7b0d4daad71.mp3", "guy": "audio/guy_78ac65bbe66428b3.mp3", "christopher": "audio/christopher_4c40e4842d2d18f4.mp3", "eric": "audio/eric_7c7ee991d5fc34a1.mp3", "ava": "audio/ava_5f1ee5cf227f0bda.mp3"}}]}, {"title": "The spectral linewidth", "items": [{"t": "How sharp is the frequency of a single-mode laser?", "a": {"steffan": "audio/steffan_0f75f59c77a4a251.mp3", "guy": "audio/guy_c348fe03213b7ca5.mp3", "christopher": "audio/christopher_3f3e65f93f173393.mp3", "eric": "audio/eric_9e48ab0c753cd19c.mp3", "ava": "audio/ava_6009bb9a1f87567f.mp3"}}, {"t": "In practice, the linewidth is set by technical noise, called jitter.", "a": {"steffan": "audio/steffan_33e52a4e017ca5fd.mp3", "guy": "audio/guy_80451056b64efc8a.mp3", "christopher": "audio/christopher_f18eeea3b2f98163.mp3", "eric": "audio/eric_a129c28a43926e22.mp3", "ava": "audio/ava_7207a7e87dcbb149.mp3"}}, {"t": "The mode frequency is fixed by the cavity length. Changing the round-trip length by one wavelength shifts the frequency by a full mode spacing.", "a": {"steffan": "audio/steffan_c8ae120b2b718fbb.mp3", "guy": "audio/guy_dba4efe8fff21d1f.mp3", "christopher": "audio/christopher_56c26c2021ec79a9.mp3", "eric": "audio/eric_059c6a159a90c76e.mp3", "ava": "audio/ava_8b601717982c6ac2.mp3"}}, {"t": "So tiny changes of the length matter. For a one meter cavity, moving a mirror by just one nanometer shifts the frequency by the order of a megahertz.", "a": {"steffan": "audio/steffan_1aa47a21a47dd7e9.mp3", "guy": "audio/guy_e7004df1439e3899.mp3", "christopher": "audio/christopher_83706b42db7ae1c3.mp3", "eric": "audio/eric_e7dea7f1719c2447.mp3", "ava": "audio/ava_eb9a36be3980a9e6.mp3"}}, {"t": "Such changes come from thermal expansion, vibrations, and pressure changes in the air.", "a": {"steffan": "audio/steffan_31df66e927ea4d60.mp3", "guy": "audio/guy_d14d9e06edf33c8f.mp3", "christopher": "audio/christopher_8cd65ba5803d205d.mp3", "eric": "audio/eric_5d2535733ff9f63d.mp3", "ava": "audio/ava_edb172246173da90.mp3"}}, {"t": "Without active stabilization, the short-term linewidth is usually a few megahertz.", "a": {"steffan": "audio/steffan_68969a2a2eae9214.mp3", "guy": "audio/guy_00661636e1346de4.mp3", "christopher": "audio/christopher_5d6f32282667686b.mp3", "eric": "audio/eric_9fab7900632308da.mp3", "ava": "audio/ava_7a17f2e6d4f6709e.mp3"}}, {"t": "To do better, the laser is locked to a stable reference, like a very stable cavity or a narrow atomic transition.", "a": {"steffan": "audio/steffan_aca984de688b8b81.mp3", "guy": "audio/guy_aa2ce139d8440e68.mp3", "christopher": "audio/christopher_508b19c91b741646.mp3", "eric": "audio/eric_1b3953c8f13f2925.mp3", "ava": "audio/ava_023379f023dea3e1.mp3"}}, {"t": "But even with a perfectly stable cavity, there is a fundamental limit: the Schawlow-Townes limit.", "a": {"steffan": "audio/steffan_fd01bec44defb6d3.mp3", "guy": "audio/guy_e199d520b1b874e4.mp3", "christopher": "audio/christopher_8ee8fdda59784ef8.mp3", "eric": "audio/eric_87c471f8d3f588f9.mp3", "ava": "audio/ava_3927ecf2ab94b0d6.mp3"}}, {"t": "Its cause is spontaneous emission into the laser mode.", "a": {"steffan": "audio/steffan_4623eee02fac6d97.mp3", "guy": "audio/guy_78e3a5c77485f31b.mp3", "christopher": "audio/christopher_b5c6d7fe9eda1c16.mp3", "eric": "audio/eric_2a8e6ebf6cff5848.mp3", "ava": "audio/ava_11fe598389796638.mp3"}}, {"t": "Each spontaneously emitted photon adds a small field with a random phase to the laser field.", "a": {"steffan": "audio/steffan_3c6952e7ac633e53.mp3", "guy": "audio/guy_6f8589cc86f6c111.mp3", "christopher": "audio/christopher_a92b7ee770b9734b.mp3", "eric": "audio/eric_bb2b94f3d08722df.mp3", "ava": "audio/ava_712a863073a8da2b.mp3"}}, {"t": "The change in amplitude is quickly corrected by gain saturation.", "a": {"steffan": "audio/steffan_01a91b06d9fbb9df.mp3", "guy": "audio/guy_ec7ac3f6837b880f.mp3", "christopher": "audio/christopher_594f268e6bd2e9d6.mp3", "eric": "audio/eric_4a62a209e69d0a1f.mp3", "ava": "audio/ava_81ead78e86e91361.mp3"}}, {"t": "But the change in phase is not corrected, because nothing in the laser fixes the absolute phase.", "a": {"steffan": "audio/steffan_68c4e9db5979a328.mp3", "guy": "audio/guy_2b0a15eb467913bc.mp3", "christopher": "audio/christopher_6ab25c25a3ecf095.mp3", "eric": "audio/eric_c4048632cfccf35a.mp3", "ava": "audio/ava_674171e2ad9cc4cb.mp3"}}, {"t": "So the phase of the laser performs a random walk.", "a": {"steffan": "audio/steffan_5f66d3942223fa1c.mp3", "guy": "audio/guy_05ae7074526047f9.mp3", "christopher": "audio/christopher_0af40a81b1444627.mp3", "eric": "audio/eric_85f3a8e92c8543ea.mp3", "ava": "audio/ava_a464ed83ee648a95.mp3"}}, {"t": "After a time tau c, the coherence time, the phase has forgotten its starting value.", "a": {"steffan": "audio/steffan_3e9cea749134b394.mp3", "guy": "audio/guy_c1c885ce84f05549.mp3", "christopher": "audio/christopher_9bb79381c278e15d.mp3", "eric": "audio/eric_081cc3b5b92182c2.mp3", "ava": "audio/ava_1c2c3028c87f1866.mp3"}}, {"t": "This gives a linewidth of about one over tau c.", "a": {"steffan": "audio/steffan_fa8ebb35093f98ec.mp3", "guy": "audio/guy_98b3a971c2cea242.mp3", "christopher": "audio/christopher_47aa6943d3c27822.mp3", "eric": "audio/eric_bc116e6896a4e391.mp3", "ava": "audio/ava_3f378029439181a3.mp3"}}, {"t": "More precisely, the Schawlow-Townes linewidth divided by the cavity linewidth is pi over the number of photons in the cavity, times N b over N b minus N a.", "a": {"steffan": "audio/steffan_937d4443691a3df1.mp3", "guy": "audio/guy_3d74ce9639f8a321.mp3", "christopher": "audio/christopher_1fce4006d4f2b1af.mp3", "eric": "audio/eric_cc4ee95e5381aa96.mp3", "ava": "audio/ava_b709f140bcd53d8b.mp3"}}, {"t": "So the more photons there are in the cavity, the less each spontaneous photon disturbs the phase, and the narrower the line.", "a": {"steffan": "audio/steffan_94da0b55579907e5.mp3", "guy": "audio/guy_79f036ae85c00906.mp3", "christopher": "audio/christopher_8706129dd3f7d140.mp3", "eric": "audio/eric_0b5288eb69ac0dcf.mp3", "ava": "audio/ava_53f88f5923c76702.mp3"}}, {"t": "For a helium neon laser, the Schawlow-Townes limit is about a millihertz. In practice, its linewidth is set by technical noise.", "a": {"steffan": "audio/steffan_2c0d9b287964ae4c.mp3", "guy": "audio/guy_9170563aa9339815.mp3", "christopher": "audio/christopher_003eef83ff2a88b0.mp3", "eric": "audio/eric_fc28606ad941d831.mp3", "ava": "audio/ava_97dba07b9604aeb1.mp3"}}, {"t": "For a diode laser, the limit is about a megahertz, nine orders of magnitude larger.", "a": {"steffan": "audio/steffan_4d678832e05afb30.mp3", "guy": "audio/guy_107ec1a94c7f5b64.mp3", "christopher": "audio/christopher_ab755edacf18b213.mp3", "eric": "audio/eric_0e4a1da081ab2c93.mp3", "ava": "audio/ava_808c31f76fe1573e.mp3"}}, {"t": "The reason is the very short, low-finesse cavity: it has a broad cavity linewidth and stores far fewer photons.", "a": {"steffan": "audio/steffan_baf2119c473db478.mp3", "guy": "audio/guy_080bb69b15848cfa.mp3", "christopher": "audio/christopher_9f0734eaff17fe54.mp3", "eric": "audio/eric_3981e8df118c4de0.mp3", "ava": "audio/ava_0672ca1336a84a93.mp3"}}, {"t": "To narrow a diode laser, one extends its cavity with an external mirror or grating.", "a": {"steffan": "audio/steffan_8137e8a110e11c39.mp3", "guy": "audio/guy_14c9d21083001c4a.mp3", "christopher": "audio/christopher_ac319c1597b8d804.mp3", "eric": "audio/eric_8ba02b08808644fa.mp3", "ava": "audio/ava_68ad98f2c87c6962.mp3"}}]}, {"title": "Pulsed lasers: mode locking", "items": [{"t": "Now we turn to pulsed lasers. With mode locking, a laser can produce extremely short and intense pulses.", "a": {"steffan": "audio/steffan_56c4ecff0c411cc9.mp3", "guy": "audio/guy_f5a6e25f76513cb1.mp3", "christopher": "audio/christopher_8c5a395a321e6048.mp3", "eric": "audio/eric_f76278499dd70ac9.mp3", "ava": "audio/ava_7328ca009367b4c6.mp3"}}, {"t": "Take a laser running on N longitudinal modes, equally spaced in frequency, all with the same amplitude.", "a": {"steffan": "audio/steffan_63ff898fc42952c8.mp3", "guy": "audio/guy_b737e47eb587ec46.mp3", "christopher": "audio/christopher_8ae0601c2108abe1.mp3", "eric": "audio/eric_3bddb1c618eaa4f3.mp3", "ava": "audio/ava_428c5238b93b310c.mp3"}}, {"t": "The total field is the sum of the N modes, each with its own phase.", "a": {"steffan": "audio/steffan_094400fa7b2586b9.mp3", "guy": "audio/guy_462af7337ed93613.mp3", "christopher": "audio/christopher_4a709cbe826d8d5d.mp3", "eric": "audio/eric_2adea611827aa69e.mp3", "ava": "audio/ava_6a791a9dac3a5e7b.mp3"}}, {"t": "The intensity is the square of the total field, averaged over the response time of the detector.", "a": {"steffan": "audio/steffan_6965313c40a47f06.mp3", "guy": "audio/guy_c53ae4ae38000c7b.mp3", "christopher": "audio/christopher_972675f287c0771e.mp3", "eric": "audio/eric_def3213a546c9f20.mp3", "ava": "audio/ava_2cb98a5efe47b3d7.mp3"}}, {"t": "Terms at the sum of two optical frequencies oscillate too fast and average out.", "a": {"steffan": "audio/steffan_f0d5d527a5aaa2b4.mp3", "guy": "audio/guy_0435470ea746e376.mp3", "christopher": "audio/christopher_05661d7291ea5f21.mp3", "eric": "audio/eric_44c894253e18542f.mp3", "ava": "audio/ava_128627d6455fcac7.mp3"}}, {"t": "What remains is the average intensity, N times E zero squared over two, plus a sum of beat terms between pairs of modes.", "a": {"steffan": "audio/steffan_bf77ff266c4f2b3e.mp3", "guy": "audio/guy_3ea5041195a7e664.mp3", "christopher": "audio/christopher_8a7a4f84635734bd.mp3", "eric": "audio/eric_ffa6757712a01a21.mp3", "ava": "audio/ava_dba0c94179182a21.mp3"}}, {"t": "If the phases of the modes are random, these beat terms add up to noise.", "a": {"steffan": "audio/steffan_85618e02351f01d4.mp3", "guy": "audio/guy_e5b0967a7257fc2c.mp3", "christopher": "audio/christopher_1fbcc7820d830e5b.mp3", "eric": "audio/eric_50d3eb24ca7a03c6.mp3", "ava": "audio/ava_24106dc74b5a5539.mp3"}}, {"t": "The intensity then fluctuates randomly around its mean, and the fluctuations are as large as the mean itself.", "a": {"steffan": "audio/steffan_fa4086dd23679ab2.mp3", "guy": "audio/guy_2c2021a4f34df703.mp3", "christopher": "audio/christopher_763604fdaca7ec01.mp3", "eric": "audio/eric_0af7094cdd7ff4a1.mp3", "ava": "audio/ava_5e0e7f5d33b2a21f.mp3"}}, {"t": "Now lock all the phases to the same value.", "a": {"steffan": "audio/steffan_238ba5a830f443ce.mp3", "guy": "audio/guy_d268a1ad99953ba1.mp3", "christopher": "audio/christopher_e761d681eb609553.mp3", "eric": "audio/eric_24d551138f26fa6f.mp3", "ava": "audio/ava_8b166a52ea1ea5b5.mp3"}}, {"t": "Then the sum becomes a geometric series, and the intensity is E zero squared over two, times the sine of N delta t over two, divided by the sine of delta t over two, all squared. Here delta is the angular mode spacing.", "a": {"steffan": "audio/steffan_58e03b4ded0d9a2a.mp3", "guy": "audio/guy_0db5de2f37bb5627.mp3", "christopher": "audio/christopher_3d7d1382fe820e70.mp3", "eric": "audio/eric_dc190595ddb44b69.mp3", "ava": "audio/ava_cb7ed8e3fd8fa113.mp3"}}, {"t": "This function is a train of sharp pulses.", "a": {"steffan": "audio/steffan_2156c7ea289aec2d.mp3", "guy": "audio/guy_17351d4dcd74cca2.mp3", "christopher": "audio/christopher_583670b210e80907.mp3", "eric": "audio/eric_d42b4c49e643575a.mp3", "ava": "audio/ava_496b7df748684f1d.mp3"}}, {"t": "At certain moments, all the modes are in phase and interfere constructively. In between, they cancel each other.", "a": {"steffan": "audio/steffan_db75b4130923b97a.mp3", "guy": "audio/guy_30fc9d0dfd248c88.mp3", "christopher": "audio/christopher_c063332cfcd470df.mp3", "eric": "audio/eric_91cfdf64ef0f2c89.mp3", "ava": "audio/ava_e575e5feaed30013.mp3"}}, {"t": "The pulses repeat after one round-trip time of the cavity.", "a": {"steffan": "audio/steffan_7ab6c9d1e1183727.mp3", "guy": "audio/guy_7a0e3b229056d67d.mp3", "christopher": "audio/christopher_245919d1830951c9.mp3", "eric": "audio/eric_919c85fc62c78722.mp3", "ava": "audio/ava_5bfc3e1fdd4d3c73.mp3"}}, {"t": "Physically, a single short pulse bounces back and forth in the cavity, and each time it hits the output mirror, part of it leaves.", "a": {"steffan": "audio/steffan_f7ff8a931af24b2c.mp3", "guy": "audio/guy_34b54ebe507c06a3.mp3", "christopher": "audio/christopher_749a3d807bdf0d47.mp3", "eric": "audio/eric_338b927a0fa2b66b.mp3", "ava": "audio/ava_cefff98e9c199d92.mp3"}}, {"t": "The duration of each pulse is the round-trip time divided by N.", "a": {"steffan": "audio/steffan_606ef5ae94de855d.mp3", "guy": "audio/guy_dca577a44d2d7dd0.mp3", "christopher": "audio/christopher_e0f39e2b2c4b713d.mp3", "eric": "audio/eric_a15f64a8c2fb4cd7.mp3", "ava": "audio/ava_0705146513b33195.mp3"}}, {"t": "The peak intensity is N squared times E zero squared over two, which is N times the average intensity.", "a": {"steffan": "audio/steffan_c580c792a2905aa0.mp3", "guy": "audio/guy_d95214903586faa3.mp3", "christopher": "audio/christopher_c8f8f0fe1080c9b4.mp3", "eric": "audio/eric_aa96e189f824dbdd.mp3", "ava": "audio/ava_9ac5c1f9cdebb2cc.mp3"}}, {"t": "So the more modes are locked, the shorter the pulses and the higher the peak intensity, while the average power only grows linearly with N.", "a": {"steffan": "audio/steffan_664058ff94d9df17.mp3", "guy": "audio/guy_c84543dc461e704b.mp3", "christopher": "audio/christopher_2e7facf2dda32572.mp3", "eric": "audio/eric_a88059e9f2d6a953.mp3", "ava": "audio/ava_665d178fc833c8fc.mp3"}}, {"t": "To lock many modes, we need a broad gain curve. That is why titanium sapphire, with its very broad gain, is used for ultrashort pulses.", "a": {"steffan": "audio/steffan_c9f7e3b3906ff2b0.mp3", "guy": "audio/guy_a8320f7c2992e7f8.mp3", "christopher": "audio/christopher_7b98686fb413a006.mp3", "eric": "audio/eric_5a4dbff00229ebf4.mp3", "ava": "audio/ava_b807ae3b74e98e6b.mp3"}}, {"t": "A commercial titanium sapphire laser gives pulses of about a hundred femtoseconds.", "a": {"steffan": "audio/steffan_81650bb671584abf.mp3", "guy": "audio/guy_da169c9d98e5d405.mp3", "christopher": "audio/christopher_3a81195e1105d206.mp3", "eric": "audio/eric_e455cf047ff4e155.mp3", "ava": "audio/ava_18e9761cca37486c.mp3"}}, {"t": "After amplification, pulses can become even shorter, and peak powers can reach the petawatt range, ten to the fifteen watts.", "a": {"steffan": "audio/steffan_4165a7fe08fa157c.mp3", "guy": "audio/guy_f23d72f2f66aaffe.mp3", "christopher": "audio/christopher_0d3c58bbcc57d023.mp3", "eric": "audio/eric_2040c8f53e94dad9.mp3", "ava": "audio/ava_b671d9fa6d2f6381.mp3"}}, {"t": "Such pulses are used for time-resolved experiments and for nonlinear optics.", "a": {"steffan": "audio/steffan_9515559ca9caab44.mp3", "guy": "audio/guy_0aa0fc2fd3c2c9c8.mp3", "christopher": "audio/christopher_dc6bbd9dc446b4c3.mp3", "eric": "audio/eric_4c279a65f3aa7bf2.mp3", "ava": "audio/ava_b2283451e76cb48b.mp3"}}]}, {"title": "How mode locking is done", "items": [{"t": "In active mode locking, the cavity loss is modulated, for example with an acousto-optic or an electro-optic modulator.", "a": {"steffan": "audio/steffan_9049530001796559.mp3", "guy": "audio/guy_fd23d689794fa231.mp3", "christopher": "audio/christopher_c773f075f418208a.mp3", "eric": "audio/eric_e0a8b613f7d6b7a6.mp3", "ava": "audio/ava_1970125c6bed159c.mp3"}}, {"t": "The modulation frequency equals the mode spacing.", "a": {"steffan": "audio/steffan_b20d733515d965bd.mp3", "guy": "audio/guy_368419a7371b9124.mp3", "christopher": "audio/christopher_163d081a2819dfcb.mp3", "eric": "audio/eric_c05ae7e8e5e81ef2.mp3", "ava": "audio/ava_92f93b3feacdf616.mp3"}}, {"t": "In the frequency picture, the modulation puts sidebands on each mode, exactly at the frequencies of its neighbors, and this locks their phases together.", "a": {"steffan": "audio/steffan_1f754e0a7ae3b978.mp3", "guy": "audio/guy_4e44fe534110ff21.mp3", "christopher": "audio/christopher_d2ebc243ee0c9294.mp3", "eric": "audio/eric_9338a7167b228e14.mp3", "ava": "audio/ava_7140550ffd8db11e.mp3"}}, {"t": "In the time picture, a pulse that passes the modulator exactly when the loss is lowest survives best. This works because the modulation period equals the round-trip time.", "a": {"steffan": "audio/steffan_dabf02fcdf5366c2.mp3", "guy": "audio/guy_c6269a0e2ac49044.mp3", "christopher": "audio/christopher_2b14c4eb05437dd2.mp3", "eric": "audio/eric_297f94d73fd7acfb.mp3", "ava": "audio/ava_e8003abf93e1ba43.mp3"}}, {"t": "In passive mode locking, a saturable absorber is placed in the cavity.", "a": {"steffan": "audio/steffan_80ccfb98a383c733.mp3", "guy": "audio/guy_f9d60ed4a5fa2193.mp3", "christopher": "audio/christopher_7b63ca3d582445ac.mp3", "eric": "audio/eric_9d7116d34ab667e5.mp3", "ava": "audio/ava_032f78af04c1576c.mp3"}}, {"t": "A saturable absorber absorbs weak light but becomes transparent for strong light.", "a": {"steffan": "audio/steffan_27dbff2321b62142.mp3", "guy": "audio/guy_556a9380d9e6dc0c.mp3", "christopher": "audio/christopher_518144505e894629.mp3", "eric": "audio/eric_78d4b66b71cc6509.mp3", "ava": "audio/ava_4811858e7514795a.mp3"}}, {"t": "So an intense short pulse loses less than weak continuous light, and the laser prefers to run in pulses.", "a": {"steffan": "audio/steffan_71b99bc6ab3f83eb.mp3", "guy": "audio/guy_e8029e9ef67092b1.mp3", "christopher": "audio/christopher_5262d33f74e56e09.mp3", "eric": "audio/eric_6c9a1508c7932523.mp3", "ava": "audio/ava_141efe1f90071613.mp3"}}, {"t": "Another passive method, used in titanium sapphire lasers, is Kerr lens mode locking. An intense pulse focuses itself
