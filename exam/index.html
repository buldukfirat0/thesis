<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>EXAM Quantum Optics sesli calisma</title>
<style>
  :root {
    --bg: #eceae4; --panel: #f7f5f0; --ink: #23272e; --muted: #6b7280;
    --line: #d5d0c4; --acc: #b7791f; --term: #0f766e; --active: #fdf3e0;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14181f; --panel: #1c222b; --ink: #e8ecf2; --muted: #98a2b0;
            --line: #333c48; --acc: #d9a03f; --term: #3fb8a9; --active: #2b2415; }
  }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  /* hizli ard arda dokunusta cift dokunma zoom'unu kapatir, seri ileri almak icin */
  button, select { touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  html, body { overscroll-behavior-y: none; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, Roboto, "Segoe UI", sans-serif;
    padding-bottom: calc(96px + var(--safe-b));
    -webkit-text-size-adjust: 100%;
  }
  header {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: 10px 12px 8px; border-bottom: 1px solid var(--line);
    padding-top: calc(8px + env(safe-area-inset-top, 0px));
  }
  h1 { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
  /* bolum secici: tek satir, yatay kaydirma yok. Ok tuslari sirayla gezer,
     ortadaki dugme butun bolumlerin listesini tam ekran acar. */
  .pick { display: flex; gap: 8px; align-items: stretch; }
  .pick .nav {
    flex: 0 0 46px; border: 1px solid var(--line); background: var(--panel);
    color: var(--ink); border-radius: 10px; font-size: 18px;
  }
  .pick .nav:disabled { opacity: .3; }
  .pick .cur {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 9px; text-align: left;
    border: 1px solid var(--acc); background: var(--panel); color: var(--ink);
    border-radius: 10px; padding: 8px 11px; min-height: 48px; font-size: 15px;
  }
  .pick .cur .badge {
    flex: 0 0 auto; background: var(--acc); color: var(--bg); font-weight: 700;
    border-radius: 7px; padding: 3px 8px; font-size: 12.5px; font-variant-numeric: tabular-nums;
  }
  .pick .cur .nm { flex: 1; min-width: 0; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pick .cur .pos { flex: 0 0 auto; color: var(--muted); font-size: 11.5px;
    font-variant-numeric: tabular-nums; }
  /* tam ekran bolum listesi */
  .sheet { position: fixed; inset: 0; z-index: 30; display: none;
    flex-direction: column; background: var(--bg); }
  .sheet.on { display: flex; }
  .sheet .shead { display: flex; gap: 8px; align-items: center;
    padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 10px;
    border-bottom: 1px solid var(--line); }
  .sheet .shead input {
    flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--panel);
    color: var(--ink); border-radius: 10px; padding: 11px 12px; font-size: 16px;
    -webkit-appearance: none; appearance: none;
  }
  .sheet .shead button { flex: 0 0 auto; border: 1px solid var(--line); background: var(--panel);
    color: var(--ink); border-radius: 10px; padding: 11px 14px; font-size: 14px; }
  .sheet .slist { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain; scrollbar-width: none;
    padding: 8px 12px calc(18px + var(--safe-b)); }
  .sheet .slist::-webkit-scrollbar { display: none; }
  .sheet .row {
    display: flex; align-items: center; gap: 11px; width: 100%; text-align: left;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    border-radius: 10px; padding: 12px 12px; margin-bottom: 6px; font-size: 15px;
  }
  .sheet .row .b { flex: 0 0 30px; text-align: center; color: var(--muted);
    font-size: 13px; font-variant-numeric: tabular-nums; }
  .sheet .row .n { flex: 1; min-width: 0; }
  .sheet .row .c { flex: 0 0 auto; color: var(--muted); font-size: 11.5px; }
  .sheet .row.on { border-color: var(--acc); background: var(--active); }
  .sheet .row.on .b, .sheet .row.on .n { color: var(--acc); font-weight: 700; }
  .sheet .none { color: var(--muted); font-size: 14px; padding: 14px 4px; }
  .opts { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
  .opts button, .opts select {
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    border-radius: 9px; padding: 9px 11px; font-size: 13px; min-height: 40px;
  }
  .opts button.on { border-color: var(--acc); color: var(--acc); font-weight: 600; }
  .opts .lbl { font-size: 11px; color: var(--muted); margin-right: -2px; }
  .opts button.sleep.on { border-color: var(--term); color: var(--term); }
  main { padding: 10px 12px; }
  .sec { margin: 16px 0 6px; font-size: 11.5px; letter-spacing: 0.08em;
         color: var(--muted); text-transform: uppercase; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 13px 14px; margin-bottom: 8px; font-size: 17px; line-height: 1.5;
    display: flex; gap: 10px; align-items: flex-start;
  }
  .card .txt { flex: 1; }
  .card .no { color: var(--muted); font-size: 12px; padding-top: 4px; min-width: 22px; }
  .card.playing { background: var(--active); border-color: var(--acc); }
  .bw { filter: blur(6px); border-radius: 3px; background: rgba(120,120,120,.10);
        transition: filter .12s; cursor: pointer; }
  .bw.show { filter: none; background: rgba(183,121,31,.14); }
  .card.revealed .bw { filter: none; background: transparent; }
  .eye { border: none; background: none; color: var(--muted); font-size: 18px;
         padding: 3px 5px; display: none; }
  .hiddenmode .eye { display: block; }
  .pen { border: none; background: none; color: var(--muted); font-size: 15px;
         padding: 3px 5px; }
  .card.edited { border-left: 3px solid var(--term); }
  .card .txt.editing { display: none; }
  .editbox { flex: 1; display: none; flex-direction: column; gap: 8px; }
  .card.editing-on .editbox { display: flex; }
  .editbox textarea { width: 100%; min-height: 80px; font-size: 16px; padding: 8px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
  .editrow { display: flex; gap: 6px; }
  .editrow button { border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    border-radius: 8px; padding: 8px 12px; font-size: 13px; }
  .editrow button.save { border-color: var(--acc); color: var(--acc); font-weight: 600; }
  .tinynote { font-size: 11px; color: var(--muted); }
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
    background: var(--panel); border-top: 1px solid var(--line);
    display: flex; gap: 8px; align-items: center; justify-content: center;
    padding: 10px 12px calc(10px + var(--safe-b));
  }
  .bar button {
    border: 1px solid var(--line); background: var(--bg); color: var(--ink);
    border-radius: 12px; font-size: 16px; height: 54px;
  }
  .bar .side { flex: 0 0 76px; }
  .bar .play { flex: 1; font-weight: 700; font-size: 17px; border-color: var(--acc); color: var(--acc); }
  .sleepwrap {
    position: fixed; inset: 0; z-index: 40; display: none;
    background: #05070a; color: #cbd3de;
    flex-direction: column; align-items: center; justify-content: center;
    padding: 32px 26px calc(40px + var(--safe-b)); text-align: center;
  }
  .sleepwrap.on { display: flex; }
  .sleepwrap .stag { font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
    color: #55606f; margin-bottom: 22px; }
  .sleepwrap .stxt { font-size: 22px; line-height: 1.55; max-width: 640px; color: #aeb7c4; }
  .sleepwrap .sprog { position: absolute; top: calc(16px + env(safe-area-inset-top,0px));
    left: 0; right: 0; font-size: 12px; color: #3d4650; }
  .sleepwrap .srow { position: absolute; bottom: calc(30px + var(--safe-b)); left: 0; right: 0;
    display: flex; gap: 12px; align-items: center; justify-content: center; }
  .sleepwrap .srow button {
    border: 1px solid #2a323d; background: #10151c; color: #8b96a5;
    border-radius: 999px; padding: 13px 22px; font-size: 15px; min-width: 60px;
  }
  .sleepwrap .srow .pp { min-width: 96px; color: #b7c1d0; }
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14181f">
</head>
<body>
<header>
  <h1>Experimental Quantum Optics &middot; sesli calisma</h1>
  <div class="pick">
    <button class="nav" id="partprev" type="button" aria-label="onceki bolum">&#8249;</button>
    <button class="cur" id="partbtn" type="button">
      <span class="badge" id="partnum"></span>
      <span class="nm" id="partname"></span>
      <span class="pos" id="partpos"></span>
    </button>
    <button class="nav" id="partnext" type="button" aria-label="sonraki bolum">&#8250;</button>
  </div>
  <div class="opts">
    <span class="lbl">Ses</span>
    <select id="voice">
      <option value="steffan" selected>Steffan</option>
      <option value="guy">Guy</option>
      <option value="christopher">Christopher (bariton)</option>
      <option value="eric">Eric (bariton)</option>
      <option value="ava">Ava (kadin)</option>
    </select>
    <span class="lbl">Hiz</span>
    <select id="speed">
      <option value="0.7">0.7x</option>
      <option value="0.85">0.85x</option>
      <option value="1" selected>1x</option>
      <option value="1.15">1.15x</option>
      <option value="1.3">1.3x</option>
    </select>
    <span class="lbl">Tekrar</span>
    <select id="rep">
      <option value="1" selected>1X</option>
      <option value="2">2X</option>
      <option value="3">3X</option>
    </select>
    <button id="hidebtn" type="button">Gizle</button>
    <button id="sleepbtn" class="sleep" type="button">Uyku modu</button>
  </div>
</header>

<main id="main"></main>

<div class="bar">
  <button class="side" id="prevbtn" type="button">&#9198;</button>
  <button class="play" id="playbtn" type="button">&#9654; Oynat</button>
  <button class="side" id="nextbtn" type="button">&#9197;</button>
</div>

<div class="sheet" id="sheet">
  <div class="shead">
    <input id="pfilter" type="search" placeholder="Bolum ara" autocomplete="off"
           autocorrect="off" autocapitalize="none" spellcheck="false">
    <button id="sheetclose" type="button">Kapat</button>
  </div>
  <div class="slist" id="slist"></div>
</div>

<div class="sleepwrap" id="sleepwrap">
  <div class="sprog" id="sprog"></div>
  <div class="stag" id="stag">Uyku modu</div>
  <div class="stxt" id="stxt"></div>
  <div class="srow">
    <button id="sprev" type="button">&#9198;</button>
    <button id="spp" class="pp" type="button">Duraklat</button>
    <button id="snext" type="button">&#9197;</button>
    <button id="sstop" type="button">Bitir</button>
  </div>
</div>

<script>
const DATA = [];
const DURS = {"steffan": [], "guy": [], "christopher": [], "eric": [], "ava": []};
(() => {
  const $ = s => document.querySelector(s);
  const mainEl = $('#main'), slistEl = $('#slist'), sheetEl = $('#sheet'), pfilter = $('#pfilter');
  let slide = 0, idx = -1, playing = false, paused = false, hidden = false, playsLeft = 1;
  let voiceKey = 'steffan';
  let flat = [];

  // single audio element, in DOM + playsinline: needed for iOS lock-screen playback
  const audio = new Audio();
  audio.preload = 'auto';
  audio.setAttribute('playsinline', '');
  audio.hidden = true;
  document.body.appendChild(audio);

  function speed() { return parseFloat($('#speed').value); }
  // tekrar: her cumle bu sayi kadar okunur (1X, 2X, 3X), hem normal hem uyku modunda
  function repN() { const r = parseInt($('#rep').value, 10); return r >= 1 ? r : 1; }

  // decode base64 -> bytes (used by both single-clip and sleep concatenation)
  function b64bytes(b64) {
    const bin = atob(b64); const n = bin.length; const u = new Uint8Array(n);
    for (let i = 0; i < n; i++) u[i] = bin.charCodeAt(i);
    return u;
  }
  // single-clip playback uses a blob URL (data: URIs are unreliable for <audio> on iOS)
  let lastClipURL = null;
  function setClip(b64) {
    const u = URL.createObjectURL(new Blob([b64bytes(b64)], { type: 'audio/mpeg' }));
    audio.src = u;
    if (lastClipURL) URL.revokeObjectURL(lastClipURL);
    lastClipURL = u;
  }
  function setPlayLabel() {
    $('#playbtn').innerHTML = (playing && !paused) ? '&#10074;&#10074; Duraklat'
                             : paused ? '&#9654; Devam' : '&#9654; Oynat';
  }

  // ---- wake lock ----
  let wakeLock = null;
  async function acquireWake() {
    try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
  }
  function releaseWake() { try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null; }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && (playing || sleepOn)) acquireWake();
  });

  // ---- persistent edits ----
  let edits = {};
  try { edits = JSON.parse(localStorage.getItem('sp_edits') || '{}'); } catch (e) { edits = {}; }
  const keyOf = (si, ii) => si + ':' + ii;
  function saveEdit(si, ii, text) { edits[keyOf(si, ii)] = text; localStorage.setItem('sp_edits', JSON.stringify(edits)); }
  function clearEdit(si, ii) { delete edits[keyOf(si, ii)]; localStorage.setItem('sp_edits', JSON.stringify(edits)); }

  try { const v = localStorage.getItem('sp_voice'); if (v) voiceKey = v; } catch (e) {}

  // ---- browser speech for edited sentences ----
  let enVoice = null;
  function pickVoice() {
    const vs = speechSynthesis.getVoices();
    enVoice = vs.find(v => /en[-_]US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
  }
  if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function speakText(text, onEnd) {
    if (!('speechSynthesis' in window)) { onEnd(); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = speed(); if (enVoice) u.voice = enVoice;
    u.onend = () => { if (playing) onEnd(); };
    speechSynthesis.speak(u);
  }

  const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  function blurMarkup(text) {
    return text.split(/(\s+)/).map(tok => {
      if (/^\s+$/.test(tok) || tok === '') return tok;
      const bare = tok.replace(/[^A-Za-z0-9]/g, '');
      const blur = bare.length > 2 && Math.random() < 0.6;
      return blur ? '<span class="bw">' + esc(tok) + '</span>' : esc(tok);
    }).join('');
  }

  function render() {
    mainEl.innerHTML = '';
    flat = [];
    DATA[slide].sections.forEach(sec => {
      const h = document.createElement('div');
      h.className = 'sec'; h.textContent = sec.title;
      mainEl.appendChild(h);
      sec.items.forEach((item) => {
        const gi = flat.length;
        const ek = edits[keyOf(slide, gi)];
        const isEdited = ek != null && ek !== item.t;
        const shown = isEdited ? ek : item.t;

        const card = document.createElement('div');
        card.className = 'card' + (isEdited ? ' edited' : '');
        const no = document.createElement('span');
        no.className = 'no'; no.textContent = String(gi + 1);
        const txt = document.createElement('div');
        txt.className = 'txt';
        if (hidden) {
          txt.innerHTML = blurMarkup(shown);
          txt.addEventListener('click', ev => {
            const t = ev.target;
            if (t.classList && t.classList.contains('bw')) { ev.stopPropagation(); t.classList.toggle('show'); }
          });
        } else { txt.textContent = shown; }
        const eye = document.createElement('button');
        eye.className = 'eye'; eye.textContent = '\u{1F441}';
        eye.setAttribute('aria-label', 'metni goster');
        eye.addEventListener('click', ev => { ev.stopPropagation(); card.classList.toggle('revealed'); });
        const pen = document.createElement('button');
        pen.className = 'pen'; pen.textContent = '✎';
        pen.setAttribute('aria-label', 'duzenle');

        const box = document.createElement('div');
        box.className = 'editbox';
        const ta = document.createElement('textarea'); ta.value = shown;
        const row = document.createElement('div'); row.className = 'editrow';
        const bSave = document.createElement('button'); bSave.className = 'save'; bSave.textContent = 'Kaydet';
        const bCancel = document.createElement('button'); bCancel.textContent = 'Vazgec';
        const bReset = document.createElement('button'); bReset.textContent = 'Orijinal';
        const note = document.createElement('span'); note.className = 'tinynote';
        note.textContent = 'Duzenlenen cumle telefonun sesiyle okunur.';
        row.append(bSave, bCancel, bReset);
        box.append(ta, row, note);

        pen.addEventListener('click', ev => { ev.stopPropagation(); card.classList.add('editing-on'); txt.classList.add('editing'); ta.focus(); });
        bCancel.addEventListener('click', ev => { ev.stopPropagation(); card.classList.remove('editing-on'); txt.classList.remove('editing'); ta.value = flat[gi].t; });
        bSave.addEventListener('click', ev => { ev.stopPropagation(); const v = ta.value.trim(); if (v && v !== item.t) saveEdit(slide, gi, v); else clearEdit(slide, gi); render(); });
        bReset.addEventListener('click', ev => { ev.stopPropagation(); clearEdit(slide, gi); render(); });

        card.append(no, txt, box, pen, eye);
        card.addEventListener('click', () => { playAt(gi); });
        mainEl.appendChild(card);
        flat.push({ orig: item.t, t: shown, a: item.a, edited: isEdited, el: card });
      });
    });
    document.body.classList.toggle('hiddenmode', hidden);
    idx = -1; stop();
  }

  function mark() { flat.forEach((f, i) => f.el.classList.toggle('playing', i === idx)); }

  function advance() {
    if (!playing || paused) return;
    if (playsLeft > 1) {                          // ayni cumleyi tekrar oku
      playsLeft -= 1;
      setTimeout(() => { if (playing && !paused) replay(); }, 300);
      return;
    }
    if (idx + 1 < flat.length) { setTimeout(() => { if (playing && !paused) playAt(idx + 1); }, 300); }
    else if (slide + 1 < DATA.length) {           // auto-advance into the next slide
      slide += 1; syncTabs(); render();
      setTimeout(() => playAt(0), 300);
    } else stop();
  }

  function playAt(i) {
    if (i < 0 || i >= flat.length) { stop(); return; }
    if (sleepOn) stopSleep();
    audio.pause();
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    idx = i; mark(); playing = true; paused = false; playsLeft = repN(); acquireWake();
    setPlayLabel();
    const f = flat[i];
    if (f.edited) { speakText(f.t, advance); }
    else { setClip(f.a[voiceKey] || f.a.steffan); audio.playbackRate = speed(); audio.play().catch(() => {}); }
    f.el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }

  // ayni klibi bastan calar; kaynak zaten yuklu oldugu icin blob yeniden kurulmaz
  function replay() {
    const f = flat[idx]; if (!f) return;
    if (f.edited) { speakText(f.t, advance); return; }
    try { audio.currentTime = 0; } catch (e) {}
    audio.playbackRate = speed();
    audio.play().catch(() => {});
  }

  function stop() {
    playing = false; paused = false; audio.pause();
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    setPlayLabel(); mark();
    if (!sleepOn) releaseWake();
  }

  // ---------------- SLEEP MODE ----------------
  // Butun metin tek surekli mp3 akisinda birlestirilir -> ekran kilitliyken de calar (YouTube gibi).
  // Tekrar (2X, 3X) akisin icine gomulur: her cumlenin klibi arka arkaya N kez eklenir,
  // boylece ekran kilitliyken de tekrar calisir, zamanlayiciya bagli degil.
  //   chunk  = akistaki tek bir klip (cumlenin r. tekrari)
  //   offsets[chunk] = klibin akistaki baslangici, chunkSeq[chunk] = ait oldugu cumle
  //   startOf[cumle]  = o cumlenin ilk tekrarinin baslangici (ileri/geri bunu kullanir)
  let sleepOn = false, seq = [], offsets = [], chunkSeq = [], chunkRep = [], startOf = [];
  let sleepURL = null, sleepChunk = -1, sleepRep = 1;

  function buildSeq() {
    seq = [];
    DATA.forEach((d) => d.sections.forEach((sec) =>
      sec.items.forEach((it) => seq.push({ num: d.num, name: d.name, sec: sec.title, t: it.t }))));
  }
  function buildConcat(vk, rep) {
    const parts = [], ds = DURS[vk] || DURS.steffan;
    offsets = []; chunkSeq = []; chunkRep = []; startOf = [];
    let acc = 0, k = 0;
    DATA.forEach((d) => d.sections.forEach((sec) => sec.items.forEach((it) => {
      const bytes = b64bytes(it.a[vk] || it.a.steffan);
      startOf.push(acc);
      for (let r = 0; r < rep; r++) {
        parts.push(bytes); offsets.push(acc); chunkSeq.push(k); chunkRep.push(r + 1);
        acc += ds[k];
      }
      k += 1;
    })));
    const blob = new Blob(parts, { type: 'audio/mpeg' });
    if (sleepURL) URL.revokeObjectURL(sleepURL);
    sleepURL = URL.createObjectURL(blob);
    sleepRep = rep;
    return sleepURL;
  }
  function idxAtTime(t) {
    let lo = 0, hi = offsets.length - 1, ans = 0;
    while (lo <= hi) { const m = (lo + hi) >> 1; if (offsets[m] <= t) { ans = m; lo = m + 1; } else hi = m - 1; }
    return ans;
  }
  function sleepShow(c) {
    const si = chunkSeq[c], s = seq[si]; if (!s) return;
    $('#stxt').textContent = s.t;
    $('#stag').textContent = s.name + '  ·  ' + s.sec;
    $('#sprog').textContent = (si + 1) + ' / ' + seq.length +
      (sleepRep > 1 ? '   ·   tekrar ' + chunkRep[c] + '/' + sleepRep : '');
    setMediaMeta(s);
  }
  function startSleep() {
    buildSeq();
    const url = buildConcat(voiceKey, repN());   // sync -> kullanici dokunusunu korur
    sleepOn = true; playing = false; sleepChunk = 0;
    $('#sleepbtn').classList.add('on');
    $('#sleepwrap').classList.add('on');
    $('#spp').textContent = 'Duraklat';
    acquireWake();
    audio.pause();
    audio.src = url; audio.playbackRate = speed();
    try { audio.currentTime = 0; } catch (e) {}
    sleepShow(0);
    audio.play().catch(() => {});
  }
  function stopSleep() {
    sleepOn = false; audio.pause();
    $('#sleepbtn').classList.remove('on');
    $('#sleepwrap').classList.remove('on');
    releaseWake();
  }
  // ileri/geri cumle atlar, tekrarlarin arasinda dolasmaz
  function sleepSeekTo(si) {
    si = Math.max(0, Math.min(startOf.length - 1, si));
    try { audio.currentTime = startOf[si] + 0.02; } catch (e) {}
    sleepChunk = idxAtTime(startOf[si] + 0.02); sleepShow(sleepChunk);
    if (audio.paused) audio.play().catch(() => {});
  }
  const curSentence = () => (chunkSeq[sleepChunk] != null ? chunkSeq[sleepChunk] : 0);
  // ses veya tekrar sayisi degisince akisi yeniden kurup ayni cumleden devam eder
  function rebuildSleep() {
    const si = curSentence(), wasPlaying = !audio.paused;
    const url = buildConcat(voiceKey, repN());
    audio.src = url; audio.playbackRate = speed();
    audio.addEventListener('loadedmetadata', function once() {
      audio.removeEventListener('loadedmetadata', once);
      try { audio.currentTime = startOf[si] + 0.02; } catch (e) {}
      sleepChunk = idxAtTime(startOf[si] + 0.02); sleepShow(sleepChunk);
      if (wasPlaying) audio.play().catch(() => {});
    });
  }

  audio.addEventListener('timeupdate', () => {
    if (!sleepOn) return;
    const c = idxAtTime(audio.currentTime);
    if (c !== sleepChunk) { sleepChunk = c; sleepShow(c); }
  });
  audio.addEventListener('ended', () => { if (sleepOn) stopSleep(); else advance(); });
  audio.addEventListener('play', () => { if (sleepOn) $('#spp').textContent = 'Duraklat'; });
  audio.addEventListener('pause', () => { if (sleepOn && !audio.ended) $('#spp').textContent = 'Devam'; });

  // ---- MediaSession: kilit ekrani kontrolleri ----
  function setMediaMeta(s) {
    if (!('mediaSession' in navigator)) return;
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: s.t.length > 64 ? s.t.slice(0, 64) + '…' : s.t,
        artist: s.name + (s.sec ? ' · ' + s.sec : ''),
        album: 'EXAM Quantum Optics'
      });
    } catch (e) {}
  }
  function setupMediaSession() {
    if (!('mediaSession' in navigator)) return;
    const ms = navigator.mediaSession;
    try {
      ms.setActionHandler('play', () => audio.play().catch(() => {}));
      ms.setActionHandler('pause', () => audio.pause());
      ms.setActionHandler('previoustrack', () => { if (sleepOn) sleepSeekTo(curSentence() - 1); });
      ms.setActionHandler('nexttrack', () => { if (sleepOn) sleepSeekTo(curSentence() + 1); });
    } catch (e) {}
  }

  // ---------------- controls ----------------
  $('#playbtn').addEventListener('click', () => {
    if (playing && !paused) {
      audio.pause(); paused = true; setPlayLabel(); if (!sleepOn) releaseWake();
    }
    else if (playing && paused) {
      paused = false; acquireWake();
      audio.play().catch(() => {}); setPlayLabel();
    }
    else { playAt(idx < 0 ? 0 : idx); }
  });
  $('#prevbtn').addEventListener('click', () => playAt(Math.max(0, idx - 1)));
  $('#nextbtn').addEventListener('click', () => playAt(Math.min(flat.length - 1, idx + 1)));
  $('#speed').addEventListener('change', () => { audio.playbackRate = speed(); });
  $('#voice').addEventListener('change', e => {
    voiceKey = e.target.value;
    try { localStorage.setItem('sp_voice', voiceKey); } catch (er) {}
    if (sleepOn) rebuildSleep();
    else if (playing && idx >= 0 && !flat[idx].edited) { playAt(idx); }
  });
  $('#rep').addEventListener('change', () => {
    try { localStorage.setItem('sp_rep', $('#rep').value); } catch (er) {}
    if (sleepOn) rebuildSleep();
    else if (playing) playsLeft = repN();
  });
  $('#hidebtn').addEventListener('click', () => { hidden = !hidden; $('#hidebtn').classList.toggle('on', hidden); render(); });
  $('#sleepbtn').addEventListener('click', () => { if (sleepOn) stopSleep(); else { stop(); startSleep(); } });
  $('#sstop').addEventListener('click', stopSleep);
  $('#sprev').addEventListener('click', () => sleepSeekTo(curSentence() - 1));
  $('#snext').addEventListener('click', () => sleepSeekTo(curSentence() + 1));
  $('#spp').addEventListener('click', () => { if (audio.paused) audio.play().catch(() => {}); else audio.pause(); });

  // ---------------- bolum secici ----------------
  const nSent = s => s.sections.reduce((a, sec) => a + sec.items.length, 0);

  function buildPicker() {
    slistEl.innerHTML = '';
    DATA.forEach((s, i) => {
      const r = document.createElement('button');
      r.type = 'button'; r.className = 'row';
      const b = document.createElement('span'); b.className = 'b'; b.textContent = s.num;
      const n = document.createElement('span'); n.className = 'n'; n.textContent = s.name;
      const c = document.createElement('span'); c.className = 'c'; c.textContent = nSent(s) + ' cumle';
      r.append(b, n, c);
      r.addEventListener('click', () => { closeSheet(); goPart(i); });
      slistEl.appendChild(r);
    });
    const none = document.createElement('div');
    none.className = 'none'; none.id = 'pnone'; none.textContent = 'Eslesen bolum yok.';
    none.style.display = 'none';
    slistEl.appendChild(none);
  }

  // syncTabs: baslıktaki bolum dugmesini ve listedeki isaretlemeyi gunceller
  function syncTabs() {
    const s = DATA[slide];
    $('#partnum').textContent = s.num;
    $('#partname').textContent = s.name;
    $('#partpos').textContent = (slide + 1) + '/' + DATA.length;
    $('#partprev').disabled = slide === 0;
    $('#partnext').disabled = slide === DATA.length - 1;
    [...slistEl.querySelectorAll('.row')].forEach((r, k) => r.classList.toggle('on', k === slide));
  }

  function goPart(i) {
    i = Math.max(0, Math.min(DATA.length - 1, i));
    if (i === slide) return;
    slide = i; syncTabs(); render(); window.scrollTo(0, 0);
  }

  function applyFilter() {
    const q = pfilter.value.trim().toLowerCase();
    let shown = 0;
    [...slistEl.querySelectorAll('.row')].forEach(r => {
      const hit = !q || r.textContent.toLowerCase().includes(q);
      r.style.display = hit ? '' : 'none';
      if (hit) shown += 1;
    });
    $('#pnone').style.display = shown ? 'none' : '';
  }
  function openSheet() {
    pfilter.value = ''; applyFilter();
    sheetEl.classList.add('on');
    const on = slistEl.querySelectorAll('.row')[slide];
    if (on) on.scrollIntoView({ block: 'center' });
  }
  function closeSheet() { sheetEl.classList.remove('on'); pfilter.blur(); }

  $('#partbtn').addEventListener('click', openSheet);
  $('#sheetclose').addEventListener('click', closeSheet);
  $('#partprev').addEventListener('click', () => goPart(slide - 1));
  $('#partnext').addEventListener('click', () => goPart(slide + 1));
  pfilter.addEventListener('input', applyFilter);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && sheetEl.classList.contains('on')) closeSheet();
  });

  if (!DATA.length) {
    mainEl.innerHTML = '<p style="padding:24px;color:var(--muted)">Henuz metin yok.</p>';
    return;
  }
  buildPicker();
  syncTabs();

  $('#voice').value = voiceKey;
  try { const r = localStorage.getItem('sp_rep'); if (r === '2' || r === '3') $('#rep').value = r; } catch (e) {}
  setupMediaSession();
  render();
})();
</script>
<script>
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
</script>
</body>
</html>
