 in the crystal, so it passes a small aperture with less loss.", "a": {"steffan": "audio/steffan_7b7e6c272595e646.mp3", "guy": "audio/guy_d7f43dea3fcb57e5.mp3", "christopher": "audio/christopher_10b6a8e29f7f97ce.mp3", "eric": "audio/eric_768da30480b1b136.mp3", "ava": "audio/ava_d8b435455cdbbcd4.mp3"}}, {"t": "Mode-locked lasers also give frequency combs: sets of equally spaced, precisely known frequencies, used as rulers for optical frequencies.", "a": {"steffan": "audio/steffan_9116c0b5ca0263e9.mp3", "guy": "audio/guy_e8a1497c4c4785b1.mp3", "christopher": "audio/christopher_4c41b25cee52ed54.mp3", "eric": "audio/eric_61c9f1e5bdaec735.mp3", "ava": "audio/ava_be1101c121592c5b.mp3"}}]}, {"title": "Lamps versus lasers", "items": [{"t": "Why use a laser, when a lamp is so much cheaper?", "a": {"steffan": "audio/steffan_328d6edf54ca530d.mp3", "guy": "audio/guy_5040f91d08866442.mp3", "christopher": "audio/christopher_3d8abfa4fd305e8e.mp3", "eric": "audio/eric_e84226df952caf20.mp3", "ava": "audio/ava_b6eb5639beb41f2c.mp3"}}, {"t": "The answer is that the laser concentrates its energy in space, in time, and in frequency.", "a": {"steffan": "audio/steffan_23888f95b211b9ae.mp3", "guy": "audio/guy_adb365cccfcc5099.mp3", "christopher": "audio/christopher_7765763c6959fed4.mp3", "eric": "audio/eric_ffbd41c6c5de89d9.mp3", "ava": "audio/ava_5e08ca9fb1f5ec5c.mp3"}}, {"t": "A lamp filament at three thousand kelvin emits about five hundred watts per square centimeter, spread over a huge spectral range and in all directions.", "a": {"steffan": "audio/steffan_56722ddb0efdeff8.mp3", "guy": "audio/guy_2602bbb4b3e0a9a5.mp3", "christopher": "audio/christopher_a498635b4d551f01.mp3", "eric": "audio/eric_ac93826a0d357e1a.mp3", "ava": "audio/ava_152d8a09613f798d.mp3"}}, {"t": "No optical system can concentrate this light to a higher intensity than at the source, because that would violate the second law of thermodynamics.", "a": {"steffan": "audio/steffan_e6a0e0fa407d0ded.mp3", "guy": "audio/guy_9a53fa794ea4782c.mp3", "christopher": "audio/christopher_6606a2614ba3a340.mp3", "eric": "audio/eric_01a366ef30998eb7.mp3", "ava": "audio/ava_c4214e3b3d82e216.mp3"}}, {"t": "And only a tiny fraction of the lamp light falls into the narrow line of an atomic transition.", "a": {"steffan": "audio/steffan_2c6c7b6bc831d056.mp3", "guy": "audio/guy_fae42d169e2c2e93.mp3", "christopher": "audio/christopher_ea89e37f8d1cb0eb.mp3", "eric": "audio/eric_d12791ea0ca34176.mp3", "ava": "audio/ava_4471387c27a9f23a.mp3"}}, {"t": "A laser, on the other hand, is spatially coherent, so it can be focused to a spot about one wavelength across.", "a": {"steffan": "audio/steffan_8f47295aa6ad50c6.mp3", "guy": "audio/guy_66ee019e7542d33c.mp3", "christopher": "audio/christopher_04a3a009a9726609.mp3", "eric": "audio/eric_3da537df89211c01.mp3", "ava": "audio/ava_c920ffbab1c5801e.mp3"}}, {"t": "A fifteen watt laser focused to one square micrometer gives about ten to the nine watts per square centimeter.", "a": {"steffan": "audio/steffan_cb584c4133ee7b1a.mp3", "guy": "audio/guy_86b267b9db034d74.mp3", "christopher": "audio/christopher_4295233916a667b7.mp3", "eric": "audio/eric_de35cbdf89f2d5e3.mp3", "ava": "audio/ava_7ad06934f85d5084.mp3"}}, {"t": "And all this power can sit within a spectral width of less than a megahertz.", "a": {"steffan": "audio/steffan_0a01eb29a5a63ee1.mp3", "guy": "audio/guy_1e1db5ffde4210e2.mp3", "christopher": "audio/christopher_4a049ced3627281d.mp3", "eric": "audio/eric_1a2b1c6dfbca7208.mp3", "ava": "audio/ava_55aff1e3dd12424f.mp3"}}, {"t": "So compared to a lamp, a laser has a narrow spectrum, a very directed beam, a much higher intensity, many more photons per unit bandwidth, and high spatial and temporal coherence.", "a": {"steffan": "audio/steffan_401f740efbd94537.mp3", "guy": "audio/guy_ada05ea330dd1008.mp3", "christopher": "audio/christopher_6d37d835893f6cd6.mp3", "eric": "audio/eric_bafb7915fe5a17ff.mp3", "ava": "audio/ava_4b6b9986cb856539.mp3"}}]}]}];

      slide += 1; syncTabs(); render();
      setTimeout(() => playAt(0), 300);
    } else stop();
  }

  function playAt(i) {
    if (i < 0 || i >= flat.length) { stop(); return; }
    if (sleepOn) stopSleep();
    audio.pause();
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    idx = i; mark(); playing = true; paused = false; playsLeft = repN(); acquireWake();
    setPlayLabel();
    const f = flat[i];
    if (f.edited) { speakText(f.t, advance); }
    else {
      const gen = ++clipGen;
      fetchClip(f.a[voiceKey] || f.a.steffan).then(buf => {
        if (gen !== clipGen || !playing || sleepOn) return;
        setClipBytes(buf); audio.playbackRate = speed(); audio.play().catch(() => {});
      }).catch(() => { if (gen === clipGen) { stop(); f.el.querySelector('.txt').title = 'ses yuklenemedi'; } });
      // warm up the next clips so playback does not wait on the network
      for (let j = i + 1; j <= i + 3 && j < flat.length; j++) fetchClip(flat[j].a[voiceKey] || flat[j].a.steffan).catch(() => {});
    }
    f.el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }

  // ayni klibi bastan calar; kaynak zaten yuklu oldugu icin blob yeniden kurulmaz
  function replay() {
    const f = flat[idx]; if (!f) return;
    if (f.edited) { speakText(f.t, advance); return; }
    try { audio.currentTime = 0; } catch (e) {}
    audio.playbackRate = speed();
    audio.play().catch(() => {});
  }

  function stop() {
    clipGen += 1;
    playing = false; paused = false; audio.pause();
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    setPlayLabel(); mark();
    if (!sleepOn) releaseWake();
  }

  // ---------------- SLEEP MODE ----------------
  // Butun metin tek surekli mp3 akisinda birlestirilir -> ekran kilitliyken de calar (YouTube gibi).
  // Tekrar (2X, 3X) akisin icine gomulur: her cumlenin klibi arka arkaya N kez eklenir,
  // boylece ekran kilitliyken de tekrar calisir, zamanlayiciya bagli degil.
  //   chunk  = akistaki tek bir klip (cumlenin r. tekrari)
  //   offsets[chunk] = klibin akistaki baslangici, chunkSeq[chunk] = ait oldugu cumle
  //   startOf[cumle]  = o cumlenin ilk tekrarinin baslangici (ileri/geri bunu kullanir)
  let sleepOn = false, seq = [], offsets = [], chunkSeq = [], chunkRep = [], startOf = [];
  let sleepURL = null, sleepChunk = -1, sleepRep = 1;

  function buildSeq() {
    seq = [];
    DATA.forEach((d) => d.sections.forEach((sec) =>
      sec.items.forEach((it) => seq.push({ num: d.num, name: d.name, sec: sec.title, t: it.t }))));
  }
  function buildConcat(vk, rep) {
    const parts = [], ds = DURS[vk] || DURS.steffan;
    offsets = []; chunkSeq = []; chunkRep = []; startOf = [];
    let acc = 0, k = 0;
    DATA.forEach((d) => d.sections.forEach((sec) => sec.items.forEach((it) => {
      const bytes = clipBytes[it.a[vk] || it.a.steffan];
      startOf.push(acc);
      for (let r = 0; r < rep; r++) {
        parts.push(bytes); offsets.push(acc); chunkSeq.push(k); chunkRep.push(r + 1);
        acc += ds[k];
      }
      k += 1;
    })));
    const blob = new Blob(parts, { type: 'audio/mpeg' });
    if (sleepURL) URL.revokeObjectURL(sleepURL);
    sleepURL = URL.createObjectURL(blob);
    sleepRep = rep;
    return sleepURL;
  }
  function idxAtTime(t) {
    let lo = 0, hi = offsets.length - 1, ans = 0;
    while (lo <= hi) { const m = (lo + hi) >> 1; if (offsets[m] <= t) { ans = m; lo = m + 1; } else hi = m - 1; }
    return ans;
  }
  function sleepShow(c) {
    const si = chunkSeq[c], s = seq[si]; if (!s) return;
    $('#stxt').textContent = s.t;
    $('#stag').textContent = s.name + '  ·  ' + s.sec;
    $('#sprog').textContent = (si + 1) + ' / ' + seq.length +
      (sleepRep > 1 ? '   ·   tekrar ' + chunkRep[c] + '/' + sleepRep : '');
    setMediaMeta(s);
  }
  // sleepGen: bumped on every start/stop/rebuild, so a load that finishes late is ignored
  let sleepGen = 0;
  async function ensureVoiceLoaded(vk, gen) {
    try {
      await loadVoice(vk, (d, n) => {
        if (gen === sleepGen && d < n) $('#stxt').textContent = 'Sesler yukleniyor ' + d + ' / ' + n;
      });
      return gen === sleepGen;
    } catch (e) {
      if (gen === sleepGen) $('#stxt').textContent = 'Sesler yuklenemedi. Internet baglantisini kontrol et.';
      return false;
    }
  }
  function playSleep() {
    // if the browser no longer counts the tap as fresh, the Devam button starts it
    audio.play().catch(() => { $('#spp').textContent = 'Devam'; });
  }
  async function startSleep() {
    buildSeq();
    const gen = ++sleepGen;
    sleepOn = true; playing = false; sleepChunk = 0;
    $('#sleepbtn').classList.add('on');
    $('#sleepwrap').classList.add('on');
    $('#spp').textContent = 'Duraklat';
    $('#stag').textContent = 'Uyku modu';
    $('#sprog').textContent = '';
    acquireWake();
    audio.pause();
    if (!(await ensureVoiceLoaded(voiceKey, gen))) return;
    const url = buildConcat(voiceKey, repN());
    audio.src = url; audio.playbackRate = speed();
    try { audio.currentTime = 0; } catch (e) {}
    sleepShow(0);
    playSleep();
  }
  function stopSleep() {
    sleepGen += 1;
    sleepOn = false; audio.pause();
    $('#sleepbtn').classList.remove('on');
    $('#sleepwrap').classList.remove('on');
    releaseWake();
  }
  // ileri/geri cumle atlar, tekrarlarin arasinda dolasmaz
  function sleepSeekTo(si) {
    if (!startOf.length) return;   // stream still loading
    si = Math.max(0, Math.min(startOf.length - 1, si));
    try { audio.currentTime = startOf[si] + 0.02; } catch (e) {}
    sleepChunk = idxAtTime(startOf[si] + 0.02); sleepShow(sleepChunk);
    if (audio.paused) audio.play().catch(() => {});
  }
  const curSentence = () => (chunkSeq[sleepChunk] != null ? chunkSeq[sleepChunk] : 0);
  // ses veya tekrar sayisi degisince akisi yeniden kurup ayni cumleden devam eder
  async function rebuildSleep() {
    const si = curSentence(), wasPlaying = !audio.paused;
    const gen = ++sleepGen;
    audio.pause();
    if (!(await ensureVoiceLoaded(voiceKey, gen))) return;
    const url = buildConcat(voiceKey, repN());
    audio.src = url; audio.playbackRate = speed();
    audio.addEventListener('loadedmetadata', function once() {
      audio.removeEventListener('loadedmetadata', once);
      try { audio.currentTime = startOf[si] + 0.02; } catch (e) {}
      sleepChunk = idxAtTime(startOf[si] + 0.02); sleepShow(sleepChunk);
      if (wasPlaying) audio.play().catch(() => {});
    });
  }

  audio.addEventListener('timeupdate', () => {
    if (!sleepOn) return;
    const c = idxAtTime(audio.currentTime);
    if (c !== sleepChunk) { sleepChunk = c; sleepShow(c); }
  });
  audio.addEventListener('ended', () => { if (sleepOn) stopSleep(); else advance(); });
  audio.addEventListener('play', () => { if (sleepOn) $('#spp').textContent = 'Duraklat'; });
  audio.addEventListener('pause', () => { if (sleepOn && !audio.ended) $('#spp').textContent = 'Devam'; });

  // ---- MediaSession: kilit ekrani kontrolleri ----
  function setMediaMeta(s) {
    if (!('mediaSession' in navigator)) return;
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: s.t.length > 64 ? s.t.slice(0, 64) + '…' : s.t,
        artist: s.name + (s.sec ? ' · ' + s.sec : ''),
        album: 'EXAM Quantum Optics'
      });
    } catch (e) {}
  }
  function setupMediaSession() {
    if (!('mediaSession' in navigator)) return;
    const ms = navigator.mediaSession;
    try {
      ms.setActionHandler('play', () => audio.play().catch(() => {}));
      ms.setActionHandler('pause', () => audio.pause());
      ms.setActionHandler('previoustrack', () => { if (sleepOn) sleepSeekTo(curSentence() - 1); });
      ms.setActionHandler('nexttrack', () => { if (sleepOn) sleepSeekTo(curSentence() + 1); });
    } catch (e) {}
  }

  // ---------------- controls ----------------
  $('#playbtn').addEventListener('click', () => {
    if (playing && !paused) {
      audio.pause(); paused = true; setPlayLabel(); if (!sleepOn) releaseWake();
    }
    else if (playing && paused) {
      paused = false; acquireWake();
      audio.play().catch(() => {}); setPlayLabel();
    }
    else { playAt(idx < 0 ? 0 : idx); }
  });
  $('#prevbtn').addEventListener('click', () => playAt(Math.max(0, idx - 1)));
  $('#nextbtn').addEventListener('click', () => playAt(Math.min(flat.length - 1, idx + 1)));
  $('#speed').addEventListener('change', () => { audio.playbackRate = speed(); });
  $('#voice').addEventListener('change', e => {
    voiceKey = e.target.value;
    try { localStorage.setItem('sp_voice', voiceKey); } catch (er) {}
    if (sleepOn) rebuildSleep();
    else if (playing && idx >= 0 && !flat[idx].edited) { playAt(idx); }
  });
  $('#rep').addEventListener('change', () => {
    try { localStorage.setItem('sp_rep', $('#rep').value); } catch (er) {}
    if (sleepOn) rebuildSleep();
    else if (playing) playsLeft = repN();
  });
  $('#hidebtn').addEventListener('click', () => { hidden = !hidden; $('#hidebtn').classList.toggle('on', hidden); render(); });
  $('#sleepbtn').addEventListener('click', () => { if (sleepOn) stopSleep(); else { stop(); startSleep(); } });
  $('#sstop').addEventListener('click', stopSleep);
  $('#sprev').addEventListener('click', () => sleepSeekTo(curSentence() - 1));
  $('#snext').addEventListener('click', () => sleepSeekTo(curSentence() + 1));
  $('#spp').addEventListener('click', () => { if (audio.paused) audio.play().catch(() => {}); else audio.pause(); });

  // ---------------- bolum secici ----------------
  const nSent = s => s.sections.reduce((a, sec) => a + sec.items.length, 0);

  function buildPicker() {
    slistEl.innerHTML = '';
    DATA.forEach((s, i) => {
      const r = document.createElement('button');
      r.type = 'button'; r.className = 'row';
      const b = document.createElement('span'); b.className = 'b'; b.textContent = s.num;
      const n = document.createElement('span'); n.className = 'n'; n.textContent = s.name;
      const c = document.createElement('span'); c.className = 'c'; c.textContent = nSent(s) + ' cumle';
      r.append(b, n, c);
      r.addEventListener('click', () => { closeSheet(); goPart(i); });
      slistEl.appendChild(r);
    });
    const none = document.createElement('div');
    none.className = 'none'; none.id = 'pnone'; none.textContent = 'Eslesen bolum yok.';
    none.style.display = 'none';
    slistEl.appendChild(none);
  }

  // syncTabs: baslıktaki bolum dugmesini ve listedeki isaretlemeyi gunceller
  function syncTabs() {
    const s = DATA[slide];
    $('#partnum').textContent = s.num;
    $('#partname').textContent = s.name;
    $('#partpos').textContent = (slide + 1) + '/' + DATA.length;
    $('#partprev').disabled = slide === 0;
    $('#partnext').disabled = slide === DATA.length - 1;
    [...slistEl.querySelectorAll('.row')].forEach((r, k) => r.classList.toggle('on', k === slide));
  }

  function goPart(i) {
    i = Math.max(0, Math.min(DATA.length - 1, i));
    if (i === slide) return;
    slide = i; syncTabs(); render(); window.scrollTo(0, 0);
  }

  function applyFilter() {
    const q = pfilter.value.trim().toLowerCase();
    let shown = 0;
    [...slistEl.querySelectorAll('.row')].forEach(r => {
      const hit = !q || r.textContent.toLowerCase().includes(q);
      r.style.display = hit ? '' : 'none';
      if (hit) shown += 1;
    });
    $('#pnone').style.display = shown ? 'none' : '';
  }
  function openSheet() {
    pfilter.value = ''; applyFilter();
    sheetEl.classList.add('on');
    const on = slistEl.querySelectorAll('.row')[slide];
    if (on) on.scrollIntoView({ block: 'center' });
  }
  function closeSheet() { sheetEl.classList.remove('on'); pfilter.blur(); }

  $('#partbtn').addEventListener('click', openSheet);
  $('#sheetclose').addEventListener('click', closeSheet);
  $('#partprev').addEventListener('click', () => goPart(slide - 1));
  $('#partnext').addEventListener('click', () => goPart(slide + 1));
  pfilter.addEventListener('input', applyFilter);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && sheetEl.classList.contains('on')) closeSheet();
  });

  if (!DATA.length) {
    mainEl.innerHTML = '<p style="padding:24px;color:var(--muted)">Henuz metin yok.</p>';
    return;
  }
  buildPicker();
  syncTabs();

  $('#voice').value = voiceKey;
  try { const r = localStorage.getItem('sp_rep'); if (r === '2' || r === '3') $('#rep').value = r; } catch (e) {}
  setupMediaSession();
  render();
})();
</script>
<script>
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
</script>
</body>
</html>
