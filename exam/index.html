<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>EXAM Quantum Optics sesli calisma</title>
<style>
  :root {
    --bg: #eceae4; --panel: #f7f5f0; --ink: #23272e; --muted: #6b7280;
    --line: #d5d0c4; --acc: #b7791f; --term: #0f766e; --active: #fdf3e0;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14181f; --panel: #1c222b; --ink: #e8ecf2; --muted: #98a2b0;
            --line: #333c48; --acc: #d9a03f; --term: #3fb8a9; --active: #2b2415; }
  }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  /* hizli ard arda dokunusta cift dokunma zoom'unu kapatir, seri ileri almak icin */
  button, select { touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  html, body { overscroll-behavior-y: none; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, Roboto, "Segoe UI", sans-serif;
    padding-bottom: calc(96px + var(--safe-b));
    -webkit-text-size-adjust: 100%;
  }
  header {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: 10px 12px 8px; border-bottom: 1px solid var(--line);
    padding-top: calc(8px + env(safe-area-inset-top, 0px));
  }
  h1 { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
  /* bolum secici: tek satir, yatay kaydirma yok. Ok tuslari sirayla gezer,
     ortadaki dugme butun bolumlerin listesini tam ekran acar. */
  .pick { display: flex; gap: 8px; align-items: stretch; }
  .pick .nav {
    flex: 0 0 46px; border: 1px solid var(--line); background: var(--panel);
    color: var(--ink); border-radius: 10px; font-size: 18px;
  }
  .pick .nav:disabled { opacity: .3; }
  .pick .cur {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 9px; text-align: left;
    border: 1px solid var(--acc); background: var(--panel); color: var(--ink);
    border-radius: 10px; padding: 8px 11px; min-height: 48px; font-size: 15px;
  }
  .pick .cur .badge {
    flex: 0 0 auto; background: var(--acc); color: var(--bg); font-weight: 700;
    border-radius: 7px; padding: 3px 8px; font-size: 12.5px; font-variant-numeric: tabular-nums;
  }
  .pick .cur .nm { flex: 1; min-width: 0; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pick .cur .pos { flex: 0 0 auto; color: var(--muted); font-size: 11.5px;
    font-variant-numeric: tabular-nums; }
  /* tam ekran bolum listesi */
  .sheet { position: fixed; inset: 0; z-index: 30; display: none;
    flex-direction: column; background: var(--bg); }
  .sheet.on { display: flex; }
  .sheet .shead { display: flex; gap: 8px; align-items: center;
    padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 10px;
    border-bottom: 1px solid var(--line); }
  .sheet .shead input {
    flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--panel);
    color: var(--ink); border-radius: 10px; padding: 11px 12px; font-size: 16px;
    -webkit-appearance: none; appearance: none;
  }
  .sheet .shead button { flex: 0 0 auto; border: 1px solid var(--line); background: var(--panel);
    color: var(--ink); border-radius: 10px; padding: 11px 14px; font-size: 14px; }
  .sheet .slist { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain; scrollbar-width: none;
    padding: 8px 12px calc(18px + var(--safe-b)); }
  .sheet .slist::-webkit-scrollbar { display: none; }
  .sheet .row {
    display: flex; align-items: center; gap: 11px; width: 100%; text-align: left;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    border-radius: 10px; padding: 12px 12px; margin-bottom: 6px; font-size: 15px;
  }
  .sheet .row .b { flex: 0 0 30px; text-align: center; color: var(--muted);
    font-size: 13px; font-variant-numeric: tabular-nums; }
  .sheet .row .n { flex: 1; min-width: 0; }
  .sheet .row .c { flex: 0 0 auto; color: var(--muted); font-size: 11.5px; }
  .sheet .row.on { border-color: var(--acc); background: var(--active); }
  .sheet .row.on .b, .sheet .row.on .n { color: var(--acc); font-weight: 700; }
  .sheet .none { color: var(--muted); font-size: 14px; padding: 14px 4px; }
  .opts { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
  .opts button, .opts select {
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    border-radius: 9px; padding: 9px 11px; font-size: 13px; min-height: 40px;
  }
  .opts button.on { border-color: var(--acc); color: var(--acc); font-weight: 600; }
  .opts .lbl { font-size: 11px; color: var(--muted); margin-right: -2px; }
  .opts button.sleep.on { border-color: var(--term); color: var(--term); }
  main { padding: 10px 12px; }
  .sec { margin: 16px 0 6px; font-size: 11.5px; letter-spacing: 0.08em;
         color: var(--muted); text-transform: uppercase; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 13px 14px; margin-bottom: 8px; font-size: 17px; line-height: 1.5;
    display: flex; gap: 10px; align-items: flex-start;
  }
  .card .txt { flex: 1; }
  .card .no { color: var(--muted); font-size: 12px; padding-top: 4px; min-width: 22px; }
  .card.playing { background: var(--active); border-color: var(--acc); }
  .bw { filter: blur(6px); border-radius: 3px; background: rgba(120,120,120,.10);
        transition: filter .12s; cursor: pointer; }
  .bw.show { filter: none; background: rgba(183,121,31,.14); }
  .card.revealed .bw { filter: none; background: transparent; }
  .eye { border: none; background: none; color: var(--muted); font-size: 18px;
         padding: 3px 5px; display: none; }
  .hiddenmode .eye { display: block; }
  .pen { border: none; background: none; color: var(--muted); font-size: 15px;
         padding: 3px 5px; }
  .card.edited { border-left: 3px solid var(--term); }
  .card .txt.editing { display: none; }
  .editbox { flex: 1; display: none; flex-direction: column; gap: 8px; }
  .card.editing-on .editbox { display: flex; }
  .editbox textarea { width: 100%; min-height: 80px; font-size: 16px; padding: 8px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
  .editrow { display: flex; gap: 6px; }
  .editrow button { border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    border-radius: 8px; padding: 8px 12px; font-size: 13px; }
  .editrow button.save { border-color: var(--acc); color: var(--acc); font-weight: 600; }
  .tinynote { font-size: 11px; color: var(--muted); }
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
    background: var(--panel); border-top: 1px solid var(--line);
    display: flex; gap: 8px; align-items: center; justify-content: center;
    padding: 10px 12px calc(10px + var(--safe-b));
  }
  .bar button {
    border: 1px solid var(--line); background: var(--bg); color: var(--ink);
    border-radius: 12px; font-size: 16px; height: 54px;
  }
  .bar .side { flex: 0 0 76px; }
  .bar .play { flex: 1; font-weight: 700; font-size: 17px; border-color: var(--acc); color: var(--acc); }
  .sleepwrap {
    position: fixed; inset: 0; z-index: 40; display: none;
    background: #05070a; color: #cbd3de;
    flex-direction: column; align-items: center; justify-content: center;
    padding: 32px 26px calc(40px + var(--safe-b)); text-align: center;
  }
  .sleepwrap.on { display: flex; }
  .sleepwrap .stag { font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
    color: #55606f; margin-bottom: 22px; }
  .sleepwrap .stxt { font-size: 22px; line-height: 1.55; max-width: 640px; color: #aeb7c4; }
  .sleepwrap .sprog { position: absolute; top: calc(16px + env(safe-area-inset-top,0px));
    left: 0; right: 0; font-size: 12px; color: #3d4650; }
  .sleepwrap .srow { position: absolute; bottom: calc(30px + var(--safe-b)); left: 0; right: 0;
    display: flex; gap: 12px; align-items: center; justify-content: center; }
  .sleepwrap .srow button {
    border: 1px solid #2a323d; background: #10151c; color: #8b96a5;
    border-radius: 999px; padding: 13px 22px; font-size: 15px; min-width: 60px;
  }
  .sleepwrap .srow .pp { min-width: 96px; color: #b7c1d0; }
</style>

<script>
const DATA = [{"num": "1", "name": "Types of atom light interaction", "sections": [{"title": "Absorption", "items": [{"t": "The atom starts in the ground state a.", "a": {"steffan": "audio/steffan_580edbe31b721a13.mp3", "guy": "audio/guy_462d6651a52a85fc.mp3", "christopher": "audio/christopher_dce3c02b76fe12aa.mp3", "eric": "audio/eric_b5f137aa5e933ca9.mp3", "ava": "audio/ava_b68ab51ab14f8f67.mp3"}}, {"t": "It takes energy from the wave and jumps up to the excited state b.", "a": {"steffan": "audio/steffan_85e2d1ee0d20d411.mp3", "guy": "audio/guy_fcdf55ccbbc1ce46.mp3", "christopher": "audio/christopher_e2efc668a17cd874.mp3", "eric": "audio/eric_00effaa956f37241.mp3", "ava": "audio/ava_5163e8befb85ed1e.mp3"}}, {"t": "In the photon picture, the atom absorbs one photon of energy h bar omega.", "a": {"steffan": "audio/steffan_29206446c623fc9d.mp3", "guy": "audio/guy_dc96e7179c4de152.mp3", "christopher": "audio/christopher_72cb1bd042bae0f7.mp3", "eric": "audio/eric_5a9e5c3e7dd2fafd.mp3", "ava": "audio/ava_348a80586a1754da.mp3"}}, {"t": "The wave loses that energy, so its amplitude goes down.", "a": {"steffan": "audio/steffan_6992d816b58b9132.mp3", "guy": "audio/guy_399e05442fb6c3df.mp3", "christopher": "audio/christopher_70b2431428697df3.mp3", "eric": "audio/eric_828de9037450a7d0.mp3", "ava": "audio/ava_6c54c125240999af.mp3"}}, {"t": "This only works well when the process is quasi-resonant.", "a": {"steffan": "audio/steffan_6569ce4c00dac1b5.mp3", "guy": "audio/guy_8b2e1b905e2c407b.mp3", "christopher": "audio/christopher_245b4858dd5d8eeb.mp3", "eric": "audio/eric_90bc0c5c5df83b81.mp3", "ava": "audio/ava_fed7b20d9e668b42.mp3"}}, {"t": "Quasi-resonant means the photon energy is close to the energy gap between the two levels.", "a": {"steffan": "audio/steffan_b553118fb85365dd.mp3", "guy": "audio/guy_97f399796a3c131b.mp3", "christopher": "audio/christopher_4d01ef03613b575a.mp3", "eric": "audio/eric_1ed0a8218a267e8a.mp3", "ava": "audio/ava_ba8f011d879d6f7e.mp3"}}, {"t": "So h bar omega is approximately the energy of state b minus the energy of state a, and we write this gap as h bar omega zero.", "a": {"steffan": "audio/steffan_2292afe7f8981d14.mp3", "guy": "audio/guy_3f4cbcbd0a6de612.mp3", "christopher": "audio/christopher_cbd5319b33adaf27.mp3", "eric": "audio/eric_300e7567c7d1a1b2.mp3", "ava": "audio/ava_86c41b37b113848e.mp3"}}, {"t": "Omega zero is called the resonance frequency, or the transition frequency.", "a": {"steffan": "audio/steffan_b17c85d1e502d82e.mp3", "guy": "audio/guy_5d4798ce3e50548f.mp3", "christopher": "audio/christopher_16295e10d3850be6.mp3", "eric": "audio/eric_9981bc6553a4c5dc.mp3", "ava": "audio/ava_49c9c333d523be94.mp3"}}, {"t": "So the absorption is strongly peaked around omega zero, and it drops off on both sides.", "a": {"steffan": "audio/steffan_6fbc001b7fa08675.mp3", "guy": "audio/guy_63d24e28bb1c4d6d.mp3", "christopher": "audio/christopher_60b501cda771c831.mp3", "eric": "audio/eric_389e46c007e17e53.mp3", "ava": "audio/ava_cdd0e6c2bfb79e7c.mp3"}}]}, {"title": "Stimulated emission", "items": [{"t": "Now the atom starts in the excited state b, and the wave comes in.", "a": {"steffan": "audio/steffan_47105a4ebb354021.mp3", "guy": "audio/guy_c6390a147b58e86f.mp3", "christopher": "audio/christopher_00604af1d8eaba39.mp3", "eric": "audio/eric_62edd21347c10bca.mp3", "ava": "audio/ava_1d41b363da87b936.mp3"}}, {"t": "The wave drives the atom down to the ground state a, and the atom emits a photon.", "a": {"steffan": "audio/steffan_f1ccf188324de661.mp3", "guy": "audio/guy_a31fd31b8f868479.mp3", "christopher": "audio/christopher_3a78351f52031343.mp3", "eric": "audio/eric_d13b08910e57fdd3.mp3", "ava": "audio/ava_28786ecab91ad785.mp3"}}, {"t": "This is stimulated emission, and Einstein proposed it in 1916.", "a": {"steffan": "audio/steffan_9047b62c309ab7ad.mp3", "guy": "audio/guy_fc73460dfe66ea16.mp3", "christopher": "audio/christopher_3768944f50bc7c0e.mp3", "eric": "audio/eric_b003a1d2dc71737a.mp3", "ava": "audio/ava_753f44f47d6931e8.mp3"}}, {"t": "The new photon has the same frequency, the same direction, and the same phase as the incoming one.", "a": {"steffan": "audio/steffan_75652a6f25cc92b6.mp3", "guy": "audio/guy_ffd4461ed6a19a2b.mp3", "christopher": "audio/christopher_b629aad8ff78a3d4.mp3", "eric": "audio/eric_690d621ef4479872.mp3", "ava": "audio/ava_a1a8b1d0b2ec021f.mp3"}}, {"t": "So after the process, we have two identical photons instead of one.", "a": {"steffan": "audio/steffan_878963b2354dd5d9.mp3", "guy": "audio/guy_296364e1c8ea58dd.mp3", "christopher": "audio/christopher_85138a2d3a33d037.mp3", "eric": "audio/eric_abe0db4c492a9289.mp3", "ava": "audio/ava_6202a4e389508d73.mp3"}}, {"t": "Because the phases match, the two fields add up constructively, and the wave gets stronger.", "a": {"steffan": "audio/steffan_628a1f5d742987ad.mp3", "guy": "audio/guy_ceac435cb476ed08.mp3", "christopher": "audio/christopher_d83ec51ebef59fb0.mp3", "eric": "audio/eric_f73d28fb592a5d65.mp3", "ava": "audio/ava_2a882a8de7e1cf16.mp3"}}, {"t": "Stimulated emission is the reverse of absorption, and it is the basis of the laser.", "a": {"steffan": "audio/steffan_01516313c8d5b94a.mp3", "guy": "audio/guy_efaa7f7d3b1f9e6d.mp3", "christopher": "audio/christopher_7eb5732ebce91efc.mp3", "eric": "audio/eric_236f7f8d3a52f889.mp3", "ava": "audio/ava_1817d9a970e69d5b.mp3"}}, {"t": "Like absorption, it only happens efficiently near resonance.", "a": {"steffan": "audio/steffan_e0bd00ebf8a59dc2.mp3", "guy": "audio/guy_675944b079fdda32.mp3", "christopher": "audio/christopher_5444fba03d6b1c09.mp3", "eric": "audio/eric_b715341f2769c319.mp3", "ava": "audio/ava_dcfc4f1fe6cd71fa.mp3"}}]}, {"title": "Spontaneous emission", "items": [{"t": "Again the atom starts in the excited state b, but now there is no incoming light at all.", "a": {"steffan": "audio/steffan_b465f7abc2780e8a.mp3", "guy": "audio/guy_51b86c2233650d9c.mp3", "christopher": "audio/christopher_35dd0f9b5de96201.mp3", "eric": "audio/eric_f3d89dc3a2734071.mp3", "ava": "audio/ava_bb981b9613594e07.mp3"}}, {"t": "Still, after some time, the atom drops to the ground state by itself and emits a photon.", "a": {"steffan": "audio/steffan_f63bee6a99091e40.mp3", "guy": "audio/guy_9b7944b72edb15c4.mp3", "christopher": "audio/christopher_b612e48fda330e82.mp3", "eric": "audio/eric_2f23c2a83580fd60.mp3", "ava": "audio/ava_028084226c9adc9b.mp3"}}, {"t": "This is spontaneous emission.", "a": {"steffan": "audio/steffan_a907aa1aed20de39.mp3", "guy": "audio/guy_a2b2dda047d7b461.mp3", "christopher": "audio/christopher_60c948b601c63b86.mp3", "eric": "audio/eric_e1e8db5d9ba62f73.mp3", "ava": "audio/ava_afa1b8af70fcee17.mp3"}}, {"t": "The emitted photon has the resonance frequency, but its phase and its direction are random.", "a": {"steffan": "audio/steffan_8699eec83ad6022f.mp3", "guy": "audio/guy_006032a0434d0ca4.mp3", "christopher": "audio/christopher_b85eb8f8191cccc2.mp3", "eric": "audio/eric_573d4acf08700055.mp3", "ava": "audio/ava_be9b72a8b43b3d00.mp3"}}, {"t": "The moment of the decay is also random, so we can only give a probability.", "a": {"steffan": "audio/steffan_8f71cad66cdc7fdb.mp3", "guy": "audio/guy_cde9f15e9ab55358.mp3", "christopher": "audio/christopher_3e2ec1fdba7c8862.mp3", "eric": "audio/eric_1ef942e0f94f5663.mp3", "ava": "audio/ava_281054d133c38002.mp3"}}, {"t": "The probability that the atom is still in state b after a time t is e to the minus gamma S P times t, which is the same as e to the minus t over tau.", "a": {"steffan": "audio/steffan_e567e965f6619797.mp3", "guy": "audio/guy_8d49657dbfbd80ea.mp3", "christopher": "audio/christopher_959d1c2258fb571e.mp3", "eric": "audio/eric_3f362f37d2b9263f.mp3", "ava": "audio/ava_b8a6b6000ad0aa1d.mp3"}}, {"t": "Here tau is the lifetime of the excited state.", "a": {"steffan": "audio/steffan_7c4a013155b26944.mp3", "guy": "audio/guy_cd0a3f1be45c67cb.mp3", "christopher": "audio/christopher_9475d13b28f39987.mp3", "eric": "audio/eric_6bcd276c6ac7807a.mp3", "ava": "audio/ava_f5eff07517a81459.mp3"}}, {"t": "Gamma S P is the decay rate, and it is equal to one over tau.", "a": {"steffan": "audio/steffan_7cc767760e2f1ef1.mp3", "guy": "audio/guy_1176555c6facca72.mp3", "christopher": "audio/christopher_da07d377fbed3310.mp3", "eric": "audio/eric_0f87f2be5b943e05.mp3", "ava": "audio/ava_186649518f9d1d50.mp3"}}, {"t": "One important point: the semi-classical model cannot explain spontaneous emission.", "a": {"steffan": "audio/steffan_3c738bec32d326ab.mp3", "guy": "audio/guy_518018f94627e538.mp3", "christopher": "audio/christopher_783f78799dc09cf2.mp3", "eric": "audio/eric_d08edef94b58b3c8.mp3", "ava": "audio/ava_6a6432e9df4b0866.mp3"}}, {"t": "In that model, the excited state is an eigenstate of the atom's Hamiltonian, so the atom would stay there forever.", "a": {"steffan": "audio/steffan_2053a40c25af7a95.mp3", "guy": "audio/guy_452cbb370f82d0a6.mp3", "christopher": "audio/christopher_b8c0156d000bd0e8.mp3", "eric": "audio/eric_acdcc6d70ee8894b.mp3", "ava": "audio/ava_dfc36f8575b918d9.mp3"}}, {"t": "Spontaneous emission only comes out of the theory once the light field is quantized too.", "a": {"steffan": "audio/steffan_c70951817bc7dcb5.mp3", "guy": "audio/guy_2968c0a8e9cabefb.mp3", "christopher": "audio/christopher_302db81c76a57094.mp3", "eric": "audio/eric_6c07291b9a3db4db.mp3", "ava": "audio/ava_6ae35f7e4570a0cb.mp3"}}, {"t": "So for now, we simply add the lifetime by hand.", "a": {"steffan": "audio/steffan_13869a31cb1996fe.mp3", "guy": "audio/guy_37e8b3de8bb8abd1.mp3", "christopher": "audio/christopher_d948db780320c9ec.mp3", "eric": "audio/eric_df365782df2feff2.mp3", "ava": "audio/ava_0d68d659e07edd37.mp3"}}, {"t": "Now, what does the emitted light look like in frequency?", "a": {"steffan": "audio/steffan_4a2d05259b077997.mp3", "guy": "audio/guy_1a1febf0692d8851.mp3", "christopher": "audio/christopher_23bd9f5e5b84ae35.mp3", "eric": "audio/eric_f1fd3ec9d2f82ad4.mp3", "ava": "audio/ava_5a52dd120e0fa32e.mp3"}}, {"t": "The emitted field decays exponentially in time.", "a": {"steffan": "audio/steffan_3cbf6f158f5b0fe8.mp3", "guy": "audio/guy_5f40f0b1aa44a547.mp3", "christopher": "audio/christopher_de5b7afa5e470904.mp3", "eric": "audio/eric_809e14c9fff74ba0.mp3", "ava": "audio/ava_8ecbc44d3f043a4a.mp3"}}, {"t": "The spectrum is the squared magnitude of the Fourier transform of this field, and for an exponential decay, that is a Lorentzian.", "a": {"steffan": "audio/steffan_d0a2968c37de592f.mp3", "guy": "audio/guy_74551c5b54204b78.mp3", "christopher": "audio/christopher_3a0b20f8af2f8387.mp3", "eric": "audio/eric_9d40306f62b72122.mp3", "ava": "audio/ava_8bd480f577afd62c.mp3"}}, {"t": "So the emission line is a Lorentzian, centered at omega zero.", "a": {"steffan": "audio/steffan_7976afb585620b1f.mp3", "guy": "audio/guy_540d92d05e0e6c50.mp3", "christopher": "audio/christopher_fd12e8597620974c.mp3", "eric": "audio/eric_1e4e63bf77c89e2b.mp3", "ava": "audio/ava_0744f6397a7881b9.mp3"}}, {"t": "Its full width at half maximum, meaning the width measured at half of the peak height, is the natural linewidth.", "a": {"steffan": "audio/steffan_178f79c3a935834c.mp3", "guy": "audio/guy_41ff1bc8b691a53d.mp3", "christopher": "audio/christopher_6eb21ea93eb61bf4.mp3", "eric": "audio/eric_a0f992e90598eb38.mp3", "ava": "audio/ava_c2bb8df4b4182a0a.mp3"}}, {"t": "The natural linewidth, delta omega, is equal to gamma S P, which is one over tau.", "a": {"steffan": "audio/steffan_cd2efbe459f8587f.mp3", "guy": "audio/guy_52ad5cd24668f3e3.mp3", "christopher": "audio/christopher_73657b2cdc4ad4e5.mp3", "eric": "audio/eric_92f657427753eef5.mp3", "ava": "audio/ava_6d65a59542a34869.mp3"}}, {"t": "Why exactly one over tau? The spectrum is set by how fast the field amplitude dies away.", "a": {"steffan": "audio/steffan_c8fc167a587f83ee.mp3", "guy": "audio/guy_1c86f9d0eec3816d.mp3", "christopher": "audio/christopher_48beb7d4889ff9eb.mp3", "eric": "audio/eric_6898d68ef20884eb.mp3", "ava": "audio/ava_d936914a0a673994.mp3"}}, {"t": "The probability is the square of the amplitude, so the amplitude decays twice as slowly, as e to the minus t over two tau.", "a": {"steffan": "audio/steffan_7d069abec2290a3a.mp3", "guy": "audio/guy_a6af5f95ddc1ff50.mp3", "christopher": "audio/christopher_fcd0edd0e5ac612a.mp3", "eric": "audio/eric_63c770a736d5b713.mp3", "ava": "audio/ava_97c6fc20fc0fd241.mp3"}}, {"t": "And an amplitude that decays like this gives a Lorentzian with a width of exactly one over tau.", "a": {"steffan": "audio/steffan_911e024bdb581fb8.mp3", "guy": "audio/guy_1e9703d02f608ee6.mp3", "christopher": "audio/christopher_a19cb4ad95d07459.mp3", "eric": "audio/eric_98f821db0544b16a.mp3", "ava": "audio/ava_3fc085c1b67fa2a0.mp3"}}, {"t": "The message is: a short lifetime gives a broad line, and a long lifetime gives a narrow line.", "a": {"steffan": "audio/steffan_c90f5e325c36a4c1.mp3", "guy": "audio/guy_62337cdf07cfdad9.mp3", "christopher": "audio/christopher_87677bc19fe44165.mp3", "eric": "audio/eric_55aba9f80929ff38.mp3", "ava": "audio/ava_f97201307ef2c328.mp3"}}, {"t": "This is consistent with the energy-time uncertainty relation, which says delta E times delta t is at least h bar over two.", "a": {"steffan": "audio/steffan_b9277bcd4cce65d6.mp3", "guy": "audio/guy_578c311e5d30257d.mp3", "christopher": "audio/christopher_693b66c8f712221d.mp3", "eric": "audio/eric_2dda51319527d492.mp3", "ava": "audio/ava_c7cc97007147a2de.mp3"}}]}, {"title": "Elastic scattering", "items": [{"t": "The atom starts in the ground state, and light of frequency omega comes in.", "a": {"steffan": "audio/steffan_a56919d5d7c0440d.mp3", "guy": "audio/guy_52d4f37575812fcf.mp3", "christopher": "audio/christopher_10c157958a73b48f.mp3", "eric": "audio/eric_c32a16bad4571065.mp3", "ava": "audio/ava_9e4d82d552662f91.mp3"}}, {"t": "This frequency does not have to be close to the resonance.", "a": {"steffan": "audio/steffan_134eaf6e48572d57.mp3", "guy": "audio/guy_99a97e4be7765138.mp3", "christopher": "audio/christopher_a00f39f28c9e7f3e.mp3", "eric": "audio/eric_43f36439fc9a0042.mp3", "ava": "audio/ava_f610c6b4f296e8c9.mp3"}}, {"t": "Part of the light is scattered: the atom sends light out in other directions, and the transmitted wave gets weaker.", "a": {"steffan": "audio/steffan_6b91638de70c2801.mp3", "guy": "audio/guy_69daae65f3928cc6.mp3", "christopher": "audio/christopher_b9d31334bce46887.mp3", "eric": "audio/eric_c72b63b893ac8866.mp3", "ava": "audio/ava_174585225e31fa1b.mp3"}}, {"t": "The scattered light has exactly the same frequency as the incoming light, and a fixed phase relation to it.", "a": {"steffan": "audio/steffan_f5d666c4ef77c1eb.mp3", "guy": "audio/guy_5de3b62f542c73d4.mp3", "christopher": "audio/christopher_b90498a15c6a8aca.mp3", "eric": "audio/eric_28472fc614d82951.mp3", "ava": "audio/ava_6064714d70022170.mp3"}}, {"t": "The atom also ends up back in the ground state a, so no energy stays in the atom. That is why the process is called elastic.", "a": {"steffan": "audio/steffan_3f8a6bd8a79c8650.mp3", "guy": "audio/guy_0a1f7fd2b080ab37.mp3", "christopher": "audio/christopher_7b5d2a2d8fbdb048.mp3", "eric": "audio/eric_2bdcc8801af0057f.mp3", "ava": "audio/ava_79673c8fefa0d8ae.mp3"}}, {"t": "In the photon picture, the atom goes up to a virtual level and comes straight back down to a.", "a": {"steffan": "audio/steffan_619e98166cf7c663.mp3", "guy": "audio/guy_6c9d6f061d7c834e.mp3", "christopher": "audio/christopher_7595b7c2f14d8bdf.mp3", "eric": "audio/eric_4c73e00d68db5ef4.mp3", "ava": "audio/ava_eb32e38f0cc501d3.mp3"}}, {"t": "A virtual level is not a real state of the atom.", "a": {"steffan": "audio/steffan_ca6474b271cfb20e.mp3", "guy": "audio/guy_17833ecc018b23f5.mp3", "christopher": "audio/christopher_9791f8baaaac8223.mp3", "eric": "audio/eric_58cd0566f48dd92e.mp3", "ava": "audio/ava_058a3fdd3c8a1156.mp3"}}, {"t": "The atom stays there only for a very short time, of the order of one over the difference between omega and omega zero.", "a": {"steffan": "audio/steffan_2f88558b08a3087f.mp3", "guy": "audio/guy_f9b89e6fedfea1db.mp3", "christopher": "audio/christopher_61918a10c5b11ccb.mp3", "eric": "audio/eric_b31e7dbed804ad30.mp3", "ava": "audio/ava_c2d4948d36134e1e.mp3"}}, {"t": "There is also a classical way to see it.", "a": {"steffan": "audio/steffan_22c5cc0ac0134646.mp3", "guy": "audio/guy_8c00867052960918.mp3", "christopher": "audio/christopher_18d53ccdd3702da1.mp3", "eric": "audio/eric_e441689dd71afd72.mp3", "ava": "audio/ava_1bb126e30f71a7bd.mp3"}}, {"t": "The incoming field drives the electric dipole moment of the atom, so the dipole oscillates at omega, and an oscillating dipole radiates at omega.", "a": {"steffan": "audio/steffan_4c85980e9e313ae4.mp3", "guy": "audio/guy_fca8f82717a06eee.mp3", "christopher": "audio/christopher_bc160d2023705067.mp3", "eric": "audio/eric_fb72180ebbd6bc25.mp3", "ava": "audio/ava_2f21afbf61de5bcc.mp3"}}, {"t": "Elastic scattering is not an absorption followed by a spontaneous emission.", "a": {"steffan": "audio/steffan_9844d151105d27d2.mp3", "guy": "audio/guy_3a9aea182d38e662.mp3", "christopher": "audio/christopher_fd2d65f318b22b9f.mp3", "eric": "audio/eric_4cc432100c98f0c2.mp3", "ava": "audio/ava_1485df5f4fdb1b03.mp3"}}, {"t": "That would give light with a random phase and a broad line, but the scattered light has one sharp frequency and keeps the phase of the incoming light.", "a": {"steffan": "audio/steffan_e2f4b81394119154.mp3", "guy": "audio/guy_790235b492fb2550.mp3", "christopher": "audio/christopher_58ccb040f7c8fddd.mp3", "eric": "audio/eric_4bc54d696dff9c94.mp3", "ava": "audio/ava_f57c4abaf5ca5086.mp3"}}, {"t": "How strong the scattering is depends a lot on the frequency.", "a": {"steffan": "audio/steffan_dbd5b2ffc0590dca.mp3", "guy": "audio/guy_8131464b67dc9445.mp3", "christopher": "audio/christopher_4cf43703e7866a4c.mp3", "eric": "audio/eric_f0b61f905e437ea8.mp3", "ava": "audio/ava_8b9cc7543214e355.mp3"}}, {"t": "If omega is much smaller than omega zero, the scattered power grows as omega to the fourth. This is Rayleigh scattering.", "a": {"steffan": "audio/steffan_44888e23c8634a96.mp3", "guy": "audio/guy_3a79e379890f66d1.mp3", "christopher": "audio/christopher_6d029a775f3db4f0.mp3", "eric": "audio/eric_0c51f92c2f1261ed.mp3", "ava": "audio/ava_2411baa617af89d1.mp3"}}, {"t": "This is why the sky is blue: the molecules in air have their resonances in the ultraviolet, so blue light is scattered more than red light.", "a": {"steffan": "audio/steffan_ebd72d5df7266a70.mp3", "guy": "audio/guy_b69c65884fea1a91.mp3", "christopher": "audio/christopher_fad7fb4037379ebc.mp3", "eric": "audio/eric_8bfdcce7d37ff054.mp3", "ava": "audio/ava_d9f8017f93643fef.mp3"}}, {"t": "If omega is much larger than omega zero, as for X-rays, the scattering does not depend on frequency. This is Thomson scattering.", "a": {"steffan": "audio/steffan_d39d4aa5c2241095.mp3", "guy": "audio/guy_169a6ec782649180.mp3", "christopher": "audio/christopher_19b2bdcf8a14dee2.mp3", "eric": "audio/eric_5ffb82048b1e5c71.mp3", "ava": "audio/ava_11661aeb5bb060c1.mp3"}}, {"t": "And if omega is close to omega zero, the scattering is resonantly enhanced. This is called resonance fluorescence.", "a": {"steffan": "audio/steffan_6cf9cc2af1011126.mp3", "guy": "audio/guy_c14957ceae9136a0.mp3", "christopher": "audio/christopher_ef230953ea722879.mp3", "eric": "audio/eric_3b128bac482465e0.mp3", "ava": "audio/ava_3487c5af95f27541.mp3"}}]}, {"title": "Nonlinear processes: multi-photon transitions", "items": [{"t": "So far, the atom always exchanged one photon with the light.", "a": {"steffan": "audio/steffan_98527824b16548dd.mp3", "guy": "audio/guy_f6b40496d2a8d82f.mp3", "christopher": "audio/christopher_edafd45531c1e5fe.mp3", "eric": "audio/eric_4e73a7221f33f69f.mp3", "ava": "audio/ava_b0281f6ea68d43bd.mp3"}}, {"t": "At higher orders of the interaction, the atom can exchange several photons in one step.", "a": {"steffan": "audio/steffan_8ed19594cc17c4c7.mp3", "guy": "audio/guy_d25bd45e19bc80ad.mp3", "christopher": "audio/christopher_73047fb7c7b933a6.mp3", "eric": "audio/eric_31b3b58679e06d24.mp3", "ava": "audio/ava_6793db65401e240a.mp3"}}, {"t": "In two-photon absorption, the atom absorbs two photons of energy h bar omega together, passing through a virtual level.", "a": {"steffan": "audio/steffan_4eb2e9c70be469ad.mp3", "guy": "audio/guy_0ecfcc6bbcdfb54a.mp3", "christopher": "audio/christopher_c95f1335caf0603e.mp3", "eric": "audio/eric_bc3624cfdf4ca5fa.mp3", "ava": "audio/ava_8ecd08a4cc17730e.mp3"}}, {"t": "Together they bring two h bar omega, so the process is resonant when two omega equals omega zero.", "a": {"steffan": "audio/steffan_03c1cfda8edee3e6.mp3", "guy": "audio/guy_85d91411f4a58d28.mp3", "christopher": "audio/christopher_796b1b9cd43baa16.mp3", "eric": "audio/eric_db8e963e1dbdf489.mp3", "ava": "audio/ava_d9462ab54611a459.mp3"}}, {"t": "This is also called up-conversion, because two low-energy photons together make one high-energy excitation.", "a": {"steffan": "audio/steffan_e27b59f9e9fa162b.mp3", "guy": "audio/guy_8358be335b7fa72d.mp3", "christopher": "audio/christopher_4dffdf6d2b031bd7.mp3", "eric": "audio/eric_ca1e15cc9f57f6f3.mp3", "ava": "audio/ava_942af85cb5b33ce0.mp3"}}, {"t": "In general, p photons can be absorbed together, and the resonance is at omega equals omega zero over p.", "a": {"steffan": "audio/steffan_489c1283182fc9ff.mp3", "guy": "audio/guy_752b80dc6ef03c3a.mp3", "christopher": "audio/christopher_c141be5b22632f1c.mp3", "eric": "audio/eric_00903f35a7c4dc7c.mp3", "ava": "audio/ava_d9a5edaafa85d397.mp3"}}, {"t": "The reverse also exists, two-photon emission, or down-conversion.", "a": {"steffan": "audio/steffan_5361c789121af056.mp3", "guy": "audio/guy_811709d8c5a8221a.mp3", "christopher": "audio/christopher_b8b0c3f0fec1391e.mp3", "eric": "audio/eric_462779e912bfac71.mp3", "ava": "audio/ava_85ef26dc23309f57.mp3"}}, {"t": "Here one high-energy excitation turns into two lower-energy photons, again through a virtual level.", "a": {"steffan": "audio/steffan_45aa63422bd5df60.mp3", "guy": "audio/guy_6db59e9c61db00f0.mp3", "christopher": "audio/christopher_524d01b2d57063a7.mp3", "eric": "audio/eric_e3962c043eee7a48.mp3", "ava": "audio/ava_59ee37365e645dd0.mp3"}}, {"t": "The energies of the two new photons add up to the energy of the original excitation.", "a": {"steffan": "audio/steffan_3e7a710b1df7a47a.mp3", "guy": "audio/guy_b49fd1b16ec9a691.mp3", "christopher": "audio/christopher_ec7337822d116255.mp3", "eric": "audio/eric_e2661494a1b03ebe.mp3", "ava": "audio/ava_20848458acc400e2.mp3"}}, {"t": "The two photons are created together, and they are entangled.", "a": {"steffan": "audio/steffan_627d57fa29922908.mp3", "guy": "audio/guy_786614652346cd9b.mp3", "christopher": "audio/christopher_9dc9eda46800f53c.mp3", "eric": "audio/eric_2fcda530acb5e41c.mp3", "ava": "audio/ava_5d9eafb3233289ce.mp3"}}, {"t": "Entangled means their joint state cannot be written as a product of one state for each photon.", "a": {"steffan": "audio/steffan_d89b2d0153a8b2d4.mp3", "guy": "audio/guy_ff755e0a1b14d5ac.mp3", "christopher": "audio/christopher_4d8ba64d60d29e18.mp3", "eric": "audio/eric_3e2a40a84952c96c.mp3", "ava": "audio/ava_38cb280b0636d934.mp3"}}, {"t": "In the lab, entangled photon pairs are made by spontaneous parametric down-conversion in a nonlinear crystal, such as BBO.", "a": {"steffan": "audio/steffan_ef43a2bc89ab15dc.mp3", "guy": "audio/guy_ecd79a3906eb7c4a.mp3", "christopher": "audio/christopher_70ee8bb1fbababfe.mp3", "eric": "audio/eric_be9f42bdeb059efc.mp3", "ava": "audio/ava_16fb27fec5f3876d.mp3"}}, {"t": "There, one pump photon splits into two photons, called signal and idler.", "a": {"steffan": "audio/steffan_0e44d2ffdadb77fe.mp3", "guy": "audio/guy_b22e2433d5ec5b22.mp3", "christopher": "audio/christopher_73eb0e7ce446dd8e.mp3", "eric": "audio/eric_af493d58398237e6.mp3", "ava": "audio/ava_2c10506f35240ec2.mp3"}}, {"t": "Energy is conserved, so the signal and idler energies add up to the pump energy.", "a": {"steffan": "audio/steffan_e4c9c69eb3e07691.mp3", "guy": "audio/guy_0ce3a70c11bf64bf.mp3", "christopher": "audio/christopher_3b7ca0fa03bdc420.mp3", "eric": "audio/eric_4780eaf31437f86e.mp3", "ava": "audio/ava_e74efa83878c84b2.mp3"}}, {"t": "Momentum is conserved too, and this condition is called phase matching.", "a": {"steffan": "audio/steffan_9fa899104dee41eb.mp3", "guy": "audio/guy_0c7484965537d2e8.mp3", "christopher": "audio/christopher_6c78cdbb71fe6470.mp3", "eric": "audio/eric_58e3bd082bc747fb.mp3", "ava": "audio/ava_166291e2ae360d75.mp3"}}, {"t": "We come back to this later, once the light field is quantized.", "a": {"steffan": "audio/steffan_07bde427e1e7b2d2.mp3", "guy": "audio/guy_32d65e77ce0a67a6.mp3", "christopher": "audio/christopher_b0f070af4436535b.mp3", "eric": "audio/eric_eb6f07e587d13258.mp3", "ava": "audio/ava_b33670f4acff7e14.mp3"}}]}, {"title": "Raman scattering", "items": [{"t": "In Raman scattering, a photon of energy h bar omega comes in, and the atom starts in the ground state a.", "a": {"steffan": "audio/steffan_3868f2d1729f2cbd.mp3", "guy": "audio/guy_c190840bdb293143.mp3", "christopher": "audio/christopher_6edbc35de59f9513.mp3", "eric": "audio/eric_362d4702c5093761.mp3", "ava": "audio/ava_3a4eeadc0e27316a.mp3"}}, {"t": "The atom goes up to a virtual level, called c.", "a": {"steffan": "audio/steffan_f666533bb71b5d3c.mp3", "guy": "audio/guy_0166e7afe09a3843.mp3", "christopher": "audio/christopher_711302f5c5c5af09.mp3", "eric": "audio/eric_5f59afd2bd1ea3c3.mp3", "ava": "audio/ava_211d93083d295e72.mp3"}}, {"t": "But it does not come back down to a. It lands in state b, a real level above a.", "a": {"steffan": "audio/steffan_0337e1eb080bf68f.mp3", "guy": "audio/guy_43771a938defa937.mp3", "christopher": "audio/christopher_c8c0cb05df04997e.mp3", "eric": "audio/eric_9d7fca4e04c5df47.mp3", "ava": "audio/ava_f638685025537471.mp3"}}, {"t": "So the scattered photon, h bar omega one, has less energy than the incoming photon.", "a": {"steffan": "audio/steffan_dc8cf1352e7a119a.mp3", "guy": "audio/guy_8f0792b7fd9b8245.mp3", "christopher": "audio/christopher_933a9649268e06d1.mp3", "eric": "audio/eric_3b57104b08aa713e.mp3", "ava": "audio/ava_08a31e228b9784bd.mp3"}}, {"t": "The missing energy, h bar omega two, is exactly the gap between a and b.", "a": {"steffan": "audio/steffan_bfaebca2cc229073.mp3", "guy": "audio/guy_59c39d751e9e2203.mp3", "christopher": "audio/christopher_a45cf5eee5cc381c.mp3", "eric": "audio/eric_b6cecfbb68d39439.mp3", "ava": "audio/ava_c9541fad599c149c.mp3"}}, {"t": "So, h bar omega equals h bar omega one plus h bar omega two.", "a": {"steffan": "audio/steffan_2854d9f047a3d786.mp3", "guy": "audio/guy_f6e7bfd1ba784bdc.mp3", "christopher": "audio/christopher_2819ea7d47410f0d.mp3", "eric": "audio/eric_7d5e3b2199e06041.mp3", "ava": "audio/ava_c81124dbafb29de5.mp3"}}, {"t": "This leftover energy typically lies in the infrared.", "a": {"steffan": "audio/steffan_1ca7b437b04c17c9.mp3", "guy": "audio/guy_6656c75b84f0aec7.mp3", "christopher": "audio/christopher_25346b6857df917c.mp3", "eric": "audio/eric_0e12f9e9083019ed.mp3", "ava": "audio/ava_8bca9d1e18831649.mp3"}}, {"t": "Raman scattering can also be stimulated.", "a": {"steffan": "audio/steffan_345697f45bdf9f0e.mp3", "guy": "audio/guy_319be1ea9ebd9b71.mp3", "christopher": "audio/christopher_a9de6657d4713abc.mp3", "eric": "audio/eric_611618ae9ca13fc0.mp3", "ava": "audio/ava_0d3785a3137286dd.mp3"}}, {"t": "If a second wave is already present at the scattered frequency, the emission down to b is stimulated. This is stimulated Raman scattering.", "a": {"steffan": "audio/steffan_d2b6125024a4739d.mp3", "guy": "audio/guy_ec08773af31ba2c2.mp3", "christopher": "audio/christopher_6f34407a395f2fb6.mp3", "eric": "audio/eric_7db2c397ef3507cd.mp3", "ava": "audio/ava_d5fccd429a216b04.mp3"}}, {"t": "If there is no such wave, the emission is spontaneous. This is spontaneous Raman scattering.", "a": {"steffan": "audio/steffan_cae9f818d8fbaeae.mp3", "guy": "audio/guy_05877fcadb5d3646.mp3", "christopher": "audio/christopher_dac413d9c1194a2d.mp3", "eric": "audio/eric_9613d3d67e92ef7e.mp3", "ava": "audio/ava_f3770f8330d3c3a4.mp3"}}, {"t": "Just like spontaneous emission, spontaneous Raman scattering needs the quantum theory of light for a full description.", "a": {"steffan": "audio/steffan_f88c685e407f725a.mp3", "guy": "audio/guy_9ec6c3c74f35302c.mp3", "christopher": "audio/christopher_eef170c3ad78dae6.mp3", "eric": "audio/eric_73346f527b921a1b.mp3", "ava": "audio/ava_05f52f3f9b5b813e.mp3"}}]}]}, {"num": "2", "name": "Interaction hamiltonian", "sections": [{"title": "Short quantum mechanics review", "items": [{"t": "Let's start with a short review of quantum mechanics.", "a": {"steffan": "audio/steffan_8f8a08f42041e6e2.mp3", "guy": "audio/guy_cce4115c717feb34.mp3", "christopher": "audio/christopher_3ae8b90860902f29.mp3", "eric": "audio/eric_33672f5e091e949e.mp3", "ava": "audio/ava_6e98cfc308dbeaab.mp3"}}, {"t": "An atom has quantum states, which we label n, and each state has an energy, E n.", "a": {"steffan": "audio/steffan_50fcf55927d8dfbc.mp3", "guy": "audio/guy_47e3ed6259af77df.mp3", "christopher": "audio/christopher_bc6a7e5f45279f75.mp3", "eric": "audio/eric_af37d38b9e4492c5.mp3", "ava": "audio/ava_9a8a421080581a57.mp3"}}, {"t": "These energies are discrete, so the atom can only have certain fixed energy values. We call them levels.", "a": {"steffan": "audio/steffan_8550720793cbab9f.mp3", "guy": "audio/guy_b0462cd428418cc6.mp3", "christopher": "audio/christopher_6408d72d3fc0c21a.mp3", "eric": "audio/eric_2fa66675c9b7a3cc.mp3", "ava": "audio/ava_13f134cdb2e96319.mp3"}}, {"t": "In general, the atom is not in just one of these states. It is in a superposition of them.", "a": {"steffan": "audio/steffan_8217e6b46c653a74.mp3", "guy": "audio/guy_1386694674e61239.mp3", "christopher": "audio/christopher_adaab1b206588363.mp3", "eric": "audio/eric_40cef3e2159e2a50.mp3", "ava": "audio/ava_5e1b59ebf7fec130.mp3"}}, {"t": "So we write its state as a sum over all the states, each one multiplied by a coefficient, c n.", "a": {"steffan": "audio/steffan_8247cd0ce0daea38.mp3", "guy": "audio/guy_c458cded9d06ddc6.mp3", "christopher": "audio/christopher_474ad8b96917bb8e.mp3", "eric": "audio/eric_6eeeac9fa2174a23.mp3", "ava": "audio/ava_99f25cc90a42a83f.mp3"}}, {"t": "The coefficient tells us how much of each state is in the mix.", "a": {"steffan": "audio/steffan_8b51218647c80138.mp3", "guy": "audio/guy_0f78f97e583c1d6e.mp3", "christopher": "audio/christopher_9bf8aef740a7e10e.mp3", "eric": "audio/eric_5294351c0e360d79.mp3", "ava": "audio/ava_13e5afe1aa97ee61.mp3"}}, {"t": "The probability to find the atom in state k is the squared magnitude of c k.", "a": {"steffan": "audio/steffan_810d705eebd92f93.mp3", "guy": "audio/guy_47e4c8f2ee73e8d2.mp3", "christopher": "audio/christopher_16e19cf6313cb890.mp3", "eric": "audio/eric_0f08fcc755ee813b.mp3", "ava": "audio/ava_3de5ec5f8f3125a4.mp3"}}, {"t": "The atom must be found in some state, so all these probabilities add up to one.", "a": {"steffan": "audio/steffan_2b9f9781fd395d69.mp3", "guy": "audio/guy_0c563faf8684cc86.mp3", "christopher": "audio/christopher_e068640084866096.mp3", "eric": "audio/eric_431a285f3beff2bc.mp3", "ava": "audio/ava_7b2f95daf0f25a3e.mp3"}}, {"t": "How does the state change in time? That is given by the Schrödinger equation.", "a": {"steffan": "audio/steffan_1197eabf8e3b95b6.mp3", "guy": "audio/guy_05c0de59dc61310d.mp3", "christopher": "audio/christopher_a845634b21caefbf.mp3", "eric": "audio/eric_0fc4948afb379dac.mp3", "ava": "audio/ava_82f3ef6cebfb9c77.mp3"}}, {"t": "It says that i h bar times the time derivative of the state equals the Hamiltonian acting on the state.", "a": {"steffan": "audio/steffan_654ee52af1283094.mp3", "guy": "audio/guy_bf8ecdfd90e560ef.mp3", "christopher": "audio/christopher_df7dfdfc02d0d1a1.mp3", "eric": "audio/eric_5f6c8ee526f1a8cb.mp3", "ava": "audio/ava_3357532f88fe4fec.mp3"}}, {"t": "The Hamiltonian is the operator of the total energy. So the energy of the system is what drives its evolution in time.", "a": {"steffan": "audio/steffan_91abdbf4e98cd8b0.mp3", "guy": "audio/guy_3de9151b4ee86349.mp3", "christopher": "audio/christopher_0dd34d4c3f5d7470.mp3", "eric": "audio/eric_bc07d68f16596527.mp3", "ava": "audio/ava_694c60b49789ea5b.mp3"}}, {"t": "Now take a Hamiltonian that does not depend on time, and call it H zero.", "a": {"steffan": "audio/steffan_eef128e4bbaddd81.mp3", "guy": "audio/guy_17b56fe28ab9ffb5.mp3", "christopher": "audio/christopher_6b03b60e13926465.mp3", "eric": "audio/eric_e9cfac1d6401b14d.mp3", "ava": "audio/ava_7ce8f86021190f83.mp3"}}, {"t": "Its eigenstates are the special states that H zero only multiplies by a number, and that number is the energy of the state.", "a": {"steffan": "audio/steffan_cfef2e5cf4be9981.mp3", "guy": "audio/guy_27758f5143139dd9.mp3", "christopher": "audio/christopher_a239b72ed4e2f19b.mp3", "eric": "audio/eric_568f8aad505b568c.mp3", "ava": "audio/ava_b9232358449ab4e5.mp3"}}, {"t": "If the atom sits in such an eigenstate, the only thing that changes in time is a phase factor, e to the minus i E n t over h bar.", "a": {"steffan": "audio/steffan_99766ebd64861952.mp3", "guy": "audio/guy_4c6e985c7be59e8b.mp3", "christopher": "audio/christopher_dee6bd5e1b473a24.mp3", "eric": "audio/eric_e45179c4422659fd.mp3", "ava": "audio/ava_1f2514bf8c7555be.mp3"}}, {"t": "This factor has magnitude one, so all the probabilities stay exactly the same.", "a": {"steffan": "audio/steffan_f36cc23a27063f62.mp3", "guy": "audio/guy_1276c3385b35c0fc.mp3", "christopher": "audio/christopher_0a7a261049745420.mp3", "eric": "audio/eric_0103fa8c735f36a5.mp3", "ava": "audio/ava_e9c8e32744067fcc.mp3"}}, {"t": "That is why such a state is called a stationary state. Left alone, the atom stays in it forever.", "a": {"steffan": "audio/steffan_423ac6ea2208cea7.mp3", "guy": "audio/guy_1f14f6b056fd14d6.mp3", "christopher": "audio/christopher_8551259044d64cde.mp3", "eric": "audio/eric_3cf186e166fa9999.mp3", "ava": "audio/ava_6dc1d4ce36d4b2a9.mp3"}}, {"t": "And this is the key point for the whole chapter: to make the atom jump from one level to another, we need something extra in the Hamiltonian. That something is the interaction with the light.", "a": {"steffan": "audio/steffan_e5ac1ed6228a1775.mp3", "guy": "audio/guy_4878dc55f235e453.mp3", "christopher": "audio/christopher_e5b226b223f99a9c.mp3", "eric": "audio/eric_a4a95648397f14a0.mp3", "ava": "audio/ava_a6d71f6f9193b297.mp3"}}]}, {"title": "The atomic Hamiltonian and the dipole operator", "items": [{"t": "We take the simplest atom: one electron bound to a nucleus, like hydrogen.", "a": {"steffan": "audio/steffan_39fa809daf5ec3ea.mp3", "guy": "audio/guy_3a2509c811c21b82.mp3", "christopher": "audio/christopher_7277e21e4e51cc37.mp3", "eric": "audio/eric_2aadd3633850113f.mp3", "ava": "audio/ava_a2fcb66934f58208.mp3"}}, {"t": "Its Hamiltonian, H zero, is the kinetic energy of the electron, p squared over two m, plus the Coulomb potential energy that binds the electron to the nucleus.", "a": {"steffan": "audio/steffan_159fe8e3c201d334.mp3", "guy": "audio/guy_a8fc8a1eb0c9d87c.mp3", "christopher": "audio/christopher_64b5128dbefdaccc.mp3", "eric": "audio/eric_5d28f65836c83345.mp3", "ava": "audio/ava_657d6cebdcf07a49.mp3"}}, {"t": "H zero does not depend on time, so its eigenstates are the stationary atomic levels.", "a": {"steffan": "audio/steffan_83a87d913773f2fb.mp3", "guy": "audio/guy_3d2cfe113f9b89f9.mp3", "christopher": "audio/christopher_0ed3fee846a26d1a.mp3", "eric": "audio/eric_d81cadff13e864d7.mp3", "ava": "audio/ava_4f1cf5819ea5ca8e.mp3"}}, {"t": "Now, how can light act on this atom?", "a": {"steffan": "audio/steffan_6d2e98ccf7322100.mp3", "guy": "audio/guy_02a0aaa92a1e2a7b.mp3", "christopher": "audio/christopher_affd66a2cdb32da1.mp3", "eric": "audio/eric_bf6822903d988e5e.mp3", "ava": "audio/ava_ec71528ef10fc043.mp3"}}, {"t": "The light has an electric field, and an electric field pushes on charges.", "a": {"steffan": "audio/steffan_44c8bf8829f75ecf.mp3", "guy": "audio/guy_5467089b7f0c637a.mp3", "christopher": "audio/christopher_d8e42cb8ef194a68.mp3", "eric": "audio/eric_3e17d605dedd4d89.mp3", "ava": "audio/ava_796fa39a858fa8df.mp3"}}, {"t": "The atom is made of a positive nucleus and a negative electron, so the field pushes them in opposite directions.", "a": {"steffan": "audio/steffan_f011d3dff576a476.mp3", "guy": "audio/guy_53b7693fb4bfbaeb.mp3", "christopher": "audio/christopher_463efe939ea50f0b.mp3", "eric": "audio/eric_0636cd55234f90fb.mp3", "ava": "audio/ava_23a5b7f807037cd1.mp3"}}, {"t": "The quantity that measures this charge separation is the electric dipole moment.", "a": {"steffan": "audio/steffan_1318ef6aab17597a.mp3", "guy": "audio/guy_dfd25343f4de2e86.mp3", "christopher": "audio/christopher_17c3feef9fd17d89.mp3", "eric": "audio/eric_b57b34aa23726e21.mp3", "ava": "audio/ava_5ae25c5319bf6fc2.mp3"}}, {"t": "The nucleus sits at position r zero, and the electron is at position r.", "a": {"steffan": "audio/steffan_d7d9e7c032202a17.mp3", "guy": "audio/guy_ea408b73ec1eedfc.mp3", "christopher": "audio/christopher_e409ca218f9fbab4.mp3", "eric": "audio/eric_4875a4e563f662f5.mp3", "ava": "audio/ava_e1a3e711abe8a2ab.mp3"}}, {"t": "The dipole operator, D, is the electron charge q times the vector from the nucleus to the electron, r minus r zero.", "a": {"steffan": "audio/steffan_a1dc1a8695dfda5b.mp3", "guy": "audio/guy_0e3ee11bc414bef8.mp3", "christopher": "audio/christopher_c28445b8f873ca94.mp3", "eric": "audio/eric_962b48f7d024a658.mp3", "ava": "audio/ava_14c872f4f890bb2c.mp3"}}, {"t": "Its typical size is the electron charge times the Bohr radius, because the Bohr radius is the typical distance between the electron and the nucleus.", "a": {"steffan": "audio/steffan_bffb9ba1a4b4940e.mp3", "guy": "audio/guy_e856b1ecfb611642.mp3", "christopher": "audio/christopher_9bc0bdbf215cd4bb.mp3", "eric": "audio/eric_590ffca36f3fe5d4.mp3", "ava": "audio/ava_5aaa4ef1122d9cc2.mp3"}}]}, {"title": "The long-wavelength approximation", "items": [{"t": "The electric field of the light repeats itself in space every wavelength.", "a": {"steffan": "audio/steffan_39cb7df46c6b8181.mp3", "guy": "audio/guy_859154989dd59666.mp3", "christopher": "audio/christopher_74f2103b55af1731.mp3", "eric": "audio/eric_2f4f9c0a4b9c7f47.mp3", "ava": "audio/ava_fc513638777b17a6.mp3"}}, {"t": "But the atom is tiny compared to this wavelength.", "a": {"steffan": "audio/steffan_bf3feceb72950801.mp3", "guy": "audio/guy_b76381a397a7d679.mp3", "christopher": "audio/christopher_90048608c1bcc91a.mp3", "eric": "audio/eric_dd889c68260eb3dc.mp3", "ava": "audio/ava_0928a018da0e9882.mp3"}}, {"t": "An atom is about ten to the minus ten meters across.", "a": {"steffan": "audio/steffan_9cbae696e40931a1.mp3", "guy": "audio/guy_81dc14e8369009ca.mp3", "christopher": "audio/christopher_d70fc909dd2c2413.mp3", "eric": "audio/eric_8697068d8e9811f1.mp3", "ava": "audio/ava_3a2d95465a74c76c.mp3"}}, {"t": "Visible light has a wavelength of about five times ten to the minus seven meters, which is thousands of times larger.", "a": {"steffan": "audio/steffan_0a2fa1cecd1e2214.mp3", "guy": "audio/guy_08e059cbbca957dd.mp3", "christopher": "audio/christopher_3538666a3179e2a8.mp3", "eric": "audio/eric_2024d54ddb24428d.mp3", "ava": "audio/ava_4fe04c312f22fd96.mp3"}}, {"t": "So across the whole atom, the field has practically the same value.", "a": {"steffan": "audio/steffan_d38299c480ff0053.mp3", "guy": "audio/guy_6e23cdef2cfe8f39.mp3", "christopher": "audio/christopher_3a189cf26bf78e31.mp3", "eric": "audio/eric_0fb66867e6a309de.mp3", "ava": "audio/ava_7c0d81555133af86.mp3"}}, {"t": "The atom does not see the wave pattern in space. It only sees a field that oscillates in time.", "a": {"steffan": "audio/steffan_26e107ad987f2389.mp3", "guy": "audio/guy_4214be2d7a2a1a61.mp3", "christopher": "audio/christopher_f00bfab9aa6192c4.mp3", "eric": "audio/eric_cbae81bf1afdec2a.mp3", "ava": "audio/ava_3e174386f44aa4e4.mp3"}}, {"t": "So we take the field at the position of the nucleus, r zero, and use that value for the whole atom.", "a": {"steffan": "audio/steffan_39573b1e631b73fe.mp3", "guy": "audio/guy_25f140b216a50edd.mp3", "christopher": "audio/christopher_31d07b36f213e63f.mp3", "eric": "audio/eric_9b1c4fc883ade269.mp3", "ava": "audio/ava_0318295011fa8cb4.mp3"}}, {"t": "This is the long-wavelength approximation, also called the dipole approximation.", "a": {"steffan": "audio/steffan_598f590669d71a6b.mp3", "guy": "audio/guy_33c5eedbaa6f709b.mp3", "christopher": "audio/christopher_a967c6ef042c6f39.mp3", "eric": "audio/eric_6ace35dd31bd93c4.mp3", "ava": "audio/ava_5531858ccfbca5fd.mp3"}}]}, {"title": "The electric dipole Hamiltonian", "items": [{"t": "Now we can write the full Hamiltonian: H zero plus an interaction term, H I.", "a": {"steffan": "audio/steffan_100580898dea6319.mp3", "guy": "audio/guy_2732672485e44587.mp3", "christopher": "audio/christopher_93ff72048fbb74e7.mp3", "eric": "audio/eric_c9304d28383f1e38.mp3", "ava": "audio/ava_5d8ac2fab4058d2e.mp3"}}, {"t": "The interaction term is minus the dipole operator D, dotted with the electric field at the nucleus.", "a": {"steffan": "audio/steffan_0928bd2e61350a78.mp3", "guy": "audio/guy_9411470e46282eff.mp3", "christopher": "audio/christopher_2e3e332896e2e293.mp3", "eric": "audio/eric_89f9f420cd4473c3.mp3", "ava": "audio/ava_d1ecd8e2c819a914.mp3"}}, {"t": "This is the electric dipole Hamiltonian.", "a": {"steffan": "audio/steffan_186bcb2922088606.mp3", "guy": "audio/guy_42ff04a14bc2a6d9.mp3", "christopher": "audio/christopher_cff0641e8b8fef43.mp3", "eric": "audio/eric_03a30c2572611f3b.mp3", "ava": "audio/ava_df694126fba630f4.mp3"}}, {"t": "It is exactly the energy of a classical electric dipole in an electric field.", "a": {"steffan": "audio/steffan_edc086eaed89e370.mp3", "guy": "audio/guy_1b4911e37b28e29f.mp3", "christopher": "audio/christopher_6bba5fd4dbb150f7.mp3", "eric": "audio/eric_72a132f58017185e.mp3", "ava": "audio/ava_3e589734961944ea.mp3"}}, {"t": "So the picture is simple: the field couples to the charge separation of the atom.", "a": {"steffan": "audio/steffan_81f1d2912eab43db.mp3", "guy": "audio/guy_91617131ec1631ee.mp3", "christopher": "audio/christopher_a5fb841fe8bd5935.mp3", "eric": "audio/eric_b849ec18a21b4284.mp3", "ava": "audio/ava_cc1eaa7a85fbd08a.mp3"}}, {"t": "There is a subtle point about where this form comes from.", "a": {"steffan": "audio/steffan_a796cb8f4c09e1cc.mp3", "guy": "audio/guy_49c5e56200f1bc8c.mp3", "christopher": "audio/christopher_216525e6085120d0.mp3", "eric": "audio/eric_e8bf5f596cd5b0c8.mp3", "ava": "audio/ava_900ce25b1e57d128.mp3"}}, {"t": "The field can be described with potentials, and many different choices of potentials give the same electric and magnetic fields. This freedom is called gauge freedom.", "a": {"steffan": "audio/steffan_d1077916cc841eae.mp3", "guy": "audio/guy_d0e63c12dec00731.mp3", "christopher": "audio/christopher_1a29ce07ee0c9df7.mp3", "eric": "audio/eric_9019ce2e4a7d5a0d.mp3", "ava": "audio/ava_c2425379fafc8544.mp3"}}, {"t": "One choice of gauge, together with the long-wavelength approximation, gives exactly this minus D dot E form.", "a": {"steffan": "audio/steffan_e73834681fb3dac6.mp3", "guy": "audio/guy_87d777780801c7dc.mp3", "christopher": "audio/christopher_59e476caef136734.mp3", "eric": "audio/eric_2e81e9750a45d915.mp3", "ava": "audio/ava_6b7d7a6419921a81.mp3"}}, {"t": "Another common choice gives a different looking Hamiltonian, the A dot p form.", "a": {"steffan": "audio/steffan_932fe299fb167393.mp3", "guy": "audio/guy_c2fd078af3fd643e.mp3", "christopher": "audio/christopher_2b58f60a1385712a.mp3", "eric": "audio/eric_92076789337af4f0.mp3", "ava": "audio/ava_1f913f441453c4d0.mp3"}}, {"t": "But physical results depend only on the fields, so both forms give the same transition probabilities.", "a": {"steffan": "audio/steffan_1273b170770daefe.mp3", "guy": "audio/guy_5da7482f7e5212cd.mp3", "christopher": "audio/christopher_34cde450913625f8.mp3", "eric": "audio/eric_b571415dba4292d4.mp3", "ava": "audio/ava_c55496f87331d2e8.mp3"}}, {"t": "Now, what does H I actually do?", "a": {"steffan": "audio/steffan_0ddb9510d4745034.mp3", "guy": "audio/guy_65f0563d023707a9.mp3", "christopher": "audio/christopher_e5da4d9294ce69a7.mp3", "eric": "audio/eric_73d411470c6292f8.mp3", "ava": "audio/ava_f64652e6cb3e7dad.mp3"}}, {"t": "Its off-diagonal matrix elements, between two different states a and b, connect these states.", "a": {"steffan": "audio/steffan_0b4565d9cc646fea.mp3", "guy": "audio/guy_d7eea59ce5d994af.mp3", "christopher": "audio/christopher_f1a71973c73d1ca5.mp3", "eric": "audio/eric_94c03e48e1b52351.mp3", "ava": "audio/ava_06b40bafa44ea665.mp3"}}, {"t": "These elements are what move the atom from a to b.", "a": {"steffan": "audio/steffan_9377ef44722dcc62.mp3", "guy": "audio/guy_6e087752b6e2e84d.mp3", "christopher": "audio/christopher_0bacae10c5eaebc9.mp3", "eric": "audio/eric_e5385abe33acd659.mp3", "ava": "audio/ava_ba159ba364ef769d.mp3"}}, {"t": "Without them, the atom would just stay in its stationary state.", "a": {"steffan": "audio/steffan_57b0a5f986f3192d.mp3", "guy": "audio/guy_aee51f16495f94c8.mp3", "christopher": "audio/christopher_7566b59e731b15f0.mp3", "eric": "audio/eric_05a0bfb7dc66a08f.mp3", "ava": "audio/ava_6e103bb8746f4358.mp3"}}, {"t": "The transition probability depends on the squared magnitude of this matrix element.", "a": {"steffan": "audio/steffan_a3ec562bf9935ee6.mp3", "guy": "audio/guy_f4b5e4bf813cfb7e.mp3", "christopher": "audio/christopher_c30bed8e7b9cd6f7.mp3", "eric": "audio/eric_85aa23d28c2311e8.mp3", "ava": "audio/ava_7713037ee0805f23.mp3"}}, {"t": "So the question of which transitions can happen becomes the question of which matrix elements are nonzero.", "a": {"steffan": "audio/steffan_ecf148fee7e39b39.mp3", "guy": "audio/guy_664e5a6eb8889ecb.mp3", "christopher": "audio/christopher_897d5fe1718a3835.mp3", "eric": "audio/eric_031fb1afad376767.mp3", "ava": "audio/ava_b9b0a1121f4e9f7c.mp3"}}]}, {"title": "The parity selection rule", "items": [{"t": "To answer that, we use parity.", "a": {"steffan": "audio/steffan_8dd9da228135adaa.mp3", "guy": "audio/guy_3c7389b98555fc05.mp3", "christopher": "audio/christopher_8335611ac3f0aa6f.mp3", "eric": "audio/eric_f2ed491972d45e41.mp3", "ava": "audio/ava_de168a53b5225b09.mp3"}}, {"t": "Parity tells us what happens to a function when we replace r by minus r, which means reflecting through the origin.", "a": {"steffan": "audio/steffan_fcc0ec9dd1701ca3.mp3", "guy": "audio/guy_d690239f105ce156.mp3", "christopher": "audio/christopher_7b8d6fc3eb0507a3.mp3", "eric": "audio/eric_bc264cdd129d38e6.mp3", "ava": "audio/ava_4bea180a15e80114.mp3"}}, {"t": "An even function stays the same, and an odd function flips its sign.", "a": {"steffan": "audio/steffan_eef52542c161b65a.mp3", "guy": "audio/guy_e4c7fdb1a6695260.mp3", "christopher": "audio/christopher_c567bc98e3ced117.mp3", "eric": "audio/eric_9413da1710878508.mp3", "ava": "audio/ava_60181b0bccd6e440.mp3"}}, {"t": "The dipole operator is odd, because it is proportional to r.", "a": {"steffan": "audio/steffan_8b83dc82b8c2a489.mp3", "guy": "audio/guy_e15e1472a8061410.mp3", "christopher": "audio/christopher_450189cf4d332fa9.mp3", "eric": "audio/eric_471bb89725a415cd.mp3", "ava": "audio/ava_239dcc4303b8c441.mp3"}}, {"t": "Now take an atomic state a with a definite parity.", "a": {"steffan": "audio/steffan_00c7b051ba2ba57f.mp3", "guy": "audio/guy_182c26cc9b4ab6c1.mp3", "christopher": "audio/christopher_8d67f93e97d0a44c.mp3", "eric": "audio/eric_32e471af511d8113.mp3", "ava": "audio/ava_8afc7b230d9d8373.mp3"}}, {"t": "Its probability density, psi a star times psi a, does not change when r goes to minus r, so it is even.", "a": {"steffan": "audio/steffan_08e42a1befda866e.mp3", "guy": "audio/guy_ee4b2a135e0d34ee.mp3", "christopher": "audio/christopher_81efe5838a1117a0.mp3", "eric": "audio/eric_37250b34b7a12d55.mp3", "ava": "audio/ava_40648b616ae16cc4.mp3"}}, {"t": "The diagonal matrix element of D in state a is the integral of this even density times the odd dipole operator.", "a": {"steffan": "audio/steffan_af954469da484077.mp3", "guy": "audio/guy_e79f860d75c2d49e.mp3", "christopher": "audio/christopher_e3b3ee46844f2ed5.mp3", "eric": "audio/eric_0b4c835c1b7368df.mp3", "ava": "audio/ava_408491275883140a.mp3"}}, {"t": "Even times odd is odd, and an odd function integrated over all space gives zero.", "a": {"steffan": "audio/steffan_9d580d745ac8c5cc.mp3", "guy": "audio/guy_50177f25323062d0.mp3", "christopher": "audio/christopher_0097a0998d94a0f0.mp3", "eric": "audio/eric_e863baa00f6e3e45.mp3", "ava": "audio/ava_cc2a1bebca943940.mp3"}}, {"t": "So the diagonal element is zero.", "a": {"steffan": "audio/steffan_7e97e74bbd8079f4.mp3", "guy": "audio/guy_32759aac5ba2f467.mp3", "christopher": "audio/christopher_42ef2e532b8434e2.mp3", "eric": "audio/eric_8719b98bae60c92a.mp3", "ava": "audio/ava_021f79d59a41614b.mp3"}}, {"t": "Physically, this means an atom in a stationary state has no permanent dipole moment. The electron cloud is centered on the nucleus.", "a": {"steffan": "audio/steffan_44b87c0b40486246.mp3", "guy": "audio/guy_90bc37c6730a0814.mp3", "christopher": "audio/christopher_ce98e1c9e2ca24a8.mp3", "eric": "audio/eric_05e57dcfb8852fd9.mp3", "ava": "audio/ava_b396f19fe115385b.mp3"}}, {"t": "What about the off-diagonal element, between a and b?", "a": {"steffan": "audio/steffan_519b61308680c36c.mp3", "guy": "audio/guy_6d7651e7ca04b715.mp3", "christopher": "audio/christopher_0bbb67ed534acff1.mp3", "eric": "audio/eric_3b104c8db2ea3976.mp3", "ava": "audio/ava_ddf95c0fa6b65579.mp3"}}, {"t": "The same argument shows that it is zero if a and b have the same parity.", "a": {"steffan": "audio/steffan_2ab5f48e6a5c75b6.mp3", "guy": "audio/guy_d86b586c31d45e78.mp3", "christopher": "audio/christopher_a823cf0757d63c6e.mp3", "eric": "audio/eric_1cd46123f2e201c5.mp3", "ava": "audio/ava_4ac61b9fa27218cb.mp3"}}, {"t": "It can only be nonzero if a and b have opposite parity.", "a": {"steffan": "audio/steffan_5a2716137eafe384.mp3", "guy": "audio/guy_6ba8b73e3c111acc.mp3", "christopher": "audio/christopher_34c950865051f602.mp3", "eric": "audio/eric_0591786c6bff69cf.mp3", "ava": "audio/ava_1c9765e3599c8b09.mp3"}}, {"t": "So an electric dipole transition connects states of opposite parity. This is the parity selection rule.", "a": {"steffan": "audio/steffan_3e1e37de246ce297.mp3", "guy": "audio/guy_842b76891bd611d8.mp3", "christopher": "audio/christopher_748b5195f8a3dcf2.mp3", "eric": "audio/eric_56bec461317339db.mp3", "ava": "audio/ava_006f7c5881c42c1d.mp3"}}]}, {"title": "A moving atom: the Doppler shift", "items": [{"t": "So far, the atom was at rest. Now let it move with a constant velocity, v zero.", "a": {"steffan": "audio/steffan_2af35d44b612c37c.mp3", "guy": "audio/guy_53fbc45b6f48b797.mp3", "christopher": "audio/christopher_b9d2ce609c3809ce.mp3", "eric": "audio/eric_b907a9c44017df65.mp3", "ava": "audio/ava_6f39f988f361c43d.mp3"}}, {"t": "Then the position of the nucleus changes in time: r zero equals v zero times t.", "a": {"steffan": "audio/steffan_c84737707509a7a9.mp3", "guy": "audio/guy_f83db14417fa2f88.mp3", "christopher": "audio/christopher_0f0fdf9ebb36d4e4.mp3", "eric": "audio/eric_54e5e08c3c7662ef.mp3", "ava": "audio/ava_4da43775b3185803.mp3"}}, {"t": "The field at the atom is the cosine of omega t minus k dot r zero, where k is the wave vector, pointing in the direction the wave travels.", "a": {"steffan": "audio/steffan_0028a4e615b0abc5.mp3", "guy": "audio/guy_2432fd9ede8b9d5a.mp3", "christopher": "audio/christopher_8b07fcd095ec06bb.mp3", "eric": "audio/eric_f013e2a21bf84958.mp3", "ava": "audio/ava_a27a508ff60ed255.mp3"}}, {"t": "Put in r zero equals v zero times t, and the cosine becomes the cosine of omega minus k dot v zero, all times t.", "a": {"steffan": "audio/steffan_fc7f8f9f6e69b34d.mp3", "guy": "audio/guy_8da849027c400895.mp3", "christopher": "audio/christopher_30be137bd2fb4a5f.mp3", "eric": "audio/eric_e66cc9e8c4b347cb.mp3", "ava": "audio/ava_193467c702edb17b.mp3"}}, {"t": "So the moving atom sees a shifted frequency: omega minus k dot v zero.", "a": {"steffan": "audio/steffan_903f0a2ffbac20ea.mp3", "guy": "audio/guy_b2a04b05e488a9fa.mp3", "christopher": "audio/christopher_b40e057af3a6d25f.mp3", "eric": "audio/eric_b88cdad01622071c.mp3", "ava": "audio/ava_0d216fe64e318891.mp3"}}, {"t": "This is the Doppler shift.", "a": {"steffan": "audio/steffan_783624a0e4824807.mp3", "guy": "audio/guy_9292f4877a693913.mp3", "christopher": "audio/christopher_55ca566572773673.mp3", "eric": "audio/eric_cb0bb261e49057ca.mp3", "ava": "audio/ava_c139b713dd3ed054.mp3"}}, {"t": "If the atom moves against the wave, k dot v zero is negative, and the atom sees a higher frequency.", "a": {"steffan": "audio/steffan_fadf7fe8b90a9533.mp3", "guy": "audio/guy_211db8687fe369d3.mp3", "christopher": "audio/christopher_68ce9be986c1cb12.mp3", "eric": "audio/eric_3db5457b2e47c3e5.mp3", "ava": "audio/ava_8729e41f6d99e793.mp3"}}, {"t": "If it moves along with the wave, it sees a lower frequency.", "a": {"steffan": "audio/steffan_3fff98b69bf98914.mp3", "guy": "audio/guy_dcb9d7518117f45e.mp3", "christopher": "audio/christopher_2c0866a97fbddee9.mp3", "eric": "audio/eric_6cab361ec08f092b.mp3", "ava": "audio/ava_83e8c89442fc7d62.mp3"}}, {"t": "This matters because an atom only responds strongly near its resonance.", "a": {"steffan": "audio/steffan_fa41d549a779d708.mp3", "guy": "audio/guy_f048178df147e9d3.mp3", "christopher": "audio/christopher_8c939010444f8233.mp3", "eric": "audio/eric_2ca75191478fae05.mp3", "ava": "audio/ava_7a763821d389efce.mp3"}}, {"t": "So whether an atom absorbs the light depends on how fast it moves and in which direction.", "a": {"steffan": "audio/steffan_6ec0c91cbccc8994.mp3", "guy": "audio/guy_994fdc7a20461091.mp3", "christopher": "audio/christopher_220e87f380204b43.mp3", "eric": "audio/eric_01f1f209c4a7fe7d.mp3", "ava": "audio/ava_a26ecc8d64c88a86.mp3"}}, {"t": "This effect is used in laser spectroscopy and in laser cooling of atoms.", "a": {"steffan": "audio/steffan_3513b1936acf07ce.mp3", "guy": "audio/guy_2da8dbf5387899e5.mp3", "christopher": "audio/christopher_472f1cb4f8fd9182.mp3", "eric": "audio/eric_05c0a635ba15d7f7.mp3", "ava": "audio/ava_0aaebf670697d3d3.mp3"}}]}, {"title": "Magnetic versus electric interaction", "items": [{"t": "Light also has a magnetic field, and the atom also has a magnetic dipole moment, M.", "a": {"steffan": "audio/steffan_3588d85fbd5b36fa.mp3", "guy": "audio/guy_eb5a4ff819c5475e.mp3", "christopher": "audio/christopher_2e6cbaee00587f09.mp3", "eric": "audio/eric_f6fdad114d20fcfb.mp3", "ava": "audio/ava_627ad94efe87ec44.mp3"}}, {"t": "So there is a second interaction: minus M dot B, with the magnetic field at the nucleus.", "a": {"steffan": "audio/steffan_cc7f4bb4caa98ca7.mp3", "guy": "audio/guy_0e1177a95e89d71f.mp3", "christopher": "audio/christopher_640c8265a97f0317.mp3", "eric": "audio/eric_0c358692a3cf3815.mp3", "ava": "audio/ava_159d92fb5e913b95.mp3"}}, {"t": "For the electron, M comes from two sources: its orbital motion, through the angular momentum L, and its spin, S.", "a": {"steffan": "audio/steffan_8329a9ad0a91ad3b.mp3", "guy": "audio/guy_2e9f27db50677cfb.mp3", "christopher": "audio/christopher_18ff844092e9f78b.mp3", "eric": "audio/eric_a2d455b2f49f41ad.mp3", "ava": "audio/ava_70c6b9e43a182213.mp3"}}, {"t": "M is the charge over two times the mass, multiplied by L plus two S.", "a": {"steffan": "audio/steffan_7c30e1ae5e39317b.mp3", "guy": "audio/guy_ae06b32b8c5402fa.mp3", "christopher": "audio/christopher_51d04133d0e20dec.mp3", "eric": "audio/eric_b7f0e8cfa49110d7.mp3", "ava": "audio/ava_9c5acf5a4283504d.mp3"}}, {"t": "So why do we mostly ignore this term? Because it is much weaker.", "a": {"steffan": "audio/steffan_00148733b9f8e05f.mp3", "guy": "audio/guy_2d4352cebc531c31.mp3", "christopher": "audio/christopher_fd62c9436f8666de.mp3", "eric": "audio/eric_cc014eb5082df4df.mp3", "ava": "audio/ava_01ad24f53283c72d.mp3"}}, {"t": "Let's estimate the ratio of the two couplings.", "a": {"steffan": "audio/steffan_5734c4a733ef4964.mp3", "guy": "audio/guy_e1805944d8a21d8d.mp3", "christopher": "audio/christopher_2e0eaad8d46ca136.mp3", "eric": "audio/eric_b460dec0f91cceea.mp3", "ava": "audio/ava_6ca13d5dd9fa240f.mp3"}}, {"t": "The magnetic moment is about one Bohr magneton, which is q h bar over two m.", "a": {"steffan": "audio/steffan_b5ef9a9c1410cb1a.mp3", "guy": "audio/guy_c86e8ce5a86b1464.mp3", "christopher": "audio/christopher_14766ff91aa7af80.mp3", "eric": "audio/eric_3e73c4d13979b5b3.mp3", "ava": "audio/ava_4758482876f63b58.mp3"}}, {"t": "In a light wave, the magnetic field is the electric field divided by the speed of light. That division by c is what makes the magnetic coupling small.", "a": {"steffan": "audio/steffan_55149871afd31084.mp3", "guy": "audio/guy_728f43d790125c0c.mp3", "christopher": "audio/christopher_cd73f3b15907567b.mp3", "eric": "audio/eric_c7129d62d13f8e6c.mp3", "ava": "audio/ava_a55207172dc91c0a.mp3"}}, {"t": "The electric dipole is about the electron charge times the Bohr radius.", "a": {"steffan": "audio/steffan_272d04fd585e392c.mp3", "guy": "audio/guy_206d2324eb5139ed.mp3", "christopher": "audio/christopher_1d0a5c6136ac8fde.mp3", "eric": "audio/eric_9143c529b7642256.mp3", "ava": "audio/ava_ee088a44eb277459.mp3"}}, {"t": "Putting these together, the ratio of magnetic to electric coupling is of the order of the fine-structure constant, alpha.", "a": {"steffan": "audio/steffan_cf5fc66671337e1f.mp3", "guy": "audio/guy_eed3cddfaf9b7930.mp3", "christopher": "audio/christopher_0228f12af519a7c7.mp3", "eric": "audio/eric_4bbd372161dce11f.mp3", "ava": "audio/ava_fc89fa313d6d6e38.mp3"}}, {"t": "Alpha is about one over one hundred thirty seven.", "a": {"steffan": "audio/steffan_94d5b21bd493560d.mp3", "guy": "audio/guy_13bf4733f22bf288.mp3", "christopher": "audio/christopher_ad34caed115c4178.mp3", "eric": "audio/eric_7282b0f0a4651953.mp3", "ava": "audio/ava_5e845e5e1cb0f1f8.mp3"}}, {"t": "So the magnetic coupling is about two orders of magnitude weaker than the electric one.", "a": {"steffan": "audio/steffan_1787b40323fdb852.mp3", "guy": "audio/guy_2e8665ceb8dfa1b9.mp3", "christopher": "audio/christopher_c65888cb7d1f43ea.mp3", "eric": "audio/eric_9614ef0e8b6f2595.mp3", "ava": "audio/ava_e0a42f9fa036367f.mp3"}}, {"t": "That is why electric dipole transitions dominate atomic spectroscopy whenever they are allowed.", "a": {"steffan": "audio/steffan_557ebc66f8878dfb.mp3", "guy": "audio/guy_61ccbc4ce1fd2150.mp3", "christopher": "audio/christopher_876ded2aaf6f9ab1.mp3", "eric": "audio/eric_975e6cb45ed0f488.mp3", "ava": "audio/ava_03f121df9dffd950.mp3"}}, {"t": "But when the electric dipole element is zero, for example between two states of the same parity, the magnetic dipole term is what drives the transition.", "a": {"steffan": "audio/steffan_b2ad359feeec21b6.mp3", "guy": "audio/guy_34c2d5561b2a34e0.mp3", "christopher": "audio/christopher_89a5cef6495b235e.mp3", "eric": "audio/eric_9675601e102a5cae.mp3", "ava": "audio/ava_a638cba7c2698a56.mp3"}}, {"t": "A famous example is the twenty-one centimeter line of hydrogen, at fourteen hundred twenty megahertz, between two hyperfine levels of the ground state.", "a": {"steffan": "audio/steffan_4f63bf3c8fa54889.mp3", "guy": "audio/guy_8654f371cb106099.mp3", "christopher": "audio/christopher_8a3ae673c4ab4d66.mp3", "eric": "audio/eric_8fe3c535064eb165.mp3", "ava": "audio/ava_ef8c3ff584b95582.mp3"}}, {"t": "Another one is the caesium transition at nine thousand one hundred ninety two megahertz, which defines the second.", "a": {"steffan": "audio/steffan_503b0a1eececd76e.mp3", "guy": "audio/guy_64ebea0af9a3f6ff.mp3", "christopher": "audio/christopher_f7cafdb1a942a402.mp3", "eric": "audio/eric_15c250b8c7f7f5d6.mp3", "ava": "audio/ava_3d332f35a155c15d.mp3"}}, {"t": "At the same order as the magnetic dipole term, there is also an electric quadrupole term, which couples to how the electric field changes across the atom.", "a": {"steffan": "audio/steffan_498a8b494dbb14b9.mp3", "guy": "audio/guy_6a66c855f5579003.mp3", "christopher": "audio/christopher_bb7790008f4e175d.mp3", "eric": "audio/eric_4e35c307ac79dbf6.mp3", "ava": "audio/ava_2d4c5b5b94a07922.mp3"}}]}]}, {"num": "3", "name": "The driven two level atom", "sections": [{"title": "The two-level Hamiltonian", "items": [{"t": "Now we let the light actually drive the atom, and we follow what happens in time.", "a": {"steffan": "audio/steffan_83ee69ca460f79e4.mp3", "guy": "audio/guy_bd465e5c09515b15.mp3", "christopher": "audio/christopher_4546716ca3f2a9c0.mp3", "eric": "audio/eric_605384d97624d2d5.mp3", "ava": "audio/ava_17a176a2487da87d.mp3"}}, {"t": "We keep only two levels, a and b. This works because the light is close to resonance with this one transition, so all the other levels are too far away to matter.", "a": {"steffan": "audio/steffan_d57eb90d7159c1f5.mp3", "guy": "audio/guy_2d0a894edc76e78d.mp3", "christopher": "audio/christopher_a61ffc4785b2e7b2.mp3", "eric": "audio/eric_1100b0709116d447.mp3", "ava": "audio/ava_19afa829e773118c.mp3"}}, {"t": "We put the energy of a at zero, and the energy of b at h bar omega zero.", "a": {"steffan": "audio/steffan_57d65e3836991cc3.mp3", "guy": "audio/guy_eff443689bb6eaef.mp3", "christopher": "audio/christopher_936f4a64fdd1fa76.mp3", "eric": "audio/eric_3f4a070dbd717e60.mp3", "ava": "audio/ava_58f5f9586a13b86e.mp3"}}, {"t": "The light has the field E zero times the cosine of omega t plus phi, where phi is its phase.", "a": {"steffan": "audio/steffan_802cf4123b4bba60.mp3", "guy": "audio/guy_cd9623e49bdad3d3.mp3", "christopher": "audio/christopher_3270793dcb6d3470.mp3", "eric": "audio/eric_a638ab61d3b92295.mp3", "ava": "audio/ava_9c3142437c42b264.mp3"}}, {"t": "The interaction is minus D dot E, as before.", "a": {"steffan": "audio/steffan_8fe7ee539af3433d.mp3", "guy": "audio/guy_36b0066570bf40c7.mp3", "christopher": "audio/christopher_83517e0e53bde7b5.mp3", "eric": "audio/eric_f535b781b1cce467.mp3", "ava": "audio/ava_0d77c53ca85704ef.mp3"}}, {"t": "Its strength is set by the Rabi frequency, omega one.", "a": {"steffan": "audio/steffan_67aeb11d4f47d393.mp3", "guy": "audio/guy_7440fd112d85f9a7.mp3", "christopher": "audio/christopher_df1ec769ccec918b.mp3", "eric": "audio/eric_1fbbc4196524d430.mp3", "ava": "audio/ava_2408a40352f2a625.mp3"}}, {"t": "Omega one is the dipole matrix element between a and b, times the field amplitude, divided by h bar.", "a": {"steffan": "audio/steffan_fe92db023c341f8e.mp3", "guy": "audio/guy_97072bbcd61f1a12.mp3", "christopher": "audio/christopher_54f79b855cc76684.mp3", "eric": "audio/eric_c4a36abbcd17a254.mp3", "ava": "audio/ava_b2dc3b154bbd0951.mp3"}}, {"t": "So omega one is the coupling strength, written as a frequency. A bigger dipole or a stronger field gives a larger omega one.", "a": {"steffan": "audio/steffan_d6b68f0e5853fdf1.mp3", "guy": "audio/guy_8f9ca58e4fd43e1a.mp3", "christopher": "audio/christopher_3b00106d46f09ae2.mp3", "eric": "audio/eric_360ea92f5f1653c3.mp3", "ava": "audio/ava_0a446aba01ac6d46.mp3"}}, {"t": "Now we write the Hamiltonian as a two by two matrix, in the basis of a and b.", "a": {"steffan": "audio/steffan_fd82f95ff70362d0.mp3", "guy": "audio/guy_584b4861d9975763.mp3", "christopher": "audio/christopher_36e5f03c588571a2.mp3", "eric": "audio/eric_ace5fac96353a8eb.mp3", "ava": "audio/ava_d4df30e95e0d1462.mp3"}}, {"t": "The diagonal elements are the energies of the two levels: zero and h bar omega zero.", "a": {"steffan": "audio/steffan_54f36b1ce89b9008.mp3", "guy": "audio/guy_588bf2a9378be107.mp3", "christopher": "audio/christopher_07b96446c9a54463.mp3", "eric": "audio/eric_a7461b3ad07af9ef.mp3", "ava": "audio/ava_d656ec48c721d9c8.mp3"}}, {"t": "The off-diagonal elements are h bar omega one times the cosine of omega t plus phi. They come from the light.", "a": {"steffan": "audio/steffan_7cf4267cea932597.mp3", "guy": "audio/guy_2e21483eb50a1000.mp3", "christopher": "audio/christopher_d41d88a1284fe883.mp3", "eric": "audio/eric_a28eefd1332ade11.mp3", "ava": "audio/ava_5f6fccd36d9758cb.mp3"}}, {"t": "The diagonal part alone would keep the atom in its level forever. The off-diagonal part is what connects a and b and moves the atom between them.", "a": {"steffan": "audio/steffan_4360eb8ae5215d31.mp3", "guy": "audio/guy_6e0ecea4cfa8c84a.mp3", "christopher": "audio/christopher_53099214a4482ebf.mp3", "eric": "audio/eric_55d35caf526f940d.mp3", "ava": "audio/ava_8c80243feea29b41.mp3"}}]}, {"title": "Equations of motion", "items": [{"t": "We write the state of the atom as c a times a, plus c b times e to the minus i omega zero t times b.", "a": {"steffan": "audio/steffan_a0262cfb22c71268.mp3", "guy": "audio/guy_f04a21200581d23c.mp3", "christopher": "audio/christopher_d886adc3be9cdd25.mp3", "eric": "audio/eric_dff8a719651e99b8.mp3", "ava": "audio/ava_7ab8dc366fe9eee6.mp3"}}, {"t": "The factor e to the minus i omega zero t is the free evolution of state b, the phase it would pick up with no light at all.", "a": {"steffan": "audio/steffan_61a9ffd75e7cf699.mp3", "guy": "audio/guy_4491ffc8f9533eed.mp3", "christopher": "audio/christopher_4b3af1e60b76cd4c.mp3", "eric": "audio/eric_b22c0c1d2cc34fde.mp3", "ava": "audio/ava_ab99fdf684edabf6.mp3"}}, {"t": "We pull this factor out on purpose. Then c a and c b only change because of the light, and that is exactly what we want to follow.", "a": {"steffan": "audio/steffan_d4b29becb87106ae.mp3", "guy": "audio/guy_bcae7eb5ae48457d.mp3", "christopher": "audio/christopher_30b992f9642d78f6.mp3", "eric": "audio/eric_4b58ef75a4b7ae4f.mp3", "ava": "audio/ava_6856729d758dfd04.mp3"}}, {"t": "We put this state into the Schrödinger equation.", "a": {"steffan": "audio/steffan_fb87434ba42ce776.mp3", "guy": "audio/guy_17e99f929b6ba040.mp3", "christopher": "audio/christopher_843945cd83fa58a2.mp3", "eric": "audio/eric_97662cd16b964cab.mp3", "ava": "audio/ava_71761af9b1ae304f.mp3"}}, {"t": "The cosine of the field can be written as a sum of two complex exponentials, one with plus omega and one with minus omega.", "a": {"steffan": "audio/steffan_135671dedf525dd3.mp3", "guy": "audio/guy_a0cfe67cff0546d0.mp3", "christopher": "audio/christopher_21990e9e493afb36.mp3", "eric": "audio/eric_5fda0805e848b3bf.mp3", "ava": "audio/ava_6ebd45875aefffe3.mp3"}}, {"t": "So we get two coupled equations: the change of c a depends on c b, and the change of c b depends on c a.", "a": {"steffan": "audio/steffan_dfba29e4aaad3f20.mp3", "guy": "audio/guy_955989f9a8518e34.mp3", "christopher": "audio/christopher_f3742c0014e0a3e7.mp3", "eric": "audio/eric_ce3ef2825f41577c.mp3", "ava": "audio/ava_7a3d21ad3cbb636d.mp3"}}, {"t": "In these equations, two kinds of terms appear.", "a": {"steffan": "audio/steffan_ea3204889af87ba7.mp3", "guy": "audio/guy_2150e60f6d4f7005.mp3", "christopher": "audio/christopher_f82054a481192756.mp3", "eric": "audio/eric_6d43999e57b06fef.mp3", "ava": "audio/ava_d5acdcf25e02d068.mp3"}}, {"t": "Some terms oscillate at omega minus omega zero. Near resonance, this difference is small, so these terms change slowly.", "a": {"steffan": "audio/steffan_66bc1a5607d2caab.mp3", "guy": "audio/guy_524d75bf41c1da12.mp3", "christopher": "audio/christopher_704af1052a397ca4.mp3", "eric": "audio/eric_90fedd5b31a9544e.mp3", "ava": "audio/ava_caac3b6871714971.mp3"}}, {"t": "Other terms oscillate at omega plus omega zero. This is roughly twice the optical frequency, so these terms change extremely fast.", "a": {"steffan": "audio/steffan_872940e85cea78b8.mp3", "guy": "audio/guy_6df9431423f35c87.mp3", "christopher": "audio/christopher_f5265ffa2daa6490.mp3", "eric": "audio/eric_680047fb314da50e.mp3", "ava": "audio/ava_3282bf7c008031f5.mp3"}}]}, {"title": "The rotating-wave approximation", "items": [{"t": "The fast terms flip their sign so quickly that their effect averages out to zero over the time scale on which c a and c b change.", "a": {"steffan": "audio/steffan_10066ba8deba115c.mp3", "guy": "audio/guy_0f52f1259128cb49.mp3", "christopher": "audio/christopher_d03c7566b1c3f207.mp3", "eric": "audio/eric_f6cf18e08c6d285e.mp3", "ava": "audio/ava_7010f11d30735871.mp3"}}, {"t": "The slow terms keep pushing in the same direction for a long time, so their effect builds up.", "a": {"steffan": "audio/steffan_999567110ef7d47f.mp3", "guy": "audio/guy_a6ea65cda7cf1c03.mp3", "christopher": "audio/christopher_4cf889311b5fb272.mp3", "eric": "audio/eric_65f08214a8dce0f9.mp3", "ava": "audio/ava_f4599099758306a4.mp3"}}, {"t": "So we keep only the slow terms and drop the fast ones.", "a": {"steffan": "audio/steffan_17915ddbf9ed7da4.mp3", "guy": "audio/guy_d4234eb9c4c30acc.mp3", "christopher": "audio/christopher_fd4c12d4522ace35.mp3", "eric": "audio/eric_8b63f381a9de1ebd.mp3", "ava": "audio/ava_f307db85bba9b40f.mp3"}}, {"t": "This is the rotating-wave approximation.", "a": {"steffan": "audio/steffan_3ad605f180198596.mp3", "guy": "audio/guy_8659afb8dd38e5ab.mp3", "christopher": "audio/christopher_4c80107fcf505a8f.mp3", "eric": "audio/eric_1b50e5248e2c310d.mp3", "ava": "audio/ava_b2bc2d5fc543fdc0.mp3"}}, {"t": "It works well close to resonance, where omega minus omega zero is much smaller than omega plus omega zero.", "a": {"steffan": "audio/steffan_ef09e32f50e87cc4.mp3", "guy": "audio/guy_44c61a96035b761e.mp3", "christopher": "audio/christopher_66fa8cee32f1492d.mp3", "eric": "audio/eric_5c0986215f1c2e58.mp3", "ava": "audio/ava_8d8e7bbc4ddc9b97.mp3"}}, {"t": "After this step, the two equations are simple enough to solve exactly.", "a": {"steffan": "audio/steffan_e8af2c037f7e836d.mp3", "guy": "audio/guy_8209f6fe2dfba712.mp3", "christopher": "audio/christopher_f23fc398cb8fc780.mp3", "eric": "audio/eric_54f24aa8862b4a99.mp3", "ava": "audio/ava_2cce126eb506f483.mp3"}}]}, {"title": "Rabi oscillations", "items": [{"t": "We start with the atom in the ground state: c a is one, and c b is zero.", "a": {"steffan": "audio/steffan_2d0d8e8fa9800986.mp3", "guy": "audio/guy_fe942ca1cbd0c170.mp3",
