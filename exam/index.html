"christopher": "audio/christopher_e82d0e46662765d6.mp3", "eric": "audio/eric_50fc4e78648cd303.mp3", "ava": "audio/ava_dc860ef62b927562.mp3"}}, {"t": "First, we define the detuning, delta. It is omega minus omega zero, so it tells us how far the light is from resonance.", "a": {"steffan": "audio/steffan_70e5fe4dd525fcd5.mp3", "guy": "audio/guy_5f0a65470d963b27.mp3", "christopher": "audio/christopher_60c5b7dc720cd948.mp3", "eric": "audio/eric_ba5c9a24f97dba31.mp3", "ava": "audio/ava_5612be6a3b2007a3.mp3"}}, {"t": "Then we define the generalized Rabi frequency, capital omega. It is the square root of omega one squared plus delta squared.", "a": {"steffan": "audio/steffan_04529ec2989d1f80.mp3", "guy": "audio/guy_b3907e39cb273e6a.mp3", "christopher": "audio/christopher_ba7c9a2372cb0fbb.mp3", "eric": "audio/eric_1124d74190d29179.mp3", "ava": "audio/ava_da68e8bbcb41af00.mp3"}}, {"t": "The probability to find the atom in state b is then omega one squared over capital omega squared, times sine squared of capital omega t over two.", "a": {"steffan": "audio/steffan_c258c9430961437f.mp3", "guy": "audio/guy_9d90257b8c194fd6.mp3", "christopher": "audio/christopher_11a5ae77d1a73264.mp3", "eric": "audio/eric_424874572b4c5811.mp3", "ava": "audio/ava_5b3aee4cdd07a1ad.mp3"}}, {"t": "Let's look at what this means.", "a": {"steffan": "audio/steffan_e733048cb0670dae.mp3", "guy": "audio/guy_7dda5d5c3835254c.mp3", "christopher": "audio/christopher_bd2f25f650356c62.mp3", "eric": "audio/eric_d69e1ebf11374d37.mp3", "ava": "audio/ava_f94d450a67ae52e8.mp3"}}, {"t": "The probability oscillates in time. The atom goes up to b and comes back down to a, again and again. These are Rabi oscillations.", "a": {"steffan": "audio/steffan_9ef55ee54bb59e2d.mp3", "guy": "audio/guy_1902be8e42d5f7f4.mp3", "christopher": "audio/christopher_baaa544433ba9ec2.mp3", "eric": "audio/eric_77efbee0980f7242.mp3", "ava": "audio/ava_f61ee8ed99f333e4.mp3"}}, {"t": "You can see them as periods where absorption dominates, followed by periods where stimulated emission dominates.", "a": {"steffan": "audio/steffan_5e6925b486b18884.mp3", "guy": "audio/guy_67c1cb06216cc82e.mp3", "christopher": "audio/christopher_2910b17c0340c862.mp3", "eric": "audio/eric_04f003b05d294f16.mp3", "ava": "audio/ava_139bfd01080525bb.mp3"}}, {"t": "On resonance, delta is zero, so capital omega equals omega one, and the prefactor is one.", "a": {"steffan": "audio/steffan_8d661345dcb9fb31.mp3", "guy": "audio/guy_724f4f7ed3944347.mp3", "christopher": "audio/christopher_187e0bed428d1af5.mp3", "eric": "audio/eric_650a382058b038e8.mp3", "ava": "audio/ava_a7fbc567d070e046.mp3"}}, {"t": "So on resonance, the population swings completely: at the top of each oscillation, the atom is fully in state b.", "a": {"steffan": "audio/steffan_10dfbde87d3a2e5b.mp3", "guy": "audio/guy_84c4797f97c1d441.mp3", "christopher": "audio/christopher_9eadcbcc029fe03c.mp3", "eric": "audio/eric_5cdbcfef9a91bee3.mp3", "ava": "audio/ava_6a90ecb995b077ae.mp3"}}, {"t": "Off resonance, the oscillation is faster, because capital omega is larger than omega one.", "a": {"steffan": "audio/steffan_b06e1330f5c703d9.mp3", "guy": "audio/guy_4759a2df15f67347.mp3", "christopher": "audio/christopher_4a8d1e49a9116d1d.mp3", "eric": "audio/eric_0496be31b6e8d795.mp3", "ava": "audio/ava_d7575371b5fccd72.mp3"}}, {"t": "But it never reaches one. The maximum is omega one squared over capital omega squared, which is smaller than one.", "a": {"steffan": "audio/steffan_ec682d008ad3d566.mp3", "guy": "audio/guy_46409e0a9fbfc467.mp3", "christopher": "audio/christopher_abf4f067bd8a484c.mp3", "eric": "audio/eric_9793dec05c807e62.mp3", "ava": "audio/ava_52ac14e8a4554e5a.mp3"}}, {"t": "The further we detune, the faster and the smaller the oscillation becomes.", "a": {"steffan": "audio/steffan_89a75a7b5d2f122c.mp3", "guy": "audio/guy_8bd43ba33ba61b0f.mp3", "christopher": "audio/christopher_a3d1109a56aca7f6.mp3", "eric": "audio/eric_8a7b3693d39e251b.mp3", "ava": "audio/ava_dc99d949203f230b.mp3"}}, {"t": "Keep in mind that this picture assumes both levels live forever. Once the levels decay, the oscillations get damped.", "a": {"steffan": "audio/steffan_8c418968cc7ae8ae.mp3", "guy": "audio/guy_091c8278f7a94130.mp3", "christopher": "audio/christopher_03e45c34f8c69eb6.mp3", "eric": "audio/eric_3d21252419d258f0.mp3", "ava": "audio/ava_ef631bf4aa5e682b.mp3"}}]}, {"title": "Power broadening", "items": [{"t": "Now look only at the maximum of the probability, and see how it depends on the light frequency.", "a": {"steffan": "audio/steffan_3ee409262d185b73.mp3", "guy": "audio/guy_f50f1f6f91b2392f.mp3", "christopher": "audio/christopher_59a1188c75b459dd.mp3", "eric": "audio/eric_2c4fbc8fe1ac2c41.mp3", "ava": "audio/ava_d0929bcbb7d8acc4.mp3"}}, {"t": "This maximum is omega one squared over omega one squared plus omega minus omega zero squared.", "a": {"steffan": "audio/steffan_ea9308b71286c6f0.mp3", "guy": "audio/guy_16f3f7c624022c4e.mp3", "christopher": "audio/christopher_f188ffba3cb9cdca.mp3", "eric": "audio/eric_1803f4929a4c7a38.mp3", "ava": "audio/ava_2ef7554cdce5a764.mp3"}}, {"t": "As a function of the frequency, this is a Lorentzian, centered at omega zero.", "a": {"steffan": "audio/steffan_805fb63440876d21.mp3", "guy": "audio/guy_13542e7f5a640373.mp3", "christopher": "audio/christopher_363dd13ecce2f55f.mp3", "eric": "audio/eric_2c30271e82415ded.mp3", "ava": "audio/ava_fb448d7b7ba0f3ca.mp3"}}, {"t": "Its half width is omega one, so its full width at half maximum is two omega one.", "a": {"steffan": "audio/steffan_d3328f672877d1a8.mp3", "guy": "audio/guy_633124aadf17bbaf.mp3", "christopher": "audio/christopher_a7fa341b0c5f426c.mp3", "eric": "audio/eric_004c7ad51efa532a.mp3", "ava": "audio/ava_2911b906c2d55144.mp3"}}, {"t": "So the width of the resonance is set by the Rabi frequency.", "a": {"steffan": "audio/steffan_b5d2c6090fb3eaa9.mp3", "guy": "audio/guy_c1308ec42d6ee0ce.mp3", "christopher": "audio/christopher_ec5bf407317f1e5e.mp3", "eric": "audio/eric_289dc9390e09e26f.mp3", "ava": "audio/ava_491c1d8a74624d97.mp3"}}, {"t": "The Rabi frequency is proportional to the field amplitude, and the field amplitude is proportional to the square root of the light power.", "a": {"steffan": "audio/steffan_2083229c75cb3f53.mp3", "guy": "audio/guy_f1299a9699a60c3f.mp3", "christopher": "audio/christopher_e65dff7ca86d9ff4.mp3", "eric": "audio/eric_f2d8b2327c3550fd.mp3", "ava": "audio/ava_d5c0d22d68466299.mp3"}}, {"t": "So if we increase the power, the Rabi frequency grows, and the resonance gets wider.", "a": {"steffan": "audio/steffan_9fafba91f72d7d42.mp3", "guy": "audio/guy_dfbed7a4170d16c6.mp3", "christopher": "audio/christopher_4c02f0ffdcaa93db.mp3", "eric": "audio/eric_ae03e620cd767671.mp3", "ava": "audio/ava_7e8904f8beaf63e7.mp3"}}, {"t": "This is power broadening.", "a": {"steffan": "audio/steffan_b7c36956a2349c06.mp3", "guy": "audio/guy_ce2433a1594c364a.mp3", "christopher": "audio/christopher_8e6c0c31aad629af.mp3", "eric": "audio/eric_6107ecbaca6502da.mp3", "ava": "audio/ava_e1e894a1699c339f.mp3"}}, {"t": "The reason is simple: a stronger drive can move the atom to b even when the light is further from resonance.", "a": {"steffan": "audio/steffan_5b7d3a99509cbe69.mp3", "guy": "audio/guy_b02a7adeb7d69640.mp3", "christopher": "audio/christopher_f0ea0ed3c84af60f.mp3", "eric": "audio/eric_ddc7512c193e1470.mp3", "ava": "audio/ava_40c644a2c971a1df.mp3"}}]}, {"title": "Orders of magnitude", "items": [{"t": "How big is the Rabi frequency in practice?", "a": {"steffan": "audio/steffan_c50df8e4f15b2b51.mp3", "guy": "audio/guy_72f93234b657318b.mp3", "christopher": "audio/christopher_d97914b4ac4d78bf.mp3", "eric": "audio/eric_90ba34fa49a7d84b.mp3", "ava": "audio/ava_ee55618425f9e368.mp3"}}, {"t": "Take a laser beam of one milliwatt, focused to one square millimeter, and a dipole of the electron charge times the Bohr radius.", "a": {"steffan": "audio/steffan_f9adf0a617d4e9c9.mp3", "guy": "audio/guy_569d2e2bf8f35b28.mp3", "christopher": "audio/christopher_c8cede04ec5a3492.mp3", "eric": "audio/eric_0fefae0191a85b35.mp3", "ava": "audio/ava_bf8802ac72f6fb45.mp3"}}, {"t": "This gives a Rabi frequency of about ten to the eight per second.", "a": {"steffan": "audio/steffan_972b3adfc6adb16c.mp3", "guy": "audio/guy_3d411260fd85cee3.mp3", "christopher": "audio/christopher_40e52e95630f7d09.mp3", "eric": "audio/eric_023931d09a378eb0.mp3", "ava": "audio/ava_a82724f1a13dbbe7.mp3"}}, {"t": "On resonance, the transition probability then becomes large within a few nanoseconds.", "a": {"steffan": "audio/steffan_630450feddefd4d3.mp3", "guy": "audio/guy_cb7ac939f785d86d.mp3", "christopher": "audio/christopher_670c3a9a6e30b847.mp3", "eric": "audio/eric_d803a02e306cd328.mp3", "ava": "audio/ava_9a14a226820f8034.mp3"}}, {"t": "To actually see Rabi oscillations, two conditions must hold.", "a": {"steffan": "audio/steffan_35e31dbb1e2689a0.mp3", "guy": "audio/guy_5c36c06dc7fd8e66.mp3", "christopher": "audio/christopher_ee12375ddac0277f.mp3", "eric": "audio/eric_6e0f9737183241ec.mp3", "ava": "audio/ava_765df41ce70c89d6.mp3"}}, {"t": "The interaction must be shorter than the lifetimes of the levels, otherwise decay destroys the oscillation.", "a": {"steffan": "audio/steffan_122d3346706efdf7.mp3", "guy": "audio/guy_57bf16b174d30326.mp3", "christopher": "audio/christopher_7a8e42940920119e.mp3", "eric": "audio/eric_e42ae5efb863a95b.mp3", "ava": "audio/ava_832d794446fc7628.mp3"}}, {"t": "And the interaction must last at least one full oscillation period.", "a": {"steffan": "audio/steffan_3ff2591c104e00e2.mp3", "guy": "audio/guy_ad63862deafde92a.mp3", "christopher": "audio/christopher_47917ea7b64ee46b.mp3", "eric": "audio/eric_1bd0999d0ca1819d.mp3", "ava": "audio/ava_8d870e67db09daa4.mp3"}}, {"t": "For visible transitions, lifetimes are often in the nanosecond range, so we need a Rabi frequency of at least about ten to the nine per second.", "a": {"steffan": "audio/steffan_7aee19b4a78934c5.mp3", "guy": "audio/guy_326c5ac2f5ed3462.mp3", "christopher": "audio/christopher_342e6c9554bff67f.mp3", "eric": "audio/eric_9febe511c2ee590b.mp3", "ava": "audio/ava_da05acb90a0cedee.mp3"}}, {"t": "That needs a laser of a few tens of milliwatts, focused to about one square millimeter. It is possible, but it is technically hard.", "a": {"steffan": "audio/steffan_c466bc5f3bc87583.mp3", "guy": "audio/guy_9113d7cc28dc79dc.mp3", "christopher": "audio/christopher_1f044681a5ffa6e1.mp3", "eric": "audio/eric_508299ca64493195.mp3", "ava": "audio/ava_818ab676cffe500f.mp3"}}, {"t": "It is much easier with levels that practically do not decay, like the hyperfine levels of the caesium ground state.", "a": {"steffan": "audio/steffan_b1ac1bc92920a17b.mp3", "guy": "audio/guy_cfcc48fab3914f7f.mp3", "christopher": "audio/christopher_ec6c72688fce063a.mp3", "eric": "audio/eric_53dcf03285dddbd7.mp3", "ava": "audio/ava_7a60b9ca22f0790a.mp3"}}, {"t": "There, Rabi frequencies of the order of a hundred kilohertz are reached, and Rabi oscillations are measured routinely.", "a": {"steffan": "audio/steffan_c38f6480aa920b75.mp3", "guy": "audio/guy_d0c6e70084cc1e67.mp3", "christopher": "audio/christopher_8c6f292f8bb88084.mp3", "eric": "audio/eric_f974d01571e7d809.mp3", "ava": "audio/ava_606d50d995f99c3d.mp3"}}]}, {"title": "Pi and pi over two pulses as quantum gates", "items": [{"t": "On resonance, the state of the atom evolves in a fully controlled way.", "a": {"steffan": "audio/steffan_12e55d55fa1211ad.mp3", "guy": "audio/guy_790648a75dbbb6bc.mp3", "christopher": "audio/christopher_34c0f485c8c13efd.mp3", "eric": "audio/eric_227ff1f6f68d3419.mp3", "ava": "audio/ava_fcf0d69c75ff81d3.mp3"}}, {"t": "So by choosing how long we drive the atom, we choose exactly what state we end up with.", "a": {"steffan": "audio/steffan_25e53fae13180b39.mp3", "guy": "audio/guy_c9ce96785b5ba70e.mp3", "christopher": "audio/christopher_405f4824c204a732.mp3", "eric": "audio/eric_72793e1734e65dff.mp3", "ava": "audio/ava_c493ca4e15eceb8b.mp3"}}, {"t": "This is the idea behind light pulses as quantum gates.", "a": {"steffan": "audio/steffan_1b56d33a90c0f48a.mp3", "guy": "audio/guy_54e01d25f7567bed.mp3", "christopher": "audio/christopher_cfafb5c3fd9d4d35.mp3", "eric": "audio/eric_2d855c3d8e6b6083.mp3", "ava": "audio/ava_d8cc49b6de2ad87b.mp3"}}, {"t": "First, the pi pulse. We drive the atom for a time t pi, equal to pi over omega one.", "a": {"steffan": "audio/steffan_8438d01cefce0cf8.mp3", "guy": "audio/guy_0ccd82c4b1082ed0.mp3", "christopher": "audio/christopher_1ba610a7c0e858af.mp3", "eric": "audio/eric_12d4e3e58574e68d.mp3", "ava": "audio/ava_2a34618ee90cbce1.mp3"}}, {"t": "Then the argument of the sine is pi over two, so the probability to be in b is exactly one.", "a": {"steffan": "audio/steffan_3a86aa5fd721d373.mp3", "guy": "audio/guy_def5afb0c2a75428.mp3", "christopher": "audio/christopher_e5cb4a4a89a8ffc3.mp3", "eric": "audio/eric_6235f4693b0f64d6.mp3", "ava": "audio/ava_2b756b4593722dae.mp3"}}, {"t": "An atom in a goes to b, and an atom in b goes to a, up to phase factors.", "a": {"steffan": "audio/steffan_35b947509734baa0.mp3", "guy": "audio/guy_932083d9189d78af.mp3", "christopher": "audio/christopher_cff2e31146a82529.mp3", "eric": "audio/eric_1d5f11ed2c15ca04.mp3", "ava": "audio/ava_dd3478ab2102bb62.mp3"}}, {"t": "So the pi pulse swaps the two states. In quantum computing language, this is a NOT gate.", "a": {"steffan": "audio/steffan_37d15c56775bf8ec.mp3", "guy": "audio/guy_2ade6cd973b290a1.mp3", "christopher": "audio/christopher_aedabb8cf48e7564.mp3", "eric": "audio/eric_8947fdd3a9d9f902.mp3", "ava": "audio/ava_797c139d4a514f44.mp3"}}, {"t": "Next, the pi over two pulse. We drive for half as long, a time pi over two omega one.", "a": {"steffan": "audio/steffan_dd72c145c9bef3a8.mp3", "guy": "audio/guy_acf3ddf4579828af.mp3", "christopher": "audio/christopher_cab2b39cf9a65c43.mp3", "eric": "audio/eric_31dfc206dcb7b00b.mp3", "ava": "audio/ava_78987b7690cb7930.mp3"}}, {"t": "Now the probability to be in b is exactly one half.", "a": {"steffan": "audio/steffan_62fade3dd4aad860.mp3", "guy": "audio/guy_cdca1f1e6ccc3981.mp3", "christopher": "audio/christopher_3aa69aeeb460d3d0.mp3", "eric": "audio/eric_d715ca3b7ba62c3a.mp3", "ava": "audio/ava_217a98738e633d49.mp3"}}, {"t": "So an atom that starts in a ends up in an equal superposition of a and b, with equal weight in each state.", "a": {"steffan": "audio/steffan_f9da6952d6542a80.mp3", "guy": "audio/guy_282dcfd01a71527b.mp3", "christopher": "audio/christopher_5b0ffa2b830c19b7.mp3", "eric": "audio/eric_358a682878b0479f.mp3", "ava": "audio/ava_2c21bcd287b36b1e.mp3"}}, {"t": "Turning a basis state into an equal superposition is the job of the Hadamard gate, so the pi over two pulse plays this role.", "a": {"steffan": "audio/steffan_7575441ad44447c9.mp3", "guy": "audio/guy_ab2b09f75c62fc6f.mp3", "christopher": "audio/christopher_f33ef71f6957dd20.mp3", "eric": "audio/eric_50cdede3ef116700.mp3", "ava": "audio/ava_3e8c87910f6ffdc3.mp3"}}, {"t": "And the superposition is coherent: the two parts have a fixed phase relation, which is set by the phase of the light.", "a": {"steffan": "audio/steffan_0f6be71db8bc4d91.mp3", "guy": "audio/guy_aba00eeda35dd2e7.mp3", "christopher": "audio/christopher_a3a0c6219a3579e1.mp3", "eric": "audio/eric_6ad5faa2e0b18cf2.mp3", "ava": "audio/ava_d1b448909f5ac1c1.mp3"}}]}]}, {"num": "3.5", "name": "Coherences and selection rules", "sections": [{"title": "The Ramsey sequence", "items": [{"t": "The pi over two pulse is the building block of a very important technique, the Ramsey sequence.", "a": {"steffan": "audio/steffan_7f61723dde73509f.mp3", "guy": "audio/guy_2345a233d8683049.mp3", "christopher": "audio/christopher_e276d6be5e349af1.mp3", "eric": "audio/eric_d392e4d7dab1b80d.mp3", "ava": "audio/ava_5d29b3f97764d97f.mp3"}}, {"t": "It works like this: a pi over two pulse, then a waiting time T with no light, then a second pi over two pulse.", "a": {"steffan": "audio/steffan_9bb1951970c41b38.mp3", "guy": "audio/guy_c6b5be1a7d8e87e7.mp3", "christopher": "audio/christopher_b13887c9db7f185e.mp3", "eric": "audio/eric_b5b4419ae6d64aeb.mp3", "ava": "audio/ava_5838cf07251bea7c.mp3"}}, {"t": "The first pulse puts the atom into an equal superposition, and the phase of this superposition is set by the phase of the light.", "a": {"steffan": "audio/steffan_46f145d8ed4ca3ba.mp3", "guy": "audio/guy_d31ad03c8438b021.mp3", "christopher": "audio/christopher_ef9cbac2d7bd0a26.mp3", "eric": "audio/eric_9744a4c73d099e10.mp3", "ava": "audio/ava_e0989a867094d80a.mp3"}}, {"t": "During the waiting time, the atom evolves freely, and its phase advances at the atomic frequency, omega zero.", "a": {"steffan": "audio/steffan_757a1fb2604b4336.mp3", "guy": "audio/guy_a6ef3116074a8a64.mp3", "christopher": "audio/christopher_65dca37242a3bc92.mp3", "eric": "audio/eric_d02ee085527c51af.mp3", "ava": "audio/ava_a3250199d4bad215.mp3"}}, {"t": "The light, meanwhile, keeps its own phase advancing at its frequency, omega.", "a": {"steffan": "audio/steffan_116c3822626997c3.mp3", "guy": "audio/guy_cc80d44e9664ea11.mp3", "christopher": "audio/christopher_38211e44b2199a32.mp3", "eric": "audio/eric_a19b8a261baa5926.mp3", "ava": "audio/ava_7e29dac5628633fe.mp3"}}, {"t": "So over the waiting time, a phase difference builds up between the atom and the light. It is omega zero minus omega, times T.", "a": {"steffan": "audio/steffan_9b9f25e21a1e05f0.mp3", "guy": "audio/guy_97df71990a7d26db.mp3", "christopher": "audio/christopher_dfa5cb434d1aea9f.mp3", "eric": "audio/eric_c3501684e36f9566.mp3", "ava": "audio/ava_5d9cda126f0bdcbc.mp3"}}, {"t": "Then the second pulse acts, and the result depends on this phase difference.", "a": {"steffan": "audio/steffan_8bbc05009078466f.mp3", "guy": "audio/guy_4371b35c2b9dba1a.mp3", "christopher": "audio/christopher_25872963937a40a6.mp3", "eric": "audio/eric_7cf23a70138832c8.mp3", "ava": "audio/ava_3d4a8290f23b6464.mp3"}}, {"t": "If the phase difference is zero, or a whole multiple of two pi, the two pulses add up to a full pi pulse, and the atom ends up in b.", "a": {"steffan": "audio/steffan_2440b354ffc2f691.mp3", "guy": "audio/guy_f17404d633aeeea1.mp3", "christopher": "audio/christopher_ea2355cdf8445325.mp3", "eric": "audio/eric_6b5e525a560f8525.mp3", "ava": "audio/ava_f280b4d3e30e92a5.mp3"}}, {"t": "If the phase difference is pi, the second pulse undoes the first one, and the atom goes back to a.", "a": {"steffan": "audio/steffan_6305090e0541326e.mp3", "guy": "audio/guy_276fb827df2f0586.mp3", "christopher": "audio/christopher_e91bfea740100d86.mp3", "eric": "audio/eric_aa11583ff65d2916.mp3", "ava": "audio/ava_141a2e7cdb6052a8.mp3"}}, {"t": "So as we scan the light frequency, the probability to end up in b oscillates. These oscillations are called Ramsey fringes.", "a": {"steffan": "audio/steffan_9effff4296587c3f.mp3", "guy": "audio/guy_882968aa02fddae6.mp3", "christopher": "audio/christopher_e3354cbe98a3549f.mp3", "eric": "audio/eric_de0bd9acd45a11f9.mp3", "ava": "audio/ava_de71ee1642f84355.mp3"}}, {"t": "The spacing of the fringes is set by the waiting time T, not by the pulse length.", "a": {"steffan": "audio/steffan_d27c86b8ead9f316.mp3", "guy": "audio/guy_44e740878ed1fa3c.mp3", "christopher": "audio/christopher_b4fb7e2ba479dd44.mp3", "eric": "audio/eric_6d1e994ddfcd3585.mp3", "ava": "audio/ava_65ebf462ac786a03.mp3"}}, {"t": "So the central fringe gets narrower as T gets longer. For T equal to one second, its width is about one hertz.", "a": {"steffan": "audio/steffan_b334d28c035d5f08.mp3", "guy": "audio/guy_5838b32d55130fce.mp3", "christopher": "audio/christopher_eab9fa18e0979515.mp3", "eric": "audio/eric_5682425a5a3b544b.mp3", "ava": "audio/ava_1b3c09f1230251d7.mp3"}}, {"t": "This lets us find the atomic resonance much more precisely than with a single pulse.", "a": {"steffan": "audio/steffan_4a24349c3fd9e5b7.mp3", "guy": "audio/guy_963a11c88dd3cfbc.mp3", "christopher": "audio/christopher_3cd3959a3d8af50a.mp3", "eric": "audio/eric_0c1d30ba7c7e4d47.mp3", "ava": "audio/ava_cb140838caba235e.mp3"}}, {"t": "That is why caesium atomic clocks, which define the second, have used this method since the nineteen sixties.", "a": {"steffan": "audio/steffan_1617550c8e5aa6ba.mp3", "guy": "audio/guy_a143183b2792f96e.mp3", "christopher": "audio/christopher_d1f7a44d51bc4792.mp3", "eric": "audio/eric_52c39b06dd78bafe.mp3", "ava": "audio/ava_d5ce762fcc1de586.mp3"}}, {"t": "In a fountain clock, cold atoms are launched upward and fall back, passing through the microwave field twice, about one second apart.", "a": {"steffan": "audio/steffan_8e3c9a1f64f67649.mp3", "guy": "audio/guy_edb8a6fc66cb4b19.mp3", "christopher": "audio/christopher_2c6534ea3c469a9e.mp3", "eric": "audio/eric_80066c8fb3a3f08d.mp3", "ava": "audio/ava_8fd5f79c0d284c4d.mp3"}}]}, {"title": "The oscillating dipole of a superposition", "items": [{"t": "Now look at the atom right after a pi over two pulse, when the light is switched off.", "a": {"steffan": "audio/steffan_331119e56fac9786.mp3", "guy": "audio/guy_5bf4390958129a0e.mp3", "christopher": "audio/christopher_ddf2fc884bcef6f1.mp3", "eric": "audio/eric_1341acd55f1e3c6b.mp3", "ava": "audio/ava_1b2f2c598ac0a687.mp3"}}, {"t": "The probabilities of a and b stay at one half each, so it might seem that nothing happens.", "a": {"steffan": "audio/steffan_7214d783dbd27b9c.mp3", "guy": "audio/guy_d4b7a06e9ac546c4.mp3", "christopher": "audio/christopher_b0dad049657fc68b.mp3", "eric": "audio/eric_fe5d0befbead0e4e.mp3", "ava": "audio/ava_3030d53b5c6c524f.mp3"}}, {"t": "But something does happen: the dipole moment oscillates.", "a": {"steffan": "audio/steffan_694e0c4dbfe66df2.mp3", "guy": "audio/guy_3513fb221f479c40.mp3", "christopher": "audio/christopher_444fb71216de0a0d.mp3", "eric": "audio/eric_cece844c287c681f.mp3", "ava": "audio/ava_181ce91bfa58fed6.mp3"}}, {"t": "The expectation value of the dipole is minus d times the sine of omega zero t plus phi, where d is the dipole matrix element.", "a": {"steffan": "audio/steffan_c5f11e6f89201e03.mp3", "guy": "audio/guy_3df1418a82a86dcb.mp3", "christopher": "audio/christopher_58db652147f83916.mp3", "eric": "audio/eric_ff69d04edb1ab6cf.mp3", "ava": "audio/ava_c2178921ad0b23cc.mp3"}}, {"t": "So the dipole oscillates at the atomic frequency, with the largest amplitude possible, because the two states have equal weight.", "a": {"steffan": "audio/steffan_f6056393d59770c6.mp3", "guy": "audio/guy_0d6d3ec6fef9a36b.mp3", "christopher": "audio/christopher_be091dccf9f67cbd.mp3", "eric": "audio/eric_ea5a0cd4802e281c.mp3", "ava": "audio/ava_9e6dd0de734c8fb9.mp3"}}, {"t": "Remember that an atom in a stationary state has no dipole. The dipole only appears in a superposition.", "a": {"steffan": "audio/steffan_1f7cc41abffa30a7.mp3", "guy": "audio/guy_917551365acf1dbb.mp3", "christopher": "audio/christopher_963b59b9202f79f3.mp3", "eric": "audio/eric_3f329d53fdf0ffd2.mp3", "ava": "audio/ava_43bc7b1d4ddf3704.mp3"}}, {"t": "An oscillating dipole radiates, so the atom emits light at omega zero.", "a": {"steffan": "audio/steffan_bb1b0b6a31d625b2.mp3", "guy": "audio/guy_99f8cf382f050c8e.mp3", "christopher": "audio/christopher_3369d66787a79820.mp3", "eric": "audio/eric_17582498cd64d1bf.mp3", "ava": "audio/ava_7132dd2796f5c9a5.mp3"}}, {"t": "The phase of this oscillation is fixed by the phase of the light that prepared it.", "a": {"steffan": "audio/steffan_55a2fcda0b7e303b.mp3", "guy": "audio/guy_d4b3669bc28f0327.mp3", "christopher": "audio/christopher_2da170beb084ed76.mp3", "eric": "audio/eric_ad0c3f0b5054d613.mp3", "ava": "audio/ava_e8e272cf82b5e2bb.mp3"}}, {"t": "So if many atoms are prepared by the same pulse, they all emit in phase. This is coherent emission.", "a": {"steffan": "audio/steffan_80b01105c7f95bbe.mp3", "guy": "audio/guy_90823fd24d81294c.mp3", "christopher": "audio/christopher_5214a994bdab1bdb.mp3", "eric": "audio/eric_c354682953db7c04.mp3", "ava": "audio/ava_32125e26b0301c86.mp3"}}, {"t": "This is very different from spontaneous emission, where each atom emits with a random phase.", "a": {"steffan": "audio/steffan_d169dea033002b99.mp3", "guy": "audio/guy_ced39670a59f726f.mp3", "christopher": "audio/christopher_4f19e09d9f14175c.mp3", "eric": "audio/eric_4920f3d07759b513.mp3", "ava": "audio/ava_ca8350312eb50a68.mp3"}}, {"t": "Coherent emission shows up, for example, as emission in a well-defined direction.", "a": {"steffan": "audio/steffan_6f61804470124854.mp3", "guy": "audio/guy_11d52c6dec9cefe5.mp3", "christopher": "audio/christopher_8d2d4b7691828227.mp3", "eric": "audio/eric_62df6bcaff34082f.mp3", "ava": "audio/ava_bb63c7bc41dd5033.mp3"}}, {"t": "These effects, called coherent transients, only last for a time short compared to the lifetimes of the levels.", "a": {"steffan": "audio/steffan_8df2185b78f4817f.mp3", "guy": "audio/guy_e930b1897e6d968a.mp3", "christopher": "audio/christopher_d8ece2aad506888d.mp3", "eric": "audio/eric_a07ea88d11c3b0d6.mp3", "ava": "audio/ava_71785cd4bbf4b960.mp3"}}, {"t": "Superpositions like this are also the basic unit of quantum information, the qubit.", "a": {"steffan": "audio/steffan_21059deac3913d94.mp3", "guy": "audio/guy_5a540cae7c45a2b8.mp3", "christopher": "audio/christopher_c7f921b626f43da4.mp3", "eric": "audio/eric_79ecb04bef18a132.mp3", "ava": "audio/ava_74abb13dd16adea0.mp3"}}]}, {"title": "Coherence time and relaxation time", "items": [{"t": "The superposition does not live forever.", "a": {"steffan": "audio/steffan_bb259d215f422fad.mp3", "guy": "audio/guy_669bd14c4a1828a4.mp3", "christopher": "audio/christopher_1a71715b718957ba.mp3", "eric": "audio/eric_342c664e4bf88cb7.mp3", "ava": "audio/ava_720bab01a099f641.mp3"}}, {"t": "The fixed phase relation between a and b, which we call the coherence, decays exponentially, as e to the minus t over T two.", "a": {"steffan": "audio/steffan_40b9672281a9dcf4.mp3", "guy": "audio/guy_6c9a83cb429a0949.mp3", "christopher": "audio/christopher_6289c20123af0a7d.mp3", "eric": "audio/eric_c6e2a9f1eaa6f125.mp3", "ava": "audio/ava_825c48d9f40aaf26.mp3"}}, {"t": "T two is called the coherence time.", "a": {"steffan": "audio/steffan_a58528add08512ae.mp3", "guy": "audio/guy_5ae871cd707f1671.mp3", "christopher": "audio/christopher_45b8e0a4da824d93.mp3", "eric": "audio/eric_f1fbd016869bb277.mp3", "ava": "audio/ava_92356d6d2a3638d1.mp3"}}, {"t": "The populations also relax. If we invert the atom with a pi pulse, it decays back to the ground state as e to the minus t over T one.", "a": {"steffan": "audio/steffan_c2cc39e064a96681.mp3", "guy": "audio/guy_d8e579a0ec40b275.mp3", "christopher": "audio/christopher_015723dc32cb761b.mp3", "eric": "audio/eric_7822ee05ccabb9a0.mp3", "ava": "audio/ava_c9c00cfc401ef0cc.mp3"}}, {"t": "T one is called the relaxation time.", "a": {"steffan": "audio/steffan_3eae286c18e070c4.mp3", "guy": "audio/guy_d4628582b60c37ce.mp3", "christopher": "audio/christopher_0e30c24e99a63604.mp3", "eric": "audio/eric_11eb5993b834508f.mp3", "ava": "audio/ava_862f48aa804c21d3.mp3"}}, {"t": "So T one tells us how long the populations survive, and T two tells us how long the phase information survives.", "a": {"steffan": "audio/steffan_388e5b50af79ce48.mp3", "guy": "audio/guy_1f9cf0a8c328f65e.mp3", "christopher": "audio/christopher_26bcee34d45b2441.mp3", "eric": "audio/eric_9cfe85316b6b0a9c.mp3", "ava": "audio/ava_91afae8f40a61e01.mp3"}}]}, {"title": "Coherent population trapping", "items": [{"t": "Now we add a third level. The atom has two lower levels, a one and a two, and one excited level, b.", "a": {"steffan": "audio/steffan_30b89110ede0d39f.mp3", "guy": "audio/guy_9ab8e97c4002fd0f.mp3", "christopher": "audio/christopher_aee4fae762a1f67b.mp3", "eric": "audio/eric_5913b3b9236bc025.mp3", "ava": "audio/ava_a82cd076207922ff.mp3"}}, {"t": "This arrangement is called a lambda scheme, because the two transitions look like the Greek letter lambda.", "a": {"steffan": "audio/steffan_26b4bd46675a7c7b.mp3", "guy": "audio/guy_350276ced28dc95a.mp3", "christopher": "audio/christopher_761f5419228c2704.mp3", "eric": "audio/eric_e4d608678c0768cb.mp3", "ava": "audio/ava_141317b8020ad423.mp3"}}, {"t": "Light couples a one to b with Rabi frequency omega one, and a second light field couples a two to b with Rabi frequency omega two.", "a": {"steffan": "audio/steffan_b8878d1b875f89d5.mp3", "guy": "audio/guy_466fff0495a4ed27.mp3", "christopher": "audio/christopher_9d92edbf1a72d76a.mp3", "eric": "audio/eric_44c6d6140cc9379d.mp3", "ava": "audio/ava_33a18e1e18f82aad.mp3"}}, {"t": "Instead of a one and a two, we can use two other combinations of them as our basis.", "a": {"steffan": "audio/steffan_10f35ebf6835ae9b.mp3", "guy": "audio/guy_ed34bb8949b63327.mp3", "christopher": "audio/christopher_fb8d082b2945c029.mp3", "eric": "audio/eric_6fabfb29e87f1780.mp3", "ava": "audio/ava_868034128bf9cb8d.mp3"}}, {"t": "The first combination is omega one times a one plus omega two times a two, normalized. Its coupling to b is the square root of omega one squared plus omega two squared.", "a": {"steffan": "audio/steffan_4430097e1d714e44.mp3", "guy": "audio/guy_ea04d05f75c11da3.mp3", "christopher": "audio/christopher_e4e4515c2dec11a4.mp3", "eric": "audio/eric_9be103e2a42316dd.mp3", "ava": "audio/ava_4b9d1bef825c9f79.mp3"}}, {"t": "The second combination is omega two times a one minus omega one times a two, normalized. Its coupling to b is exactly zero.", "a": {"steffan": "audio/steffan_37f552b73788fb34.mp3", "guy": "audio/guy_79259b9f3db871ca.mp3", "christopher": "audio/christopher_4a118375246dd8a9.mp3", "eric": "audio/eric_f8c780930b49162f.mp3", "ava": "audio/ava_c20452b87fe45d01.mp3"}}, {"t": "Why zero? Because the two paths from this state up to b have equal size and opposite sign, so they cancel. This is destructive interference of the two transition amplitudes.", "a": {"steffan": "audio/steffan_0eb8615d1e65a7f8.mp3", "guy": "audio/guy_5082ee23bd6109d6.mp3", "christopher": "audio/christopher_23f9ef250895679b.mp3", "eric": "audio/eric_0841365e62841160.mp3", "ava": "audio/ava_a9668acf34c93f01.mp3"}}, {"t": "So the second combination does not interact with the light at all. It is called a dark state.", "a": {"steffan": "audio/steffan_a48a539ce34817e1.mp3", "guy": "audio/guy_91d56c1457275b2c.mp3", "christopher": "audio/christopher_159c38026894a0d3.mp3", "eric": "audio/eric_7bcb57d97d8d3bb2.mp3", "ava": "audio/ava_ad74985c6f80bf9d.mp3"}}, {"t": "Now, atoms that are excited to b decay by spontaneous emission, and some of them fall into the dark state.", "a": {"steffan": "audio/steffan_92a50e3b2d77849b.mp3", "guy": "audio/guy_839369916163487b.mp3", "christopher": "audio/christopher_0fbee6511f9305b1.mp3", "eric": "audio/eric_fae3c22599d97e5b.mp3", "ava": "audio/ava_622940ffc181293d.mp3"}}, {"t": "Once an atom is in the dark state, the light cannot excite it again.", "a": {"steffan": "audio/steffan_8ff1aa49eee2b81a.mp3", "guy": "audio/guy_23f4040d66cb36fe.mp3", "christopher": "audio/christopher_25145c7e10b1b1d2.mp3", "eric": "audio/eric_ec48df2579c81af2.mp3", "ava": "audio/ava_e675df571930d557.mp3"}}, {"t": "So after a few cycles, all the atoms end up trapped in the dark state. This is coherent population trapping.", "a": {"steffan": "audio/steffan_7347ff46e14b8391.mp3", "guy": "audio/guy_6a5f033437302412.mp3", "christopher": "audio/christopher_58dca107624e6c9d.mp3", "eric": "audio/eric_b7803d7bf5df39a8.mp3", "ava": "audio/ava_7f294ff482f80f29.mp3"}}, {"t": "The atoms then stop absorbing and stop fluorescing.", "a": {"steffan": "audio/steffan_37228fd85abd0380.mp3", "guy": "audio/guy_758913d938a0a140.mp3", "christopher": "audio/christopher_a6d6ef0992a603be.mp3", "eric": "audio/eric_36b62fd52a6a6fb9.mp3", "ava": "audio/ava_6d157a1e7adc6487.mp3"}}, {"t": "When a one and a two have different energies, this only works under one condition.", "a": {"steffan": "audio/steffan_196f7c912e6399b3.mp3", "guy": "audio/guy_b4de4ff9c5f91af9.mp3", "christopher": "audio/christopher_513cb41b6de66e3f.mp3", "eric": "audio/eric_0214e6227ac38023.mp3", "ava": "audio/ava_c37749920163d7e8.mp3"}}, {"t": "The difference of the two light frequencies must match the energy difference of a one and a two, divided by h bar.", "a": {"steffan": "audio/steffan_ef573db40bd53ab6.mp3", "guy": "audio/guy_a1cd3eb7b56c9221.mp3", "christopher": "audio/christopher_cb2acd475e515c02.mp3", "eric": "audio/eric_281287c0d5fb6f2d.mp3", "ava": "audio/ava_33e6a4de4aab74b2.mp3"}}, {"t": "This is a Raman resonance: both lasers have the same detuning from their transitions.", "a": {"steffan": "audio/steffan_50caca3253c61a45.mp3", "guy": "audio/guy_fd6775400c3b1806.mp3", "christopher": "audio/christopher_ac372f28ec430a31.mp3", "eric": "audio/eric_f8e41c3649bd3a35.mp3", "ava": "audio/ava_12178887425164fd.mp3"}}, {"t": "The phase of the trapped superposition is set by the relative phase of the two light fields, so the two lasers must keep a stable phase relation.", "a": {"steffan": "audio/steffan_8b27f850e3154ed8.mp3", "guy": "audio/guy_25d7fbcf8fa37285.mp3", "christopher": "audio/christopher_df8adf0ba1658ce3.mp3", "eric": "audio/eric_1cdef676222115ca.mp3", "ava": "audio/ava_f35314724143cbcd.mp3"}}]}, {"title": "Electromagnetically induced transparency", "items": [{"t": "Now keep the second field exactly on resonance, and scan the frequency of the first field.", "a": {"steffan": "audio/steffan_1723969a2ab670ec.mp3", "guy": "audio/guy_dc54f952bcb4bc97.mp3", "christopher": "audio/christopher_783f59b9dff23f05.mp3", "eric": "audio/eric_5cf0b1812c9e851b.mp3", "ava": "audio/ava_b940bedfc03ff882.mp3"}}, {"t": "Without the second field, the first field sees the usual Lorentzian absorption, and on resonance the medium absorbs strongly.", "a": {"steffan": "audio/steffan_d9ee7c6e4e9574cb.mp3", "guy": "audio/guy_398659a1625a4d12.mp3", "christopher": "audio/christopher_020123455a3d4c78.mp3", "eric": "audio/eric_f01cb80c7a4154c5.mp3", "ava": "audio/ava_4fd7c919d3364caf.mp3"}}, {"t": "With the second field on, a very narrow dip appears right at resonance. At that point, the absorption disappears.", "a": {"steffan": "audio/steffan_cdd23e8f09b28f3b.mp3", "guy": "audio/guy_814abf3229bbdc35.mp3", "christopher": "audio/christopher_4d9df6475e250d9a.mp3", "eric": "audio/eric_ff7cc8cae04684af.mp3", "ava": "audio/ava_7af33c1992df2d5f.mp3"}}, {"t": "The reason is coherent population trapping: exactly at resonance, the Raman condition is met, and the atoms sit in the dark state.", "a": {"steffan": "audio/steffan_67352aaf241d319d.mp3", "guy": "audio/guy_33bfd2dbaaf9ccb7.mp3", "christopher": "audio/christopher_6fff925ba58ae474.mp3", "eric": "audio/eric_467df6dd9dceae1f.mp3", "ava": "audio/ava_4bcf469c98dc03e2.mp3"}}, {"t": "So the medium becomes transparent exactly where it would normally absorb the most. This is electromagnetically induced transparency.", "a": {"steffan": "audio/steffan_ecbffc274ab9e4da.mp3", "guy": "audio/guy_17a6b033ffc9fa23.mp3", "christopher": "audio/christopher_f1b4a702ddd37670.mp3", "eric": "audio/eric_642269c75bcd78ac.mp3", "ava": "audio/ava_22740445c3236111.mp3"}}, {"t": "There is a second effect. Around this narrow dip, the refractive index changes very steeply with frequency.", "a": {"steffan": "audio/steffan_b48aa63b77d8dbca.mp3", "guy": "audio/guy_6e303a78fb3420f9.mp3", "christopher": "audio/christopher_9533b6166b68eb4e.mp3", "eric": "audio/eric_3ca8b9ca4b4e7bca.mp3", "ava": "audio/ava_ed1dd0181ee7067d.mp3"}}, {"t": "The group velocity of a light pulse is the speed of light divided by n plus omega times the derivative of n with respect to omega.", "a": {"steffan": "audio/steffan_588cc255e6c858a3.mp3", "guy": "audio/guy_4fbcdd469d9a49c9.mp3", "christopher": "audio/christopher_406339e7854c4050.mp3", "eric": "audio/eric_e49388b018d1d65b.mp3", "ava": "audio/ava_352a751f5dd9690d.mp3"}}, {"t": "So a very steep refractive index gives a very small group velocity.", "a": {"steffan": "audio/steffan_7ed1a2e5f830f9fe.mp3", "guy": "audio/guy_f44e305d3dcbe71e.mp3", "christopher": "audio/christopher_6470683e64ecdc55.mp3", "eric": "audio/eric_c27b74f914a95e33.mp3", "ava": "audio/ava_5b3b23a4545fa036.mp3"}}, {"t": "And because the medium is transparent there, the pulse is slowed down without being absorbed.", "a": {"steffan": "audio/steffan_cb5fca60b2816261.mp3", "guy": "audio/guy_01feeae70eb1755e.mp3", "christopher": "audio/christopher_9991171b88484429.mp3", "eric": "audio/eric_a3c4b37b2b2503d5.mp3", "ava": "audio/ava_62942ca3ff8f388b.mp3"}}, {"t": "In an experiment with cold sodium atoms, a light pulse was slowed to about thirty two meters per second, seven orders of magnitude below the speed of light.", "a": {"steffan": "audio/steffan_20a0dda4f92c943b.mp3", "guy": "audio/guy_2e50085158b5aa5c.mp3", "christopher": "audio/christopher_6ed85757ff0188f1.mp3", "eric": "audio/eric_fdfe5ebd1acd492a.mp3", "ava": "audio/ava_39d44ae3e7bcd52d.mp3"}}, {"t": "If the second field is switched off while the pulse is inside, the coherence stays stored in the atoms. Switching it back on releases the pulse again.", "a": {"steffan": "audio/steffan_7761c9c757da6793.mp3", "guy": "audio/guy_ed08b6cd1188a12a.mp3", "christopher": "audio/christopher_961deebf5b8c211b.mp3", "eric": "audio/eric_af2ae18ee3ffe4f0.mp3", "ava": "audio/ava_f972155ecdb8d60e.mp3"}}, {"t": "This is a way to store and read out light, which is interesting for quantum information.", "a": {"steffan": "audio/steffan_a83af8ce070334f0.mp3", "guy": "audio/guy_e67084d6457c629f.mp3", "christopher": "audio/christopher_255afebbc16cb06a.mp3", "eric": "audio/eric_82e6335730df9905.mp3", "ava": "audio/ava_22d22134154e30ac.mp3"}}]}, {"title": "Selection rules: forbidden transitions", "items": [{"t": "Let's come back to the question of which transitions light can drive.", "a": {"steffan": "audio/steffan_17035f5395253a27.mp3", "guy": "audio/guy_fff0b15456a0ba8f.mp3", "christopher": "audio/christopher_e5cda7bb86f269d2.mp3", "eric": "audio/eric_c555e0dbab86db23.mp3", "ava": "audio/ava_7e38a0fb1436ee81.mp3"}}, {"t": "A transition is forbidden if the matrix element of the interaction between the two states is zero.", "a": {"steffan": "audio/steffan_b80262e90a450b6e.mp3", "guy": "audio/guy_0975f9ee7e4bf0cd.mp3", "christopher": "audio/christopher_ee5d1b9ebd30fe0e.mp3", "eric": "audio/eric_7827b09ba99a7f6c.mp3", "ava": "audio/ava_948296eee2339e90.mp3"}}, {"t": "We already saw one case: two states with the same parity are not coupled by the electric dipole.", "a": {"steffan": "audio/steffan_f7ba2e6595428aec.mp3", "guy": "audio/guy_adfcce2913d94b5a.mp3", "christopher": "audio/christopher_352360ff306bbd8f.mp3", "eric": "audio/eric_e9ce77e35c583802.mp3", "ava": "audio/ava_9a632b32013b6e69.mp3"}}, {"t": "The same holds for the A dot p form of the interaction, because the momentum operator is also odd.", "a": {"steffan": "audio/steffan_7682cb16d6db46f1.mp3", "guy": "audio/guy_44d4dd1c85d911c0.mp3", "christopher": "audio/christopher_51505c88686fe7ce.mp3", "eric": "audio/eric_28dbda67610dd177.mp3", "ava": "audio/ava_abdd55fb0ed0a63a.mp3"}}, {"t": "Forbidden here only means forbidden for the electric dipole. The transition can still happen through the magnetic dipole, the electric quadrupole, or a multi-photon process, but these are much weaker.", "a": {"steffan": "audio/steffan_894d98a2bfc4a096.mp3", "guy": "audio/guy_d50b14f35a22fc48.mp3", "christopher": "audio/christopher_a62dce47de22d59f.mp3", "eric": "audio/eric_321f0788df0080c5.mp3", "ava": "audio/ava_4231aeb40fecb6ea.mp3"}}, {"t": "Now we find more selection rules, and these depend on the polarization of the light.", "a": {"steffan": "audio/steffan_998b3f6de05e4895.mp3", "guy": "audio/guy_0a0d165bc6b84c8e.mp3", "christopher": "audio/christopher_da137f0cf3edbd33.mp3", "eric": "audio/eric_ff1fbac0491cc300.mp3", "ava": "audio/ava_076daacf031864c0.mp3"}}]}, {"title": "Linearly polarized light: pi transitions", "items": [{"t": "Take a hydrogen-like atom. Its states are labeled by n, l, and m.", "a": {"steffan": "audio/steffan_db25d281cd58540e.mp3", "guy": "audio/guy_1cffa78abfcec7aa.mp3", "christopher": "audio/christopher_026fb15f6b86c7a2.mp3", "eric": "audio/eric_082d4e2011add22a.mp3", "ava": "audio/ava_c9a8117dff704655.mp3"}}, {"t": "Here l is the orbital angular momentum, and m is its projection on the z axis, which we call the quantization axis.", "a": {"steffan": "audio/steffan_edc6de85208d77f7.mp3", "guy": "audio/guy_aa8e977d2986d91f.mp3", "christopher": "audio/christopher_6b84dff88cd5def0.mp3", "eric": "audio/eric_b77bffa14f3a5280.mp3", "ava": "audio/ava_76a43e2f26fd1397.mp3"}}, {"t": "The wave function splits into a radial part and an angular part, and the angular part is a spherical harmonic.", "a": {"steffan": "audio/steffan_3033b0d5987ebc27.mp3", "guy": "audio/guy_86e47423516369e5.mp3", "christopher": "audio/christopher_832a371a0fc53e6d.mp3", "eric": "audio/eric_030a8b5e66e4c212.mp3", "ava": "audio/ava_70933eb04212cd40.mp3"}}, {"t": "Now let the light be linearly polarized along z. Then the dipole matrix element contains the coordinate z.", "a": {"steffan": "audio/steffan_30f40f5513550516.mp3", "guy": "audio/guy_254ebc385dd44015.mp3", "christopher": "audio/christopher_477f6bd8d5564ad5.mp3", "eric": "audio/eric_91ad32083c88995f.mp3", "ava": "audio/ava_f6486bdd296479e4.mp3"}}, {"t": "The coordinate z is r times the cosine of theta, and this is proportional to the spherical harmonic with l equal to one and m equal to zero.", "a": {"steffan": "audio/steffan_71c6ebb00f4e2b19.mp3", "guy": "audio/guy_4b695e9e0cb0c8c2.mp3", "christopher": "audio/christopher_f0ff0f269600eb2a.mp3", "eric": "audio/eric_d20048f2c116cf44.mp3", "ava": "audio/ava_02f9877ffc0b3262.mp3"}}, {"t": "Start from the ground state, where l and m are both zero.", "a": {"steffan": "audio/steffan_025d3bf0e49982a6.mp3", "guy": "audio/guy_94fa14f9fe46ea04.mp3", "christopher": "audio/christopher_34975a7936daa568.mp3", "eric": "audio/eric_10515e36afedc405.mp3", "ava": "audio/ava_c503b132d7b2d43e.mp3"}}, {"t": "The angular integral then becomes an overlap of two spherical harmonics, and spherical harmonics are orthogonal.", "a": {"steffan": "audio/steffan_e86fd86d1441e622.mp3", "guy": "audio/guy_5ddcbc522c9bbcde.mp3", "christopher": "audio/christopher_6e45cd6f74cc20b5.mp3", "eric": "audio/eric_67072e0c7ee481b6.mp3", "ava": "audio/ava_a1b18395a3fa6f4d.mp3"}}, {"t": "So the integral is only nonzero if the final state has l equal to one and m equal to zero.", "a": {"steffan": "audio/steffan_ad35d467c5675a80.mp3", "guy": "audio/guy_df6b5463124d352e.mp3", "christopher": "audio/christopher_2f61448ea20ae9e5.mp3", "eric": "audio/eric_aaa57b3ccdcfe4f0.mp3", "ava": "audio/ava_05b8bf55fd2620e3.mp3"}}, {"t": "In general, for light polarized along the quantization axis, l must change by plus or minus one, and m must stay the same.", "a": {"steffan": "audio/steffan_723e5c9b441b0e97.mp3", "guy": "audio/guy_9bbc362932566d03.mp3", "christopher": "audio/christopher_d3bf5aab36471dfc.mp3", "eric": "audio/eric_5c756c3fc05a5c19.mp3", "ava": "audio/ava_7f63b4255d2ca728.mp3"}}, {"t": "These are called pi transitions.", "a": {"steffan": "audio/steffan_ef3dd63ab849cf64.mp3", "guy": "audio/guy_cd89179c65626a82.mp3", "christopher": "audio/christopher_f5f7236ee9ff16b7.mp3", "eric": "audio/eric_90e0ab21a725059d.mp3", "ava": "audio/ava_af84005e832a5080.mp3"}}, {"t": "For atoms with many electrons, we use the total angular momentum J. Then J changes by plus one, minus one, or zero, and m stays the same.", "a": {"steffan": "audio/steffan_16094fc211ab92b5.mp3", "guy": "audio/guy_aae862c6ea956c2f.mp3", "christopher": "audio/christopher_bfe45aab60acf8e5.mp3", "eric": "audio/eric_84014dfdf37bda81.mp3", "ava": "audio/ava_c53ada4ccc4164c4.mp3"}}, {"t": "Physically, this is conservation of angular momentum: a photon polarized along z carries zero angular momentum along z.", "a": {"steffan": "audio/steffan_73f183f380988853.mp3", "guy": "audio/guy_d9959392a331f11f.mp3", "christopher": "audio/christopher_e84457d38e1eafdc.mp3", "eric": "audio/eric_054f45cf04b18de7.mp3", "ava": "audio/ava_f5d415707ed304c7.mp3"}}, {"t": "Note that a wave polarized along z must travel perpendicular to z.", "a": {"steffan": "audio/steffan_a3dae17e0e111abd.mp3", "guy": "audio/guy_6b31eeeecd108643.mp3", "christopher": "audio/christopher_a4c2011d3d1aa78e.mp3", "eric": "audio/eric_d049d14ef8a7ecd5.mp3", "ava": "audio/ava_98f91641e805ea8d.mp3"}}]}, {"title": "Circularly polarized light: sigma transitions", "items": [{"t": "Now let the light be circularly polarized, with its field rotating in the x y plane around the z axis.", "a": {"steffan": "audio/steffan_b82990682c9bcb85.mp3", "guy": "audio/guy_6664eb0bcf340712.mp3", "christopher": "audio/christopher_a401aff4d1848a6a.mp3", "eric": "audio/eric_7c9b2107d1713408.mp3", "ava": "audio/ava_e5ecd729d635d970.mp3"}}, {"t": "If it rotates in the right-handed sense around z, it is called sigma plus. If it rotates the other way, it is sigma minus.", "a": {"steffan": "audio/steffan_be905a43702cdc19.mp3", "guy": "audio/guy_abc714faceae75b7.mp3", "christopher": "audio/christopher_7938d7764fedd1a8.mp3", "eric": "audio/eric_c922bee16734bb63.mp3", "ava": "audio/ava_c5e4cc2bc9041674.mp3"}}, {"t": "For sigma plus light, the dipole matrix element contains x plus i y.", "a": {"steffan": "audio/steffan_84259d0c8deb2ad8.mp3", "guy": "audio/guy_d1a97cb9178b4a61.mp3", "christopher": "audio/christopher_0ac066af14709b79.mp3", "eric": "audio/eric_311cc95a5cd24b23.mp3", "ava": "audio/ava_ea7d20642c0b0c8d.mp3"}}, {"t": "And x plus i y is proportional to the spherical harmonic with l equal to one and m equal to plus one.", "a": {"steffan": "audio/steffan_2dda87ec4901e7a7.mp3", "guy": "audio/guy_f289276a517d66bf.mp3", "christopher": "audio/christopher_8159cd52f8047701.mp3", "eric": "audio/eric_38e6680e14a65317.mp3", "ava": "audio/ava_4b0e6b004d2fd8c6.mp3"}}, {"t": "So from the ground state, sigma plus light can only reach the state with l equal to one and m equal to plus one.", "a": {"steffan": "audio/steffan_1600e9e3734957d9.mp3", "guy": "audio/guy_575a1d9b2ccbbd52.mp3", "christopher": "audio/christopher_8752a5924690ec93.mp3", "eric": "audio/eric_a04a15d192641288.mp3", "ava": "audio/ava_54d76d8d76bdb28f.mp3"}}, {"t": "In general, when a sigma plus photon is absorbed, l changes by plus or minus one, and m increases by one.", "a": {"steffan": "audio/steffan_7f0f2f2a4f66e9f7.mp3", "guy": "audio/guy_aae93b144c36f59a.mp3", "christopher": "audio/christopher_d4af91f9397fea0a.mp3", "eric": "audio/eric_6457305f4637f04d.mp3", "ava": "audio/ava_57ffe1dbb731873c.mp3"}}, {"t": "For sigma minus light, l changes by plus or minus one, and m decreases by one.", "a": {"steffan": "audio/steffan_fdeda23e6fbf757d.mp3", "guy": "audio/guy_48bde1bff414c91a.mp3", "christopher": "audio/christopher_961ad8d1ed7cdf02.mp3", "eric": "audio/eric_ce65fc591e1dcc1c.mp3", "ava": "audio/ava_4246851488f49145.mp3"}}, {"t": "Again, this is conservation of angular momentum: a sigma plus photon carries plus h bar of angular momentum along z, and a sigma minus photon carries minus h bar.", "a": {"steffan": "audio/steffan_49866251de35ffed.mp3", "guy": "audio/guy_902e58830342ad02.mp3", "christopher": "audio/christopher_a6ab7e52b8f57875.mp3", "eric": "audio/eric_4be4862ad1bdb097.mp3", "ava": "audio/ava_b3f527ce3c3c0636.mp3"}}, {"t": "Linearly polarized light perpendicular to z is a superposition of sigma plus and sigma minus.", "a": {"steffan": "audio/steffan_e5f628b441990257.mp3", "guy": "audio/guy_9fbd661ce8f94dfd.mp3", "christopher": "audio/christopher_600f0e60fa82a0b0.mp3", "eric": "audio/eric_6d8d352704350db6.mp3", "ava": "audio/ava_d9050b87ed8a82f0.mp3"}}, {"t": "So if we choose the quantization axis along the direction the light travels, linear polarization always acts as sigma, never as pi.", "a": {"steffan": "audio/steffan_cafcc9b19df276b7.mp3", "guy": "audio/guy_304d57703b7228ab.mp3", "christopher": "audio/christopher_59087f6e54116f1d.mp3", "eric": "audio/eric_5109f8ec34c7395a.mp3", "ava": "audio/ava_cf2cf942c99ddf5e.mp3"}}]}, {"title": "Spontaneous emission from pi and sigma transitions", "items": [{"t": "The same rules hold for spontaneous emission: J changes by plus one, minus one, or zero.", "a": {"steffan": "audio/steffan_3206c75932cc35d9.mp3", "guy": "audio/guy_9e1fb0a31515f225.mp3", "christopher": "audio/christopher_bc09cd09b95f6650.mp3", "eric": "audio/eric_1c214064cf69ea36.mp3", "ava": "audio/ava_87ae4a3e2c47c8ff.mp3"}}, {"t": "In a pi transition, m stays the same. In a sigma transition, m changes by one.", "a": {"steffan": "audio/steffan_986a51bc4795207b.mp3", "guy": "audio/guy_cb49f9873699cb12.mp3", "christopher": "audio/christopher_7ce6c0ad50ea9c7a.mp3", "eric": "audio/eric_af5e842b361f4f3b.mp3", "ava": "audio/ava_918adede9c50189d.mp3"}}, {"t": "The emitted light looks exactly like the light of a classical dipole.", "a": {"steffan": "audio/steffan_f33a35872e92f366.mp3", "guy": "audio/guy_cc6fe1ed73aa1a85.mp3", "christopher": "audio/christopher_682adb5b5fa621f3.mp3", "eric": "audio/eric_9b88af13ca7745b3.mp3", "ava": "audio/ava_dc5a75f1adf16783.mp3"}}, {"t": "For a pi transition, the classical picture is a dipole oscillating along z.", "a": {"steffan": "audio/steffan_91272c100de20c3e.mp3", "guy": "audio/guy_a0e2dbe55025acff.mp3", "christopher": "audio/christopher_3cbfe8c12ba6b86a.mp3", "eric": "audio/eric_009b148f229605e8.mp3", "ava": "audio/ava_a9dcf762d379c238.mp3"}}, {"t": "Such a dipole does not emit along z at all. It emits most strongly perpendicular to z, and the angular pattern goes as sine squared theta.", "a": {"steffan": "audio/steffan_b92d7b0c863d2d59.mp3", "guy": "audio/guy_68301e20dae2cd2e.mp3", "christopher": "audio/christopher_67c64ac2dd3d3aca.mp3", "eric": "audio/eric_b373d0ddfeeab02e.mp3", "ava": "audio/ava_37b63e436c9c8274.mp3"}}, {"t": "The emitted light is linearly polarized, along the projection of the z axis.", "a": {"steffan": "audio/steffan_633aa36549e768a9.mp3", "guy": "audio/guy_f7f7a3433642e552.mp3", "christopher": "audio/christopher_eadb07abfce1519a.mp3", "eric": "audio/eric_24d73c4535064689.mp3", "ava": "audio/ava_f87c35d97697f480.mp3"}}, {"t": "For a sigma transition, the classical picture is a dipole rotating in the x y plane.", "a": {"steffan": "audio/steffan_54e67d033f9be330.mp3", "guy": "audio/guy_896a60481107171e.mp3", "christopher": "audio/christopher_ddf4124e5ac3c140.mp3", "eric": "audio/eric_ee3cf17cc5fd692e.mp3", "ava": "audio/ava_3366cc8a7c84e76e.mp3"}}, {"t": "Along z, the emitted light is circularly polarized, in the same sense as the rotation.", "a": {"steffan": "audio/steffan_e0ad88cdd49525cc.mp3", "guy": "audio/guy_6ee2d96691961cba.mp3", "christopher": "audio/christopher_6c16fd0e6f9d89a6.mp3", "eric": "audio/eric_d35eafa798f7e821.mp3", "ava": "audio/ava_d04d537e089ebde8.mp3"}}, {"t": "Perpendicular to z, the emitted light is linearly polarized, in the x y plane.", "a": {"steffan": "audio/steffan_09dd437f8872a3d6.mp3", "guy": "audio/guy_3ec281659cad3984.mp3", "christopher": "audio/christopher_187a115e86464fc1.mp3", "eric": "audio/eric_606084684e7b1571.mp3", "ava": "audio/ava_a6c6b3af26cc9b23.mp3"}}, {"t": "In all other directions, the light is elliptically polarized.", "a": {"steffan": "audio/steffan_95921dad0c9bab48.mp3", "guy": "audio/guy_5a649e9604400e9b.mp3", "christopher": "audio/christopher_bbdf806708ec5163.mp3", "eric": "audio/eric_bfdc4ef10c9d57e1.mp3", "ava": "audio/ava_829e4ffc965ddb4e.mp3"}}, {"t": "So by looking at the direction and the polarization of the emitted light, we can tell which transition it came from.", "a": {"steffan": "audio/steffan_09df49acdbf7c3bf.mp3", "guy": "audio/guy_6ff9216e949503c7.mp3", "christopher": "audio/christopher_8c0e583fca5c4d8d.mp3", "eric": "audio/eric_0d25f14ace10c26e.mp3", "ava": "audio/ava_08d278ce153d7c8d.mp3"}}]}]}, {"num": "4", "name": "Levels with finite lifetimes", "sections": [{"title": "Why finite lifetimes matter", "items": [{"t": "So far, both levels lived forever. In reality, they do not.", "a": {"steffan": "audio/steffan_b79fe51df0705a80.mp3", "guy": "audio/guy_af10ae3f30e3fe78.mp3", "christopher": "audio/christopher_0e4631c61b51f945.mp3", "eric": "audio/eric_3336e27eae8fb394.mp3", "ava": "audio/ava_7485ca70bb189395.mp3"}}, {"t": "The upper level can decay by spontaneous emission. Atoms can also lose their state through collisions, or simply by flying out of the laser beam.", "a": {"steffan": "audio/steffan_20816a4cb8619820.mp3", "guy": "audio/guy_0d9e30ba24b8dbbd.mp3", "christopher": "audio/christopher_06538078e45b33e7.mp3", "eric": "audio/eric_798e1103e33ae369.mp3", "ava": "audio/ava_b64068e9e2f84750.mp3"}}, {"t": "So now we give both levels a finite lifetime, tau, which means a decay rate, gamma D, equal to one over tau.", "a": {"steffan": "audio/steffan_b5e54f407b1b8d8b.mp3", "guy": "audio/guy_7a3f369391bd24f2.mp3", "christopher": "audio/christopher_4a8f934385411736.mp3", "eric": "audio/eric_45c5242030231f81.mp3", "ava": "audio/ava_7a85f9d83acc5312.mp3"}}, {"t": "To keep things simple, both levels get the same decay rate.", "a": {"steffan": "audio/steffan_f4d08f26b1f0f12d.mp3", "guy": "audio/guy_014899b69648139a.mp3", "christopher": "audio/christopher_eb312b61d4a9f389.mp3", "eric": "audio/eric_8e38285d7f7dcee9.mp3", "ava": "audio/ava_5c618a00a2acc031.mp3"}}, {"t": "We now look at a whole ensemble of atoms. N a atoms are in level a, N b atoms are in level b, and the total is N.", "a": {"steffan": "audio/steffan_84d42d90311fc4fc.mp3", "guy": "audio/guy_ddc2a829011164b2.mp3", "christopher": "audio/christopher_f9a9fca3276292ce.mp3", "eric": "audio/eric_d3f0ac01d43b69a3.mp3", "ava": "audio/ava_57b1430fcf86cb0f.mp3"}}, {"t": "If atoms only disappear, the ensemble would soon be empty. So we keep feeding new atoms into level a, at a rate lambda a.", "a": {"steffan": "audio/steffan_9e2e808942e04f30.mp3", "guy": "audio/guy_e73a9245d746ed26.mp3", "christopher": "audio/christopher_8d2ccf2edea19d89.mp3", "eric": "audio/eric_9edbb937897ba69a.mp3", "ava": "audio/ava_871625649eef6eb9.mp3"}}, {"t": "Level a gains atoms from the feeding and loses them by decay. Level b only loses them by decay.", "a": {"steffan": "audio/steffan_922bd737af9a649b.mp3", "guy": "audio/guy_96c018945900e307.mp3", "christopher": "audio/christopher_2fe4a993af7f21f6.mp3", "eric": "audio/eric_d8e5e662666bc57f.mp3", "ava": "audio/ava_17c073dd0d433e9f.mp3"}}, {"t": "In steady state, the feeding exactly balances the total loss, so lambda a equals gamma D times N.", "a": {"steffan": "audio/steffan_8c3a59655d471180.mp3", "guy": "audio/guy_109a7d0a56c0c793.mp3", "christopher": "audio/christopher_4f36971794f0756d.mp3", "eric": "audio/eric_4d7e1c24170a589b.mp3", "ava": "audio/ava_63e66dbc2a730638.mp3"}}, {"t": "Because both levels decay at the same rate, this holds no matter what the light is doing.", "a": {"steffan": "audio/steffan_3e7d51ef4c617108.mp3", "guy": "audio/guy_7cab8f8e54043e22.mp3", "christopher": "audio/christopher_0c3d630be315457f.mp3", "eric": "audio/eric_a1dd70583fdfd17d.mp3", "ava": "audio/ava_8ac90dc2d5ae616f.mp3"}}]}, {"title": "How many atoms are excited", "items": [{"t": "Now we shine the light on the atoms and ask: how many atoms are in level b at a given time t?", "a": {"steffan": "audio/steffan_89efa17577120254.mp3", "guy": "audio/guy_541d5961e3731935.mp3", "christopher": "audio/christopher_90f60dff7412bf79.mp3", "eric": "audio/eric_d69ea2ce53a601f3.mp3", "ava": "audio/ava_5b99d8bf82185e85.mp3"}}, {"t": "Think about one atom that entered level a at an earlier time, t zero.", "a": {"steffan": "audio/steffan_93a7e4529c800339.mp3", "guy": "audio/guy_6489ada337349548.mp3", "christopher": "audio/christopher_504b40a9393cf063.mp3", "eric": "audio/eric_7fa976cb26894493.mp3", "ava": "audio/ava_4bf0f60f65c4469b.mp3"}}, {"t": "Two things decide whether it is in level b at time t.", "a": {"steffan": "audio/steffan_546fb50b32116d09.mp3", "guy": "audio/guy_ced60b96bf1bbe40.mp3", "christopher": "audio/christopher_abb76ff8816a9c51.mp3", "eric": "audio/eric_b47419e411dc4f1d.mp3", "ava": "audio/ava_67caeb83ab83aff1.mp3"}}, {"t": "First, the light must have moved it to b. That probability is the Rabi formula.", "a": {"steffan": "audio/steffan_5b519c4863370823.mp3", "guy": "audio/guy_c227da6f9ebc64f0.mp3", "christopher": "audio/christopher_7c557b66d66cf31f.mp3", "eric": "audio/eric_a8d9105bcf4efe2f.mp3", "ava": "audio/ava_e3db3dba630401e3.mp3"}}, {"t": "Second, the atom must still exist. That survival probability is e to the minus gamma D times t minus t zero.", "a": {"steffan": "audio/steffan_1c6bc77a4d57e36f.mp3", "guy": "audio/guy_351e6048265c48bb.mp3", "christopher": "audio/christopher_2aabc5f5ee7955b5.mp3", "eric": "audio/eric_b2e08c6955b8db1a.mp3", "ava": "audio/ava_1fef06e4c16ebc84.mp3"}}, {"t": "New atoms arrive all the time, so we add up the contributions of all atoms that entered at all earlier times.", "a": {"steffan": "audio/steffan_1fc0dde4519eb5a9.mp3", "guy": "audio/guy_16c862d5f1737297.mp3", "christopher": "audio/christopher_3d2400b286cf6b3d.mp3", "eric": "audio/eric_22a3469d41a7d991.mp3", "ava": "audio/ava_728d84d69e4162b6.mp3"}}, {"t": "This sum is an integral over t zero.", "a": {"steffan": "audio/steffan_ba8561a1ca26f36f.mp3", "guy": "audio/guy_e4068c1b148fe770.mp3", "christopher": "audio/christopher_fafbd45968e9fbfb.mp3", "eric": "audio/eric_c8964baf30e73904.mp3", "ava": "audio/ava_0ffc65258fcf759f.mp3"}}, {"t": "Here is the key idea: every atom has a different age, so each one is at a different point of its Rabi oscillation.", "a": {"steffan": "audio/steffan_d1c3a08bcd26c765.mp3", "guy": "audio/guy_91771873ef8cf18a.mp3", "christopher": "audio/christopher_ff7518c042164d08.mp3", "eric": "audio/eric_6f15da383995cdbe.mp3", "ava": "audio/ava_6bbb67213ed9d7f1.mp3"}}, {"t": "When we add them all up, the oscillations wash out, and we get a steady number of excited atoms.", "a": {"steffan": "audio/steffan_2591f496f6fece77.mp3", "guy": "audio/guy_51a1af707a50f9fd.mp3", "christopher": "audio/christopher_885e9b6fe302a1af.mp3", "eric": "audio/eric_6c63aa3dcdf1f500.mp3", "ava": "audio/ava_5e2cf371f2fb374e.mp3"}}, {"t": "The result is: N b equals N over two, times omega one squared, divided by delta squared plus gamma D squared plus omega one squared.", "a": {"steffan": "audio/steffan_8d56f7a6544c2b87.mp3", "guy": "audio/guy_8d8060ae0b8d5558.mp3", "christopher": "audio/christopher_224aaf4e6dde20ad.mp3", "eric": "audio/eric_a9c414d14f0ac9ce.mp3", "ava": "audio/ava_b372247a4b8ed148.mp3"}}]}, {"title": "The line shape and power broadening", "items": [{"t": "As a function of the light frequency, this is a Lorentzian centered at omega zero.", "a": {"steffan": "audio/steffan_af862d1d1a051343.mp3", "guy": "audio/guy_9eb811d90cb209c0.mp3", "christopher": "audio/christopher_294b62e8ad6f51df.mp3", "eric": "audio/eric_c676978cd073f606.mp3", "ava": "audio/ava_d16a30d763436a81.mp3"}}, {"t": "Its half width is the square root of gamma D squared plus omega one squared.", "a": {"steffan": "audio/steffan_50ab72a88750caa6.mp3", "guy": "audio/guy_4593b96aafd4e0e8.mp3", "christopher": "audio/christopher_aeff00f33cc7b317.mp3", "eric": "audio/eric_1b54a8afd45ed29d.mp3", "ava": "audio/ava_7f74080929a35107.mp3"}}, {"t": "So there are two contributions to the width.", "a": {"steffan": "audio/steffan_fec227f3098e0abd.mp3", "guy": "audio/guy_8dba032d85540a15.mp3", "christopher": "audio/christopher_cb8b86eda05c79d3.mp3", "eric": "audio/eric_cdc699e5389c2bb3.mp3", "ava": "audio/ava_be8c33df39c5643a.mp3"}}, {"t": "Gamma D comes from the finite lifetime. It is there even with very weak light.", "a": {"steffan": "audio/steffan_f89f8bbee7636db4.mp3", "guy": "audio/guy_efdd3bc83dd6616a.mp3", "christopher": "audio/christopher_db84d7291e79e15d.mp3", "eric": "audio/eric_bb3ac925f50f2b7d.mp3", "ava": "audio/ava_fe5cee5d890c028d.mp3"}}, {"t": "Omega one comes from the drive itself. It grows with the light intensity.", "a": {"steffan": "audio/steffan_028fa17b593725b8.mp3", "guy": "audio/guy_9fd339f0078e1ea7.mp3", "christopher": "audio/christopher_63cd3add57e175a0.mp3", "eric": "audio/eric_b1c095d424b6e77f.mp3", "ava": "audio/ava_d7237028eadd1a18.mp3"}}, {"t": "So a stronger laser gives a wider line. This is again power broadening, now together with the lifetime.", "a": {"steffan": "audio/steffan_3ad9b9d8e26a6427.mp3", "guy": "audio/guy_adc5ddb9c4726add.mp3", "christopher": "audio/christopher_974409affb8535d7.mp3", "eric": "audio/eric_53b0d951fd39da5e.mp3", "ava": "audio/ava_5efa1839e8c39967.mp3"}}, {"t": "At very low intensity, omega one can be neglected, and the full width at half maximum is just two gamma D.", "a": {"steffan": "audio/steffan_80f3349cbbc97a47.mp3", "guy": "audio/guy_5b154ff22e47cedf.mp3", "christopher": "audio/christopher_783dffd6ee6fe7e8.mp3", "eric": "audio/eric_4293734b85f174db.mp3", "ava": "audio/ava_3c07efd8bf0d65d1.mp3"}}]}, {"title": "Saturation", "items": [{"t": "Now we define the saturation parameter, s.", "a": {"steffan": "audio/steffan_2ab73f542b8ce5b5.mp3", "guy": "audio/guy_8960031b0afb469e.mp3", "christopher": "audio/christopher_4af29eab4b4843db.mp3", "eric": "audio/eric_223b090374603999.mp3", "ava": "audio/ava_c9c6104b058140b7.mp3"}}, {"t": "It is omega one squared, divided by delta squared plus gamma D squared.", "a": {"steffan": "audio/steffan_399a3987aa5fc7d5.mp3", "guy": "audio/guy_496db8d3c88f3587.mp3", "christopher": "audio/christopher_9b6b58c25675f43e.mp3", "eric": "audio/eric_1758a72283d30832.mp3", "ava": "audio/ava_063e26da600fed5c.mp3"}}, {"t": "Since omega one squared is proportional to the intensity, s is proportional to the light intensity.", "a": {"steffan": "audio/steffan_459c0c9da9feccc1.mp3", "guy": "audio/guy_7591704151b08f49.mp3", "christopher": "audio/christopher_df2fbb9b4bd4d9ca.mp3", "eric": "audio/eric_b46a43469df21c5f.mp3", "ava": "audio/ava_2df2a01930fe227b.mp3"}}, {"t": "With this, the result becomes very compact: N b equals N over two, times s over one plus s.", "a": {"steffan": "audio/steffan_a7eeb13423537165.mp3", "guy": "audio/guy_570eadbe29fb5d90.mp3", "christopher": "audio/christopher_433b6893f35dc610.mp3", "eric": "audio/eric_55d745b4e9470cde.mp3", "ava": "audio/ava_8c7dea71a5239760.mp3"}}, {"t": "Look at the two limits.", "a": {"steffan": "audio/steffan_6737b5e56928a387.mp3", "guy": "audio/guy_d1da1bc863860807.mp3", "christopher": "audio/christopher_afb1484579cb2eff.mp3", "eric": "audio/eric_694777805760aeaa.mp3", "ava": "audio/ava_d97d2265797d2eef.mp3"}}, {"t": "If s is much smaller than one, the light is weak. Then N b is about N over two times s, so the number of excited atoms grows linearly with intensity.", "a": {"steffan": "audio/steffan_f68cfbc800501b01.mp3", "guy": "audio/guy_d698d1ce09cedfc5.mp3", "christopher": "audio/christopher_aecf85fda9392e39.mp3", "eric": "audio/eric_d70ef4d7340fe421.mp3", "ava": "audio/ava_67c21a7a6b755783.mp3"}}, {"t": "If s is much larger than one, the light is strong. Then s over one plus s goes to one, and N b goes to N over two.", "a": {"steffan": "audio/steffan_148886aed6ff15b7.mp3", "guy": "audio/guy_ed9cbf8145a184a2.mp3", "christopher": "audio/christopher_4358a35ee69346e1.mp3", "eric": "audio/eric_7bf3b4f2108a38ba.mp3", "ava": "audio/ava_887dbf849f8acd93.mp3"}}, {"t": "So no matter how hard we drive, at most half of the atoms end up excited. This is saturation.", "a": {"steffan": "audio/steffan_d2df86ff6ab9820f.mp3", "guy": "audio/guy_87252bbb416ea3d3.mp3", "christopher": "audio/christopher_3f972bea38bf8b7f.mp3", "eric": "audio/eric_95a0586f62f8e76a.mp3", "ava": "audio/ava_62d68f1eccf35e09.mp3"}}, {"t": "Why exactly one half? Because the light causes absorption and stimulated emission with the same strength.", "a": {"steffan": "audio/steffan_4ebe6b0d79df25da.mp3", "guy": "audio/guy_a5d77f0f2844882e.mp3", "christopher": "audio/christopher_e790ce82aea5f396.mp3", "eric": "audio/eric_d5ae9c87cf88c317.mp3", "ava": "audio/ava_bc310ba5480f97bd.mp3"}}, {"t": "Once the populations are equal, every absorption is balanced by a stimulated emission, and the light cannot push more atoms up.", "a": {"steffan": "audio/steffan_cf5ad78379d99f4c.mp3", "guy": "audio/guy_1afa2e6a5d069568.mp3", "christopher": "audio/christopher_9067b8218ac2d157.mp3", "eric": "audio/eric_b667d360bfb411ad.mp3", "ava": "audio/ava_1553a73d41a8dc21.mp3"}}, {"t": "So a two-level system driven by light can never reach population inversion.", "a": {"steffan": "audio/steffan_699db3d79eccfa7f.mp3", "guy": "audio/guy_89965f7fd13c19a7.mp3", "christopher": "audio/christopher_f5e41a9b264e0c6d.mp3", "eric": "audio/eric_9b056dc625b0835e.mp3", "ava": "audio/ava_a5565aa0d3e95acd.mp3"}}, {"t": "It is useful to write s in terms of the intensity: s is the intensity divided by the saturation intensity, times a Lorentzian factor in the detuning.", "a": {"steffan": "audio/steffan_ff42ec1662595e70.mp3", "guy": "audio/guy_e24f46a68992b0bd.mp3", "christopher": "audio/christopher_d1eeb177cf80bb1e.mp3", "eric": "audio/eric_78dc99d3bb9cd53e.mp3", "ava": "audio/ava_d94a20d228d8e03a.mp3"}}, {"t": "The saturation intensity is the intensity at which s equals one on resonance.", "a": {"steffan": "audio/steffan_ba0c1d741bc43864.mp3", "guy": "audio/guy_f2664e7c27d8ff23.mp3", "christopher": "audio/christopher_c0056da12e14b170.mp3", "eric": "audio/eric_f7830e0ab1633360.mp3", "ava": "audio/ava_232867ad16b5418e.mp3"}}, {"t": "For a typical atomic transition it is low, of the order of one milliwatt per square centimeter, which a small laser easily reaches.", "a": {"steffan": "audio/steffan_79e0e0f1d6b3f8d7.mp3", "guy": "audio/guy_0a8492f8cc3c8348.mp3", "christopher": "audio/christopher_d9bad547f8f69aa1.mp3", "eric": "audio/eric_37cea9cf1809ad20.mp3", "ava": "audio/ava_9c953dbef4aa7720.mp3"}}]}, {"title": "Dielectric response", "items": [{"t": "So far, we counted atoms. Now we ask what the atoms do to the light.", "a": {"steffan": "audio/steffan_e55c47eb1c3a90ed.mp3", "guy": "audio/guy_74739c86ebd2f259.mp3", "christopher": "audio/christopher_19bd01587002c683.mp3", "eric": "audio/eric_42218ccf2ada6256.mp3", "ava": "audio/ava_36f7df3fb5a60a08.mp3"}}, {"t": "The light field drives each atom, and the atom responds with an oscillating dipole moment.", "a": {"steffan": "audio/steffan_b57bd6e726df1ca1.mp3", "guy": "audio/guy_41a88c5d395001e7.mp3", "christopher": "audio/christopher_9fc6e991c00d1e8c.mp3", "eric": "audio/eric_9f4812eb7ce5595b.mp3", "ava": "audio/ava_9364be22f446a0ff.mp3"}}, {"t": "To find it, we take the expectation value of the dipole operator in the state of the atom.", "a": {"steffan": "audio/steffan_83ecff79eb731249.mp3", "guy": "audio/guy_096f536aef3a2623.mp3", "christopher": "audio/christopher_107a94a24580c997.mp3", "eric": "audio/eric_d9f06338f81768b8.mp3", "ava": "audio/ava_e5b45f981fa205a9.mp3"}}, {"t": "Remember that the diagonal elements of the dipole are zero. So the dipole comes only from the product of the a and b amplitudes.", "a": {"steffan": "audio/steffan_2d6eb64cd26d04c0.mp3", "guy": "audio/guy_1bb45a52738cdd16.mp3", "christopher": "audio/christopher_42c71574d5514660.mp3", "eric": "audio/eric_cd32a86db300945b.mp3", "ava": "audio/ava_893983d23c9a68d9.mp3"}}, {"t": "That means a dipole only appears when the atom is in a superposition of a and b.", "a": {"steffan": "audio/steffan_deec1607299f3c50.mp3", "guy": "audio/guy_6d6761e0c7a66350.mp3", "christopher": "audio/christopher_bd3fa4f3ace903b8.mp3", "eric": "audio/eric_d12f93c5b4a67c6b.mp3", "ava": "audio/ava_5ef8410f1e1a8819.mp3"}}, {"t": "This dipole oscillates at the frequency of the light.", "a": {"steffan": "audio/steffan_451be59b6f37e243.mp3", "guy": "audio/guy_53b03a9d1eec0586.mp3", "christopher": "audio/christopher_0ebafc19d3122ca8.mp3", "eric": "audio/eric_d52aafaa4bcb8107.mp3", "ava": "audio/ava_b91cf415b6b3d103.mp3"}}, {"t": "Again, we add up the dipoles of all atoms, weighted by their survival probability.", "a": {"steffan": "audio/steffan_0a52876b1a20bd17.mp3", "guy": "audio/guy_996e25224fb6aa8f.mp3", "christopher": "audio/christopher_9603fcea03c7a5f4.mp3", "eric": "audio/eric_1927f0baecdcf217.mp3", "ava": "audio/ava_471fbb5bfa5c3d1e.mp3"}}, {"t": "The total dipole moment per unit volume is called the polarization, P.", "a": {"steffan": "audio/steffan_b92f2a4ba93727ea.mp3", "guy": "audio/guy_4b1051c8215b0c1c.mp3", "christopher": "audio/christopher_1d9d70afb17d8ee9.mp3", "eric": "audio/eric_c553a1caaa021898.mp3", "ava": "audio/ava_84a9d5777a62ec81.mp3"}}]}, {"title": "The dielectric susceptibility", "items": [{"t": "The polarization is proportional to the field, and the constant of proportionality is the dielectric susceptibility, chi.", "a": {"steffan": "audio/steffan_4ed5606dd2cc5ae1.mp3", "guy": "audio/guy_5c86419be93fc4e5.mp3", "christopher": "audio/christopher_8d428b90892d2c19.mp3", "eric": "audio/eric_fda2de72372b9d8c.mp3", "ava": "audio/ava_7ae193a652541cf4.mp3"}}, {"t": "Chi is complex: it has a real part, chi prime, and an imaginary part, chi double prime.", "a": {"steffan": "audio/steffan_e4ae12be3d467d2c.mp3", "guy": "audio/guy_e6dd6acc088c5673.mp3", "christopher": "audio/christopher_3b82daa1eea2dae6.mp3", "eric": "audio/eric_37b5e264b17c68e7.mp3", "ava": "audio/ava_1a72a6df430493d4.mp3"}}, {"t": "The two parts have a clear meaning.", "a": {"steffan": "audio/steffan_fc966e80eea9e4e5.mp3", "guy": "audio/guy_df5fbc4f90ae5d3b.mp3", "christopher": "audio/christopher_fd2cf98e563cda25.mp3", "eric": "audio/eric_018a739dadc9315f.mp3", "ava": "audio/ava_5a4a922a235c374c.mp3"}}, {"t": "The real part gives the part of the polarization that oscillates in phase with the field.", "a": {"steffan": "audio/steffan_231353a5dd848b04.mp3", "guy": "audio/guy_6bc407658b3a56b2.mp3", "christopher": "audio/christopher_7fefe868d51043bb.mp3", "eric": "audio/eric_cd1928c1229294bc.mp3", "ava": "audio/ava_413065ae752455a7.mp3"}}, {"t": "The imaginary part gives the part that oscillates a quarter period behind the field.", "a": {"steffan": "audio/steffan_c166b6794300a780.mp3", "guy": "audio/guy_4a48a10aa6331553.mp3", "christopher": "audio/christopher_bec52a5b8a9f923f.mp3", "eric": "audio/eric_cd47f3c22ed3a931.mp3", "ava": "audio/ava_e19a2061ffee00c9.mp3"}}, {"t": "The in-phase part changes the speed of the wave. This is dispersion, the refractive index.", "a": {"steffan": "audio/steffan_df8403f51521eff2.mp3", "guy": "audio/guy_f4d8238812ba7af5.mp3", "christopher": "audio/christopher_19d18db2a456efe0.mp3", "eric": "audio/eric_c09d52d440e232ef.mp3", "ava": "audio/ava_63336b6c90d8b32f.mp3"}}, {"t": "The out-of-phase part takes energy from the wave. This is absorption.", "a": {"steffan": "audio/steffan_5fc995c57f39c7dd.mp3", "guy": "audio/guy_82c5068befd85762.mp3", "christopher": "audio/christopher_38adfffbd8a1a49d.mp3", "eric": "audio/eric_66ad8576a0f66afc.mp3", "ava": "audio/ava_60f4b74cf9f22b8a.mp3"}}, {"t": "At low intensity, we get the linear susceptibility, chi one.", "a": {"steffan": "audio/steffan_5cc78363c664cfe0.mp3", "guy": "audio/guy_655f933f83e560d0.mp3", "christopher": "audio/christopher_6ccddec793373d41.mp3", "eric": "audio/eric_486a1ca8b9e6a5ff.mp3", "ava": "audio/ava_4a8c1b41c1a683c8.mp3"}}, {"t": "It is proportional to the atomic density, N over V, and to the dipole matrix element squared.", "a": {"steffan": "audio/steffan_302cb9c44d0a0135.mp3", "guy": "audio/guy_7187e37b6a562ebe.mp3", "christopher": "audio/christopher_d577f1109c31152e.mp3", "eric": "audio/eric_c96e0b57453d37d9.mp3", "ava": "audio/ava_107690e334bfc70d.mp3"}}, {"t": "Its frequency dependence is omega zero minus omega plus i gamma D, divided by gamma D squared plus delta squared.", "a": {"steffan": "audio/steffan_f6f4c14c2207cc44.mp3", "guy": "audio/guy_b25a8a6632e7f21a.mp3", "christopher": "audio/christopher_be8e0eecc533f9be.mp3", "eric": "audio/eric_9b6caa93acc2547e.mp3", "ava": "audio/ava_77733311cee05c56.mp3"}}, {"t": "The imaginary part, the absorption, is a Lorentzian with a full width of two gamma D, centered at omega zero.", "a": {"steffan": "audio/steffan_27158884c8af4e67.mp3", "guy": "audio/guy_0d9eb46e63e33613.mp3", "christopher": "audio/christopher_ff73e667c79e2988.mp3", "eric": "audio/eric_3edcb623eb9a5121.mp3", "ava": "audio/ava_1480556af3910ac1.mp3"}}, {"t": "The real part, the dispersion, has a different shape. It is zero exactly on resonance, positive below the resonance, and negative above it.", "a": {"steffan": "audio/steffan_d3191254ed78d680.mp3", "guy": "audio/guy_33137f7c4b7681fb.mp3", "christopher": "audio/christopher_9633db3230bad67b.mp3", "eric": "audio/eric_a74c02b6ebc8fc33.mp3", "ava": "audio/ava_f47294ca22c0f93f.mp3"}}, {"t": "Far from resonance, the dispersion falls off as one over the detuning, but the absorption falls off faster, as one over the detuning squared.", "a": {"steffan": "audio/steffan_9b2ee95b473690cb.mp3", "guy": "audio/guy_a9c321c90c0f9e5b.mp3", "christopher": "audio/christopher_a869c952f08cdcf8.mp3", "eric": "audio/eric_d4d9a7ff1f58d24a.mp3", "ava": "audio/ava_2eb166ed4799afb1.mp3"}}, {"t": "So far from resonance, a medium barely absorbs, but it still bends and slows the light. That is why glass is transparent and still has a refractive index.", "a": {"steffan": "audio/steffan_65ef4c18e113c305.mp3", "guy": "audio/guy_744aa74af331a464.mp3", "christopher": "audio/christopher_29cbdd854e748648.mp3", "eric": "audio/eric_29ef1baaaea26cb2.mp3", "ava": "audio/ava_b95237903153fce7.mp3"}}, {"t": "In the wings, the refractive index increases with frequency. This is normal dispersion.", "a": {"steffan": "audio/steffan_091d39439c470197.mp3", "guy": "audio/guy_c34a3f80a4be39bb.mp3", "christopher": "audio/christopher_5d28ed0c81443b1f.mp3", "eric": "audio/eric_a0f69ebd38887aae.mp3", "ava": "audio/ava_dffffddf083328c2.mp3"}}, {"t": "Close to resonance, it decreases with frequency. This is anomalous dispersion.", "a": {"steffan": "audio/steffan_b70aa1ba39ca5010.mp3", "guy": "audio/guy_9eefe23b73e990ae.mp3", "christopher": "audio/christopher_fd16428b291b84f9.mp3", "eric": "audio/eric_52abc78e42d363dc.mp3", "ava": "audio/ava_f2b86eccfbab6586.mp3"}}, {"t": "This linear result has exactly the same form as the classical model of an electron bound to the atom by a spring-like restoring force.", "a": {"steffan": "audio/steffan_ac465b37ff0c930e.mp3", "guy": "audio/guy_cf8ce122b2d6580c.mp3", "christopher": "audio/christopher_2380ecb1eb527261.mp3", "eric": "audio/eric_74fd65c4294e2588.mp3", "ava": "audio/ava_f69fe37b1eeef490.mp3"}}, {"t": "That is why the classical model worked so well before lasers existed: with weak light, you are always in the linear regime.", "a": {"steffan": "audio/steffan_c731b74312b562db.mp3", "guy": "audio/guy_ef8a3aaa7fc638e1.mp3", "christopher": "audio/christopher_15fa753a2360efa4.mp3", "eric": "audio/eric_64d96de18f908570.mp3", "ava": "audio/ava_d057f538b584f581.mp3"}}, {"t": "At high intensity, the susceptibility becomes chi one divided by one plus s.", "a": {"steffan": "audio/steffan_6ed283ab3717b06f.mp3", "guy": "audio/guy_b0f364dfac4d1ed0.mp3", "christopher": "audio/christopher_b1885d466d3da5b7.mp3", "eric": "audio/eric_e5d99a7c7325cfcb.mp3", "ava": "audio/ava_ef66dbcaf8d94d34.mp3"}}, {"t": "So strong light makes the medium absorb less. The transition is saturated, and the medium becomes more transparent.", "a": {"steffan": "audio/steffan_67cef851b8f2d763.mp3", "guy": "audio/guy_73aa716f60633416.mp3", "christopher": "audio/christopher_76441ec78294fad7.mp3", "eric": "audio/eric_eda94b5d0c0df58c.mp3", "ava": "audio/ava_549ae5d82aba4c45.mp3"}}]}, {"title": "Attenuation of the light", "items": [{"t": "Now we let the wave travel through the medium.", "a": {"steffan": "audio/steffan_42c2351a8c8751a4.mp3", "guy": "audio/guy_5bcbb441533a9f3d.mp3", "christopher": "audio/christopher_28d864af2c8e25bb.mp3", "eric": "audio/eric_c4c409341b7d6fa5.mp3", "ava": "audio/ava_727704aa95ddf81b.mp3"}}, {"t": "The wave vector is the refractive index times omega over c, and the refractive index squared is one plus chi.", "a": {"steffan": "audio/steffan_b4b8110b3e206f0f.mp3", "guy": "audio/guy_69f4ebed9d9d86bf.mp3", "christopher": "audio/christopher_c423fab33c8466b8.mp3", "eric": "audio/eric_aebdfaca044a3593.mp3", "ava": "audio/ava_9cede7f25669a098.mp3"}}, {"t": "Chi is complex, so the refractive index and the wave vector are complex too.", "a": {"steffan": "audio/steffan_ea32ab3ecc678c52.mp3", "guy": "audio/guy_7efb2f3960fb29d6.mp3", "christopher": "audio/christopher_df382a102be5b4d3.mp3", "eric": "audio/eric_81e1e4d445c7326a.mp3", "ava": "audio/ava_d329ac3a3a66c673.mp3"}}, {"t": "For a dilute gas, chi is small, so the refractive index is about one plus chi over two.", "a": {"steffan": "audio/steffan_294d8e5f142f849b.mp3", "guy": "audio/guy_77426ecae9db8353.mp3", "christopher": "audio/christopher_4f891c744036867c.mp3", "eric": "audio/eric_a92ff6d1efe7aef4.mp3", "ava": "audio/ava_b0c4487f6db29c3e.mp3"}}, {"t": "Write the wave vector as a real part, k prime, plus i times an imaginary part, k double prime.", "a": {"steffan": "audio/steffan_33c64916d49d9700.mp3", "guy": "audio/guy_bddb15d6327138b3.mp3", "christopher": "audio/christopher_8ac35a30526bf0e9.mp3", "eric": "audio/eric_9fb4ce6f989f2efd.mp3", "ava": "audio/ava_0bbda95b5950f0c2.mp3"}}, {"t": "The imaginary part is chi double prime times omega over two c.", "a": {"steffan": "audio/steffan_b3f65d30f7d549ad.mp3", "guy": "audio/guy_c1fda3a319a74c78.mp3", "christopher": "audio/christopher_fa9ca40d525b813b.mp3", "eric": "audio/eric_f59e24ef1f702c06.mp3", "ava": "audio/ava_2657988a5cf15681.mp3"}}, {"t": "For a wave traveling along z, the field then carries a factor e to the minus k double prime times z.", "a": {"steffan": "audio/steffan_0a5e0ff8bf21c3a5.mp3", "guy": "audio/guy_7c66c955de21e5d9.mp3", "christopher": "audio/christopher_da8a62ec397e644e.mp3", "eric": "audio/eric_3685131dae85a281.mp3", "ava": "audio/ava_be4a80a25d34e071.mp3"}}, {"t": "In a normal medium, chi double prime is positive, so k double prime is positive.", "a": {"steffan": "audio/steffan_dabda9b542955ae9.mp3", "guy": "audio/guy_c2e659ce17a693fd.mp3", "christopher": "audio/christopher_d5a949056a66186c.mp3", "eric": "audio/eric_1e2f9b87ef096c2d.mp3", "ava": "audio/ava_448887078739065b.mp3"}}, {"t": "So the amplitude of the wave decreases exponentially as it travels. The light is absorbed.", "a": {"steffan": "audio/steffan_6d3bbe7d09367ea9.mp3", "guy": "audio/guy_28af132002e22544.mp3", "christopher": "audio/christopher_9cd12e14529b7dd6.mp3", "eric": "audio/eric_505452e8f0067329.mp3", "ava": "audio/ava_dca2797e9371ab8d.mp3"}}, {"t": "The absorption is proportional to the atomic density, and it follows the same Lorentzian as chi double prime.", "a": {"steffan": "audio/steffan_687e2d39866ef395.mp3", "guy": "audio/guy_9af339b62acae14f.mp3", "christopher": "audio/christopher_2541a0a13e0a5aa5.mp3", "eric": "audio/eric_72322a8641b59e90.mp3", "ava": "audio/ava_fc58a976a9bd2963.mp3"}}]}, {"title": "Population inversion and amplification", "items": [{"t": "Now we flip the situation: we feed atoms only into the upper level, b.", "a": {"steffan": "audio/steffan_1c0c6d49f1bec5e1.mp3", "guy": "audio/guy_a9590f3dd2a98fc8.mp3", "christopher": "audio/christopher_47897a83b0b793ce.mp3", "eric": "audio/eric_b1a808951411cde4.mp3", "ava": "audio/ava_edfd72f15cf3210e.mp3"}}, {"t": "The calculation is the same as before, with the roles of a and b swapped.", "a": {"steffan": "audio/steffan_859b5b06dad30f6a.mp3", "guy": "audio/guy_0b53168208d8a8ad.mp3", "christopher": "audio/christopher_d4d46809904985ca.mp3", "eric": "audio/eric_64db5483204f10e6.mp3", "ava": "audio/ava_8bab6b1aed294c74.mp3"}}, {"t": "Now the light moves atoms down from b to a by stimulated emission.", "a": {"steffan": "audio/steffan_802e937628312b60.mp3", "guy": "audio/guy_2f0221f5989eadf9.mp3", "christopher": "audio/christopher_698230f1129e827c.mp3", "eric": "audio/eric_49937b1246095d66.mp3", "ava": "audio/ava_3dd2ad145467ed8e.mp3"}}, {"t": "The number of atoms in a becomes N over two times s over one plus s, so N a always stays below N b.", "a": {"steffan": "audio/steffan_e6eb53cdc8b86f9f.mp3", "guy": "audio/guy_189176833fbd6473.mp3", "christopher": "audio/
